# Production single-stack deploy: api + postgres only.
#
# Postgres stays on the internal compose network — there is no published
# host port. The api reaches it as `postgres:5432` (service-name DNS).
#
# Run:
#   cp deploy/.env.example deploy/.env   # then edit secrets
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
#
# This stack is target-agnostic. It runs on any Linux host with Docker —
# a cheap VPS, a home server, or a cloud VM. DNS enforcement and usage
# tracking run on the gateway router (openwrt/ or opnsense/ agent).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WIFIHAVEN_DB_USER:?WIFIHAVEN_DB_USER required}
      POSTGRES_PASSWORD: ${WIFIHAVEN_DB_PASSWORD:?WIFIHAVEN_DB_PASSWORD required}
      POSTGRES_DB: ${WIFIHAVEN_DB_NAME:?WIFIHAVEN_DB_NAME required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    image: ghcr.io/wifihaven/wifihaven-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WIFIHAVEN_MODE: api
      WIFIHAVEN_DB_HOST: postgres
      WIFIHAVEN_DB_PORT: "5432"
      WIFIHAVEN_DB_NAME: ${WIFIHAVEN_DB_NAME}
      WIFIHAVEN_DB_USER: ${WIFIHAVEN_DB_USER}
      WIFIHAVEN_DB_PASSWORD: ${WIFIHAVEN_DB_PASSWORD}
      WIFIHAVEN_HTTP_PORT: "8080"
      WIFIHAVEN_JWT_SECRET: ${WIFIHAVEN_JWT_SECRET:?WIFIHAVEN_JWT_SECRET required (>=32 chars)}
      WIFIHAVEN_JWT_HOURS: ${WIFIHAVEN_JWT_HOURS:-24}
      # #612: comma-separated browser origins allowed to call this API. Leave
      # empty for self-hosted single-origin installs (default). Never use "*".
      WIFIHAVEN_ALLOWED_ORIGINS: ${WIFIHAVEN_ALLOWED_ORIGINS:-}
      # #944: hostnames always present in every profile's snapshot extraAllowed
      # so a paused operator can still reach the admin UI to unpause. Set per
      # deployment (prod OR staging hostnames, not both). Empty for self-hosted
      # single-origin installs.
      WIFIHAVEN_UI_ALLOWED_HOSTS: ${WIFIHAVEN_UI_ALLOWED_HOSTS:-}
      # #614: serve the bundled SPA from the JVM. Default true preserves the
      # self-hosted single-origin install. Set to false only when a CDN
      # (Render Static Sites / Cloudflare Pages) is the authoritative SPA.
      WIFIHAVEN_SERVE_SPA: ${WIFIHAVEN_SERVE_SPA:-true}
    ports:
      - "${WIFIHAVEN_API_BIND:-0.0.0.0}:${WIFIHAVEN_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
