# #2200 / #2241 — the support responder agent's execution environment (Anthropic Managed Agents).
#
# LIMITED networking is load-bearing defense-in-depth: even a fully prompt-hijacked agent can only
# reach the WifiHaven API (the token-gated callback endpoints) and public GitHub (source/docs
# grounding). There is no route to an attacker-chosen host, so "exfiltrate to evil.example" fails
# at the network layer regardless of what the model was talked into. Package managers stay off —
# the agent reads and replies; it does not install software.
#
# Apply once per workspace (see README.md): staging sessions use the same definition — the agent
# calls whichever agentApiBase its kickoff names, so api-staging is allowlisted alongside prod.
name: wifihaven-support-env
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: false
    allow_mcp_servers: false
    allowed_hosts:
      - api.wifihaven.net
      - api-staging.wifihaven.net
      - github.com
      - raw.githubusercontent.com
      - api.github.com
      - objects.githubusercontent.com
