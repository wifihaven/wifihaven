# #2203 — the WifiHaven PRESS/PR Cloudflare Email Worker (deploy/press-worker/).
#
# Cloudflare Email Routing catches press@wifihaven.net and runs this Worker per message; it signs and
# POSTs a small envelope to the API's /api/press/inbound (see src/index.ts + README.md). This Worker
# holds only the shared HMAC secret — no Anthropic key, no data access.
#
# Deploy:  npm install && npx wrangler deploy            (prod, the top-level env)
#          npx wrangler deploy --env staging             (staging)
# Secret:  npx wrangler secret put PRESS_WEBHOOK_SECRET   (== the API's press.webhookSecret)
# Routing: bind press@wifihaven.net → this Worker in Cloudflare → Email Routing (see README.md).

name = "wifihaven-press-worker"
main = "src/index.ts"
compatibility_date = "2026-05-17"
compatibility_flags = ["nodejs_compat"]

# This is an Email Worker (invoked by Cloudflare Email Routing, see README.md) — it has no HTTP routes
# and the account registers no workers.dev subdomain. Without this, `wrangler deploy` aborts trying to
# publish to workers.dev ("register a workers.dev subdomain … or specify routes"). The script still
# uploads and stays bindable by the cloudflare_email_routing_rule resources. Must be set per-env — it
# is not inherited by named environments (#2346).
workers_dev = false

# Prod: the API the signed envelope is POSTed to. PRESS_WEBHOOK_SECRET is a secret (wrangler secret
# put), NEVER a plaintext var here.
[vars]
PRESS_API_URL = "https://api.wifihaven.net"

# #2673 — Workers Logs ON, declared here rather than left to the dashboard toggle.
#
# This Worker's ONLY in-band diagnostics are the `console.error` / `console.warn` calls in
# src/index.ts — the missing-binding guard, the loop-guard skip (#2442), and a failed API POST.
# (Named rather than line-numbered: the refs here went stale twice.) With
# observability off those go nowhere, and the Worker becomes undiagnosable — which is exactly how
# #2673 stayed invisible: press@ mail was accepted and silently discarded for weeks because
# PRESS_WEBHOOK_SECRET was unset, the guard logged a warning, and nothing was listening.
#
# It is declared in config because the dashboard toggle is EPHEMERAL relative to CD: the next
# `wrangler deploy` from .github/workflows/master-press-worker.yml overwrites whatever the dashboard
# holds, so a hand-flipped toggle silently reverts to dark on the next unrelated deploy. Same class
# of trap as the missing secret it exists to expose.
#
# `traces` is left off deliberately — logs are what carry the guard's message; traces are cost with
# no diagnostic value for a Worker whose whole job is one fetch.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[env.staging]
name = "wifihaven-press-worker-staging"
workers_dev = false

# Per-env, NOT inherited — same reason as `workers_dev` above (#2346). A named environment that
# omits this deploys dark even though the top-level block sets it.
[env.staging.observability]
enabled = true

[env.staging.observability.logs]
enabled = true
invocation_logs = true

[env.staging.vars]
PRESS_API_URL = "https://api-staging.wifihaven.net"
