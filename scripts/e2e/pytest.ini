[pytest]
testpaths = scenarios_fake
python_files = test_*.py
addopts = -ra -v --tb=short --strict-markers
markers =
    enrollment: scenario 1 — agent registers with the API
    allowed: scenario 2 — allowed request succeeds, event recorded
    blocked: scenario 3 — blocked domain rejected, event recorded
    daily_limit: scenario 4 — per-app daily limit enforced
    usage: scenario 5 — usage reflected in /api/logs and /api/time/status
    blocked_page: scenario 6 — block page rendered for blocked HTTP traffic
    pause: suite A (#428) — pause enforcement
    extra_blocked: suite B (#429) — extraBlocked Truth-1 + scoping
    schedule: suite C (#430) — schedule enforcement
    time_limit: suite D (#431) — daily time-limit granularity + rollover
    reassignment: suite E (#432) — profile reassignment
    unknown_device: suite F (#432) — unknown-device autocreation
    install_health: post-install router health asserts (#922 — cron, etc.)
    nflog: #1122 — forward-drop visibility via nflog (per-MAC drop comment + agent emission)
    cname_direct_requery: suite G (#1351) — ea_/eb_ population for directly-queried CNAME targets
    global_policy: suite H (#1460) — @global_allow / @global_block fleet-wide enforcement (gate for #1321)
    smoke: fast subset across suites (one short case each) for PR gating
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
