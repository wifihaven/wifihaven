# Dependabot runs security updates only (repo setting); this file shapes how they are grouped.
#
# Without it, the repo-level "grouped security updates" setting bundles every npm security fix
# into one PR, including any parent-package MAJOR bump needed to reach a fixed transitive version.
# #2855 bundled patch fixes (brace-expansion, js-yaml, undici, source-map-js) with vitest 4->5 and
# tailwindcss 3->4; the vitest half failed `npm ci` and blocked the patches.
#
# Patch/minor security fixes are grouped into one PR; a major lands as its own PR so it can be
# migrated (or closed) without blocking the rest.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /web
      - /deploy/press-worker
    schedule:
      interval: weekly
    # 0 disables version-update PRs; security updates are not affected by this limit.
    open-pull-requests-limit: 0
    groups:
      npm-security-patch-minor:
        applies-to: security-updates
        update-types:
          - patch
          - minor
