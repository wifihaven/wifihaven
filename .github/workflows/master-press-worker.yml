name: Master Press Worker CD

# #2203 — deploys the press Cloudflare Email Worker (deploy/press-worker/) declaratively on merge,
# and syncs its shared HMAC secret. The Worker catches press@wifihaven.net (bound by the
# cloudflare_email_routing_rule in infra/cloudflare/, applied by master-cloudflare.yml), signs the
# inbound email, and POSTs it to the API's /api/press/inbound.
#
# Mirrors the SPA Pages deploy (master-api-ui.yml) — cloudflare/wrangler-action bundles the worker
# (esbuild) and pushes it, so there is NO manual `wrangler deploy` and NO dashboard step
# (docs/process/declarative-config.md). Deploys prod + staging; the per-env PRESS_WEBHOOK_SECRET is
# set from a repo secret in the same run (it must equal the API's WIFIHAVEN_PRESS_WEBHOOK_SECRET for
# that environment).
#
# Dark-by-default, mirroring master-support-agent.yml: without CLOUDFLARE_API_TOKEN the job skips
# with a notice — the whole press feature ships dark until the operator provisions it
# (deploy/press-worker/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'deploy/press-worker/**'
      - '.github/workflows/master-press-worker.yml'
  workflow_dispatch:

# Serialize deploys of the same worker; queue rather than cancel so the latest repo state always wins.
concurrency:
  group: master-press-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-press-worker:
    name: Deploy press Email Worker (prod + staging)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the Cloudflare token is configured
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping press-worker deploy. The press feature ships dark until provisioned (deploy/press-worker/README.md)."
          fi

      # #2673: validate the signing secrets BEFORE anything deploys. Checking inside the deploy steps
      # would ship the new code first and fail afterwards, leaving a Worker that rejects every inbound
      # press email until someone redeploys. Both environments are checked together so one missing
      # secret does not deploy the other half and then stop.
      - name: Check both signing secrets are configured
        if: steps.gate.outputs.configured == 'true'
        env:
          PRESS_WEBHOOK_SECRET_PROD: ${{ secrets.PRESS_WEBHOOK_SECRET_PROD }}
          PRESS_WEBHOOK_SECRET_STAGING: ${{ secrets.PRESS_WEBHOOK_SECRET_STAGING }}
        run: |
          missing=""
          [ -n "$PRESS_WEBHOOK_SECRET_PROD" ]    || missing="$missing PRESS_WEBHOOK_SECRET_PROD"
          [ -n "$PRESS_WEBHOOK_SECRET_STAGING" ] || missing="$missing PRESS_WEBHOOK_SECRET_STAGING"
          if [ -n "$missing" ]; then
            echo "::error::repo secret(s) unset:$missing — a Worker deployed without its signing secret rejects all press mail (deploy/press-worker/src/index.ts). Set them to the matching API WIFIHAVEN_PRESS_WEBHOOK_SECRET and re-run. Nothing was deployed."
            exit 1
          fi

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: '22'

      # `npm ci` against the committed lockfile, matching the PR-time gate in ci.yml. With a floating
      # `npm install` here the gate bundles with the locked wrangler and the deploy bundles with
      # whatever `^4.20.0` resolves to that minute, so a green bundle check would not attest what
      # merge actually ships.
      - name: Install worker deps
        if: steps.gate.outputs.configured == 'true'
        working-directory: deploy/press-worker
        run: npm ci --no-audit --no-fund

      # Explicit `npx wrangler` (rather than wrangler-action's `secrets:` input) so the secret is set
      # against the correct environment with `--env` — the action's bulk secret upload does not target
      # a named env. `npm ci` above put wrangler on the path. Both secrets were validated by the
      # step above, so the sync is unconditional here.
      - name: Deploy press Worker (prod) + sync secret
        if: steps.gate.outputs.configured == 'true'
        working-directory: deploy/press-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # #2673: this read `secrets.PRESS_WEBHOOK_SECRET`, which DOES NOT EXIST — the repo secret is
          # `PRESS_WEBHOOK_SECRET_PROD` (staging below already used the `_STAGING` suffix). An unset
          # secret expands to the empty string, so the sync was skipped on every prod deploy and the
          # production Worker never received a signing secret. That is the mechanical cause of the
          # silent press@ discard.
          PRESS_WEBHOOK_SECRET: ${{ secrets.PRESS_WEBHOOK_SECRET_PROD }}
        run: |
          npx wrangler deploy
          printf '%s' "$PRESS_WEBHOOK_SECRET" | npx wrangler secret put PRESS_WEBHOOK_SECRET

      - name: Deploy press Worker (staging) + sync secret
        if: steps.gate.outputs.configured == 'true'
        working-directory: deploy/press-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRESS_WEBHOOK_SECRET: ${{ secrets.PRESS_WEBHOOK_SECRET_STAGING }}
        run: |
          npx wrangler deploy --env staging
          printf '%s' "$PRESS_WEBHOOK_SECRET" | npx wrangler secret put PRESS_WEBHOOK_SECRET --env staging
