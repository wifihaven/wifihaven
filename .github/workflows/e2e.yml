name: E2E + publish

# Runs e2e and smoke checks on every push to main and on pull requests.
# On push to main (or a v* tag), the publish job pushes the image to ghcr.io
# after all checks are green. Pull requests run the checks but do NOT publish.
# The opkg .ipk is published separately by openwrt-build.yml on v* tags.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one publish can run at a time.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/familydns-api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bootstrap-smoke:
    name: bootstrap-host.sh smoke (Ubuntu container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run bootstrap test image
        run: |
          docker build -f docker/bootstrap-test.Dockerfile -t familydns-bootstrap-test .
          docker run --rm familydns-bootstrap-test

  e2e:
    name: Live e2e against staging stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + start staging stack
        run: |
          docker compose -f docker/docker-compose.yml up -d --build --wait

      - name: Run e2e tests
        run: scripts/e2e-tests.sh

      - name: Dump api logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml logs api || true
          docker compose -f docker/docker-compose.yml logs postgres || true

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  prod-stack-smoke:
    name: deploy/docker-compose.prod.yml smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run prod-stack smoke
        run: scripts/smoke-prod.sh

  publish:
    name: Publish Docker image to ghcr.io
    needs: [bootstrap-smoke, e2e, prod-stack-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
