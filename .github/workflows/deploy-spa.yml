name: Deploy SPA (Cloudflare Pages)

# Builds the Vite SPA in CI and pushes the artifact to Cloudflare Pages via
# Wrangler. CI is the only thing that promotes, mirroring the deploy-flow
# philosophy from #588. Two Pages projects, one per env (parity with the
# split API services on Render).
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN  Pages:Edit scope. See docs/deploy-cloud.md.
#   CLOUDFLARE_ACCOUNT_ID The Cloudflare account that owns the Pages projects.
#
# Tracked under #613 (move SPA from Render Static Sites to Cloudflare Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize SPA deploys so two quick pushes can't race the Wrangler upload.
# cancel-in-progress is OFF here intentionally — cancelling a half-uploaded
# deploy mid-flight leaves Pages in an inconsistent partial state. Let the
# earlier one finish; the later push will run after.
concurrency:
  group: deploy-spa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Staging SPA ────────────────────────────────────────────────────────────
  deploy-spa-staging:
    name: Build + deploy SPA → wifihaven-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Build SPA (staging)
        working-directory: web
        env:
          VITE_API_BASE_URL: https://api-staging.wifihaven.net
        run: npm run build

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=wifihaven-staging --branch=main

  # ── Production SPA ─────────────────────────────────────────────────────────
  # TODO(#588): gate prod on the same staging-smoke chain as the API deploy
  # once #588 lands. Until then, prod deploys unconditionally after staging
  # completes; the concurrency group above ensures pushes don't race.
  deploy-spa-prod:
    name: Build + deploy SPA → wifihaven (prod)
    needs: deploy-spa-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Build SPA (prod)
        working-directory: web
        env:
          VITE_API_BASE_URL: https://api.wifihaven.net
        run: npm run build

      - name: Deploy to Cloudflare Pages (prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=wifihaven --branch=main
