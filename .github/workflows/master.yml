name: Master CD

# Runs on every push to main:
#   1. ci-tests   — full CI matrix via workflow_call to ci.yml (unconditional).
#   2. e2e/smoke  — bootstrap, e2e, prod-stack smokes (unconditional).
#   3. publish    — Docker image to ghcr.io, only when api-image inputs changed
#                   AND all of the above passed AND a reviewer approves the
#                   `production` environment.
#
# OpenWRT .ipk/.apk publishing is handled by openwrt-build.yml on v* tags
# (issues #190, #191).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one publish can run at a time. If a new run kicks off while an older
# run is still paused waiting on the production environment approval, cancel
# the older one — we always want the latest commit's run to take precedence.
concurrency:
  group: master-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/familydns-api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── 0. Detect path changes (gates publish only, not tests) ────────────────
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Inputs that get baked into the API Docker image. Keep in sync with
          # docker/Dockerfile COPY directives — if it's not copied into the
          # image, it shouldn't trigger a republish.
          filters: |
            api:
              - 'api/**'
              - 'shared/**'
              - 'web/**'
              - 'build.mill'
              - 'docker/**'
              - 'config/application.conf.example'
              - '.scalafmt.conf'
              - '.scalafix.conf'

  # ── 1. Full CI test matrix (unit, lint, lua, python, shell, frontend) ─────
  # Runs unconditionally — issue #190 wants test failures on main to block
  # publish regardless of which paths changed.
  ci-tests:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ── 2. E2E + smoke tests (unconditional) ──────────────────────────────────
  bootstrap-smoke:
    name: bootstrap-host.sh smoke (Ubuntu container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run bootstrap test image
        run: |
          docker build -f docker/bootstrap-test.Dockerfile -t familydns-bootstrap-test .
          docker run --rm familydns-bootstrap-test

  e2e:
    name: Live e2e against staging stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + start staging stack
        run: |
          docker compose -f docker/docker-compose.yml up -d --build --wait

      - name: Run e2e tests
        run: scripts/e2e-tests.sh

      - name: Run router e2e tests
        run: scripts/e2e-router.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml logs api          || true
          docker compose -f docker/docker-compose.yml logs postgres     || true
          docker compose -f docker/docker-compose.yml logs fake-router  || true

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  prod-stack-smoke:
    name: deploy/docker-compose.prod.yml smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run prod-stack smoke
        run: scripts/smoke-prod.sh

  # ── 3. Publish API image (path-filtered) ──────────────────────────────────
  # NOTE: manual approval gate temporarily removed for live debugging of #228;
  # restore via #244 once the bug is fixed and we're back in normal cadence.
  publish-api:
    name: Publish Docker image to ghcr.io
    needs: [changes, ci-tests, bootstrap-smoke, e2e, prod-stack-smoke]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for linux/arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
