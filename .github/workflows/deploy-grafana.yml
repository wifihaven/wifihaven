name: Deploy Grafana dashboards

# Provisions the in-repo Grafana dashboards (deploy/grafana/dashboards/*.json)
# into Grafana Cloud declaratively via the infra/grafana Terraform (#1270,
# follow-up to #1209). The repo JSON is canonical; this workflow reconciles
# Grafana Cloud to match on every push to main that touches the dashboards or
# the Terraform.
#
# Auth comes from two GitHub Actions secrets set out-of-band (never committed):
#   gh secret set GRAFANA_URL  -R wifihaven/wifihaven --body 'https://<stack>.grafana.net'
#   gh secret set GRAFANA_AUTH -R wifihaven/wifihaven --body '<service-account token>'
# Until both are set the apply step is gated off, so this workflow is a no-op.
#
# Independent of the API (Render) and SPA (Cloudflare Pages) deploy planes —
# a dashboard change never touches application availability.

on:
  push:
    branches: [main]
    paths:
      - 'infra/grafana/**'
      - 'deploy/grafana/dashboards/**'
      - '.github/workflows/deploy-grafana.yml'
  workflow_dispatch:

# Least privilege: this workflow only reads the repo and talks to Grafana
# Cloud over the network using the secrets below.
permissions:
  contents: read

concurrency:
  group: deploy-grafana
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform apply (Grafana Cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Grafana secrets are configured
        id: gate
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
        run: |
          if [ -n "$GRAFANA_URL" ] && [ -n "$GRAFANA_AUTH" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GRAFANA_URL / GRAFANA_AUTH not set — skipping apply. Set them with 'gh secret set' to enable live deploys."
          fi

      - name: Set up Terraform
        if: steps.gate.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.3'

      - name: Terraform init
        if: steps.gate.outputs.configured == 'true'
        working-directory: infra/grafana
        run: terraform init -input=false

      - name: Terraform apply
        if: steps.gate.outputs.configured == 'true'
        working-directory: infra/grafana
        env:
          TF_VAR_grafana_url: ${{ secrets.GRAFANA_URL }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
        run: terraform apply -auto-approve -input=false
