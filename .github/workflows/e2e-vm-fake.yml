name: VM e2e (fake API — Gate 2)

# Where do new tests go? See docs/testing.md.

# Gate 2 of the three-gate plan (#652/#654/#686). Boots qemu OpenWRT +
# Alpine client on the self-hosted KVM runner against the in-process fake
# API (scripts/e2e/fake-api/), runs scripts/e2e/scenarios_fake/.
#
# Gates publish-openwrt in master-router.yml via workflow_call. Does NOT gate
# publish-api — Gate 1 (api-smoke-staging) and the planned Gate 3
# integration smoke cover the API side.
#
# Triggers:
#   - workflow_call    — invoked from master-router.yml as a needs: of publish-openwrt
#   - workflow_dispatch — manual debugging from the Actions tab
#
# Concurrency / host capacity (#895):
#   The old `group: e2e-vm` serialized *every* VM e2e workflow run on the
#   host. #891 parameterized bridge/ports/MACs so multiple qemu pairs can
#   share the host, so we now scope the group per workflow-run — distinct
#   runs no longer serialize at the GitHub queue level. Per-run isolation on
#   the host comes from WH_RUN_ID / WH_PORT_BASE (below) + the wh-lan* bridge
#   pool pick (lib.sh::wh_pick_lan_bridge, #891).
#
#   The hard ceiling on concurrent VM pairs is the bridge pool, NOT this
#   group: api.lan's /etc/qemu/bridge.conf has 7 bridges (wh-lan0..wh-lan6),
#   and each VM pair (router + client) consumes one. The pool is sized so
#   usable bridges (6) cover the worst case across BOTH CD pipelines — Master
#   Router CD's Gate 2 + Gate 3a and Master API/UI CD's Gate 3b can run
#   concurrently, 2 arms each = 6 — leaving wh-lan6 as manual headroom for
#   ad-hoc runs, scripts/e2e-kvm-sanity, and the keep-staging-warm cron
#   (#657/#1163). The runner-instance count on api.lan (4) is a *lower*
#   secondary governor; see docs/ops/kvm-runner.md for the
#   pool-size - 1 >= worst-case-arms invariant.
#
#   When all bridges are taken, wh_pick_lan_bridge first reaps any orphan
#   leaked by a crashed/forgotten run, then fails loud with "LAN bridge pool
#   exhausted" (exit 1) rather than queueing forever — see
#   scripts/vm/test-lan-bridge-pick.sh.

on:
  workflow_call:
    inputs:
      consume_vm_image_artifact:
        description: "Download the VM image from the sibling build-release-artifacts job instead of building locally. Master Router CD sets this true so the gates boot the exact .img that ships (#1224)."
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-vm-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  e2e-fake:
    name: VM e2e (fake API) — ${{ matrix.pkg_format }}
    # Block fork PRs on the self-hosted runner; same guard as the gate3
    # workflows. (workflow_call and workflow_dispatch are always allowed.)
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, kvm]
    # Local wall time for the full fake-mode pack is ~15–20m (per #685
    # validation: ipk arm green 3x at 18m avg). 30m covers a cold image
    # build on the runner plus headroom.
    timeout-minutes: 30
    # #685: matrix over ipk-23.05 and apk-25.12 router images. fail-fast=false
    # so a regression in one flavor still reports the other arm's status
    # (needed to surface apk-only regressions like the #531 history case).
    # max-parallel: 4 (#1163) — with #891's bridge/port/MAC parameterization
    # the arms can share a host. The 7-bridge pool (6 usable + 1 headroom)
    # covers the worst-case 6 concurrent arms across both pipelines; see the
    # concurrency note at the top of this file. The 4 self-hosted kvm runner
    # instances on api.lan are the lower global governor for cross-workflow
    # concurrency; within a single workflow this cap is the per-matrix ceiling.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - pkg_format: ipk
            port_base: 2222
          - pkg_format: apk
            port_base: 2322

    env:
      PKG_FORMAT: ${{ matrix.pkg_format }}
      # Distinct host port bases per arm (#891): router-ssh, router-http,
      # client1-ssh use port_base, port_base+1, port_base+2; #907 adds
      # WH_FAKE_API_PORT = WH_PORT_BASE + 1000. Today the single runner
      # serializes the arms so reuse would be fine; the split is for
      # forward-compat once a second runner is labeled `kvm`.
      WH_PORT_BASE: ${{ matrix.port_base }}
      # Per-job scope for the qemu `-name wh-*-${WH_RUN_ID}` suffix and the
      # .run/<id>/ state dir (config.sh:91,145,40-44). Lets teardown's
      # pkill backstop match only this run's qemu, never a sibling's.
      # Now that #895 lets matrix arms run in parallel (max-parallel: 4),
      # the id MUST be unique per arm — two concurrently-booting arms sharing
      # one .run/<id>/ would clobber each other's overlay/pid/monitor.sock —
      # so we append the pkg_format. github.run_id already makes it unique
      # across concurrent *workflow* runs (fake / gate3a / gate3b each get a
      # distinct run_id).
      # Path budget: .run/<id>/router/monitor.sock must fit the 108-byte
      # Linux Unix-socket-path limit (#907 bug 4). On the runner workspace
      # (/home/runner/actions-runner/_work/wifihaven/wifihaven) the fixed
      # prefix+suffix leaves room for a 17-char id; "<11-digit run_id>-<attempt>-ipk"
      # = 17 chars fits exactly. Keep any future suffix additions within that.
      WH_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pkg_format }}

    steps:
      # Self-hosted runner: a prior run of scripts/vm/build-router-image.sh
      # can leave root-owned files under scripts/vm/.cache/imagebuilder/.
      # actions/checkout cleans the workspace and fails with EACCES on
      # those files; the runner has no NOPASSWD sudo (only /usr/sbin/ip
      # per docs/ops/kvm-runner.md), so we use docker — which runs as root
      # — to chown the cache back. No-op on clean runners. Same pattern
      # as the gate3 workflows.
      - name: Reclaim root-owned cache files (pre-checkout)
        run: |
          docker rm -f wh-imagebuilder 2>/dev/null || true
          CACHE="${{ github.workspace }}/scripts/vm/.cache"
          if [ -d "$CACHE" ]; then
            docker run --rm -v "$CACHE":/c alpine sh -c '
              chmod -R u+rwX,a+rX /c 2>/dev/null
              chown -R '"$(id -u):$(id -g)"' /c 2>/dev/null
            ' || true
          fi

      - uses: actions/checkout@v6

      - name: Preflight (kvm/qemu/docker)
        run: |
          if ! { test -e /dev/kvm && test -r /dev/kvm && test -w /dev/kvm; }; then
            echo "/dev/kvm missing or not r/w"
            ls -l /dev/kvm || true
            exit 1
          fi
          qemu-system-x86_64 --version | head -n1
          docker --version

      - name: Resolve router image path
        id: image
        run: |
          # Source versions.sh so the image filename stays in sync with
          # whichever OpenWRT pin scripts/vm/versions.sh selects for this
          # flavor (#685: derived, not hardcoded in YAML).
          . scripts/vm/versions.sh
          IMG="$GITHUB_WORKSPACE/scripts/vm/.cache/openwrt-wifihaven-${PKG_FORMAT}-${OPENWRT_VERSION_SHORT}.img"
          echo "path=$IMG" >> "$GITHUB_OUTPUT"
          echo "Resolved image: $IMG"

      # #1224: download the exact per-flavor .img built once pre-gate by
      # build-release-artifacts (artifact `vm-image-<flavor>`, scoped to this
      # run). NO continue-on-error and NO local-build fallback when consuming:
      # the whole point is to boot the artifact that ships, so a missing
      # artifact must fail loud rather than silently rebuild a different image.
      - name: Download VM image artifact (from build-release-artifacts)
        if: inputs.consume_vm_image_artifact
        uses: actions/download-artifact@v6
        with:
          name: vm-image-${{ matrix.pkg_format }}
          path: scripts/vm/.cache

      - name: Build router image (if not cached / not downloaded)
        run: |
          if [[ -f "${{ steps.image.outputs.path }}" ]]; then
            echo "router image present, skipping build"
          else
            scripts/vm/build-router-image.sh
          fi

      - name: Build client base (if not cached)
        run: scripts/vm/build-client-base.sh

      - name: Pre-flight kill of stale wh VMs (this WH_RUN_ID only)
        run: |
          scripts/vm/router-down.sh || true
          scripts/vm/client-down.sh || true

      # Fake mode runs the API as an in-process asyncio app inside pytest
      # (scripts/e2e/scenarios_fake/conftest.py), so no docker-compose
      # stack bring-up / teardown / log capture is needed here.
      - name: Run e2e fake-mode suite
        env:
          WH_ROUTER_IMAGE_PATH: ${{ steps.image.outputs.path }}
        run: scripts/e2e-vm.sh --mode=fake

      # #1370: surface the router/client serial consoles on failure. This step
      # runs before "Tear down VMs" below, and router-down.sh leaves .run/ in
      # place, so the logs are present at upload time. Name console.log
      # explicitly (the diagnostic that was missing for the #1369 reaper race)
      # alongside the broad .run/** sweep, and use if-no-files-found: warn so an
      # empty .run/ — a pre-qemu pick-time abort never wrote a serial log — is
      # logged rather than silently ignored. Control sockets moved to
      # ${XDG_RUNTIME_DIR}/wh-vm (#1219); serial logs stay under
      # .run/**/console.log.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-vm-fake-failure-${{ matrix.pkg_format }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scripts/vm/.run/**/console.log
            scripts/vm/.run/**/*.log
            scripts/vm/.run/**
            !scripts/vm/.run/**/*.qcow2
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down VMs
        if: always()
        run: |
          scripts/vm/router-down.sh || true
          scripts/vm/client-down.sh || true
          # Backstop: kill anything tagged with *this* run's id that the
          # pidfile-driven down scripts missed (workspace reclaim, qemu
          # reparented, etc.). Scoped via WH_RUN_ID so a sibling
          # concurrent run is never touched.
          pkill -f "qemu-system-x86_64.*-name wh-.*-${WH_RUN_ID}" || true
