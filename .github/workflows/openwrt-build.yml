name: OpenWRT Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["openwrt/**"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build .ipk
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "release=1"                          >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^PKG_VERSION:=' openwrt/Makefile | cut -d= -f2)" >> "$GITHUB_OUTPUT"
            echo "release=$(grep '^PKG_RELEASE:=' openwrt/Makefile | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .ipk
        env:
          PKG_VERSION: ${{ steps.ver.outputs.version }}
          PKG_RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          chmod +x openwrt/build-ipk.sh
          openwrt/build-ipk.sh

      - name: Verify .ipk contents
        run: |
          ipk=$(ls openwrt/familydns_*.ipk)
          echo "Package: $ipk"
          ls -lh "$ipk"
          echo "--- ar contents ---"
          ar t "$ipk"
          echo "--- control ---"
          ar p "$ipk" control.tar.gz | tar tz
          echo "--- data ---"
          ar p "$ipk" data.tar.gz | tar tz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: familydns-ipk-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.release }}
          path: openwrt/familydns_*.ipk
          if-no-files-found: error

      - name: Create GitHub release and attach .ipk
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: openwrt/familydns_*.ipk
          generate_release_notes: true
