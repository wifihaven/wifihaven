name: OpenWRT Package Build

# Normally, releases happen only on v* tag pushes (#191, #212). For live
# debugging of #228 we also publish a rolling "openwrt-latest" pre-release
# on every push to main that touches openwrt/**, so the field router can
# fetch the updated .apk without us cutting a real tag each iteration.
# This is reverted by #244 once #228 is fixed.
#
# This workflow is also invoked from master.yml as a reusable workflow
# (`workflow_call`) so the openwrt publish path is gated on the same Master
# CD checks as publish-api (#494). The standalone push/PR/dispatch triggers
# below are retained for ad-hoc work (direct tag pushes, PR validation,
# manual runs).
on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths: ["openwrt/**"]
  pull_request:
    paths: ["openwrt/**"]
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build .ipk and .apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "release=1"                          >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^PKG_VERSION:=' openwrt/Makefile | cut -d= -f2)" >> "$GITHUB_OUTPUT"
            echo "release=$(grep '^PKG_RELEASE:=' openwrt/Makefile | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .ipk
        env:
          PKG_VERSION: ${{ steps.ver.outputs.version }}
          PKG_RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          chmod +x openwrt/build-ipk.sh
          openwrt/build-ipk.sh

      - name: Verify .ipk contents
        run: |
          ipk=$(ls openwrt/wifihaven_*.ipk)
          echo "Package: $ipk"
          ls -lh "$ipk"
          echo "--- ar contents ---"
          ar t "$ipk"
          echo "--- control ---"
          ar p "$ipk" control.tar.gz | tar tz
          echo "--- data ---"
          ar p "$ipk" data.tar.gz | tar tz

      - name: Install apk-tools build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config libssl-dev libzstd-dev wget

      - name: Build .apk
        env:
          PKG_VERSION: ${{ steps.ver.outputs.version }}
          PKG_RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          chmod +x openwrt/build-apk.sh
          openwrt/build-apk.sh

      - name: Verify .apk contents
        run: |
          apk_file=$(ls openwrt/wifihaven_*.apk)
          echo "Package: $apk_file"
          ls -lh "$apk_file"
          apk_bin="$HOME/.cache/wifihaven-apk-tools/build/src/apk"
          echo "--- file type ---"
          file "$apk_file"
          echo "--- apk adbdump (metadata + payload listing) ---"
          "$apk_bin" adbdump "$apk_file"

      - name: Upload .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifihaven-ipk-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.release }}
          path: openwrt/wifihaven_*.ipk
          if-no-files-found: error

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifihaven-apk-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.release }}
          path: openwrt/wifihaven_*.apk
          if-no-files-found: error

      - name: Create GitHub release and attach packages (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openwrt/wifihaven_*.ipk
            openwrt/wifihaven_*.apk
          generate_release_notes: true

      # Rolling pre-release for #228 live debugging. Reverted by #244.
      - name: Publish rolling openwrt-latest release (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-latest
          name: "openwrt-latest (rolling)"
          body: |
            Rolling build of the OpenWRT agent from the latest `main`.
            Replaced on every push to `main` touching `openwrt/**`.
            For #228 live debugging — see #243 / #244.
          prerelease: true
          files: |
            openwrt/wifihaven_*.ipk
            openwrt/wifihaven_*.apk
