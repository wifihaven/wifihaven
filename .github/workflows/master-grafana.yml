name: Master Grafana CD

# Grafana dashboard deployment pipeline — reconciles the single Grafana Cloud
# stack (wifihaven.grafana.net) to the in-repo dashboards.
#
# Split out of master-api-ui.yml (#1283): the dashboard deploy has nothing to
# do with the API/SPA release cadence, and folding it into that pipeline meant
# it re-ran on every api/web/config push (and was gated behind the production
# approval). As its own pipeline with a tight path scope it only fires when a
# dashboard JSON or its Terraform actually changes, and never blocks — or is
# blocked by — an API/SPA release.
#
# Flow (one job):
#   deploy-grafana — terraform apply of the in-repo dashboards
#     (deploy/grafana/dashboards/*.json) to the single Grafana Cloud stack via
#     the infra/grafana Terraform.
#
# One stack serves every environment: the dashboards select their data via the
# templated ${datasource} variable at view time, so there is no per-environment
# copy and no staging/prod split. The apply is idempotent — each
# grafana_dashboard is upserted by its stable uid (overwrite = true) — so a
# re-run just reconciles the stack to the repo.
#
# State + locking live on HCP Terraform (the `cloud {}` block in
# infra/grafana/main.tf, #1406); the apply itself runs here on the runner (HCP
# workspace in *local* execution mode), exactly like the Cloudflare pipeline
# (#1357). Remote state is the hard prerequisite for the alerting resources
# (#1403/#1404/#1405): a create against fresh-every-run empty state would 409 or
# accumulate duplicates. With the migrated state, a re-run with no repo edits
# reports "No changes". The one-time state migration + the TF_API_TOKEN secret
# are operator-gated — see infra/grafana/README.md.
#
# No production-approval gate: a dashboard change is low-risk and independent
# of the API/SPA release, so it ships straight from a push to main (the change
# already went through PR review + the ci.yml grafana-terraform lint job).
#
# Path scope: see on.push.paths below. Docs and unrelated infra fire nothing.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/grafana/**'
      - 'infra/grafana/**'
      - '.github/workflows/master-grafana.yml'
  workflow_dispatch:

# Scoped to this pipeline's own group. Now that state lives on HCP (#1406) we do
# NOT cancel in-progress runs: killing `terraform apply` mid-run could orphan the
# HCP state lock and block the next apply (mirrors master-cloudflare.yml).
# Queueing lets the in-flight apply finish, then the next push reconciles to the
# latest repo state.
concurrency:
  group: master-grafana-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-grafana:
    name: Deploy Grafana dashboards
    # Gate to main: the path filter lets feature-branch pushes create a run,
    # but on a non-main ref no job is eligible and GitHub records a spurious
    # 0-job failure. Skipping (not failing) keeps that neutral. (mirrors the
    # master-router.yml `if` guard, #1136)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Grafana + HCP secrets are configured
        id: gate
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          # operator_email has no default — the alerting resources (#1403) can't
          # apply without it, so gate on it too rather than red-failing the apply.
          GRAFANA_OPERATOR_EMAIL: ${{ secrets.GRAFANA_OPERATOR_EMAIL }}
        run: |
          if [ -n "$GRAFANA_URL" ] && [ -n "$GRAFANA_AUTH" ] && [ -n "$TF_API_TOKEN" ] && [ -n "$GRAFANA_OPERATOR_EMAIL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GRAFANA_URL / GRAFANA_AUTH / TF_API_TOKEN / GRAFANA_OPERATOR_EMAIL not all set — skipping dashboard deploy. See infra/grafana/README.md for the one-time backend setup."
          fi

      - name: Set up Terraform
        if: steps.gate.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.3'

      - name: Terraform init + apply
        if: steps.gate.outputs.configured == 'true'
        working-directory: infra/grafana
        env:
          # HCP Terraform: remote state + locking (workspace in local exec mode).
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_CLOUD_ORGANIZATION: wifihaven
          TF_WORKSPACE: grafana
          # Grafana provider auth — supplied to the apply running on the runner.
          TF_VAR_grafana_url: ${{ secrets.GRAFANA_URL }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
          # Alert contact-point destination (#1403). Never committed; the
          # operator's email is a GitHub secret fed as a TF var.
          TF_VAR_operator_email: ${{ secrets.GRAFANA_OPERATOR_EMAIL }}
        run: |
          # The HCP workspace (TF_WORKSPACE=grafana) must already exist — it is a
          # one-time, operator-gated setup step, NOT created by this pipeline (see
          # infra/grafana/README.md "One-time backend setup"). If it is missing,
          # `terraform init` fails with "Invalid workspace selection / failed to
          # find workspace". Catch that specific case and print the fix, so the
          # red CD is self-explanatory instead of looking like an apply error.
          if ! init_out=$(terraform init -input=false 2>&1); then
            echo "$init_out"
            if echo "$init_out" | grep -q "Invalid workspace selection"; then
              echo "::error title=HCP workspace missing::The HCP Terraform workspace '${TF_WORKSPACE}' does not exist in org '${TF_CLOUD_ORGANIZATION}'. This is the one-time backend setup, not an apply error. Create it (Execution Mode = Local, no VCS) per infra/grafana/README.md 'One-time backend setup', then re-run this job."
            fi
            exit 1
          fi
          echo "$init_out"
          terraform apply -auto-approve -input=false
