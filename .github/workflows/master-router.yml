name: Master Router CD

# Where do new tests go? See docs/testing.md (Gate 2 gates publish here).

# Router deployment pipeline — produces the openwrt-latest rolling release.
#
# Split off from the unified Master CD in #871: a single workflow handling
# both router and api/ui meant frequent api/ui pushes cancelled in-flight
# router publishes. The two pipelines now share no state and each only
# fires on changes to its own path scope, so api/ui churn cannot stall
# router releases.
#
# Flow:
#   ci-tests                    (full matrix; ci.yml self-filters by path)
#     → gate-2-router-fake-api  (qemu OpenWRT + Alpine + fake API on KVM)
#     ‖ gate-3a-router-staging  (qemu OpenWRT + Alpine + real staging API)
#       → approve-production    (manual gate, `production` environment)
#         → publish-openwrt     (rolling openwrt-latest GitHub Release)
#
# Gates 2 and 3a both share the e2e-vm self-hosted-runner concurrency
# group (#657 capacity follow-up), so in practice they serialize on the
# host even though the workflow graph runs them in parallel.
#
# Path scope: see `on.push.paths` below. shared/contract/** (wire-format
# goldens) triggers BOTH pipelines for tandem releases until #597 lands.
# Scala-only model changes under shared/src/ fire api/ui only — the router
# agent is Lua and doesn't link Scala. Docs, READMEs, and meta files fire
# neither.

on:
  push:
    branches: [main]
    paths:
      - 'openwrt/**'
      - 'opnsense/**'
      # shared/contract/** = wire-format goldens that gate-2's fake API
      # loads as fixtures. Scala-side model changes under shared/src/ don't
      # reach the Lua router agent, so we don't fire CD on those.
      - 'shared/contract/**'
      - '.github/workflows/master-router.yml'
      - '.github/workflows/openwrt-build.yml'
      - '.github/workflows/e2e-vm-fake.yml'
      - '.github/workflows/e2e-vm-gate3a.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Workflow-level concurrency scoped to THIS pipeline's group name — router
# pushes pre-empt earlier router pushes; api/ui pushes (on master-api-ui.yml,
# in a different group) cannot cancel a router run. Router commits are
# infrequent enough that a faster push cancelling an in-flight publish is
# rare; if it happens, the next push reproduces a fresh artifact.
concurrency:
  group: master-router-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN to minimum privilege at the workflow level — jobs
# that need more (publish-openwrt → contents: write) override locally.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci-tests:
    name: CI
    # Gate every job to main: the broad `paths:` filter above lets feature-
    # branch pushes create a run, but on a non-main ref no job is eligible
    # and GitHub records a 0-job `failure`. Skipping (not failing) the jobs
    # turns that spurious red run neutral. `workflow_dispatch` on main still
    # satisfies this; dispatch on a non-main ref is intentionally skipped. (#1136)
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Build the OpenWRT VM image early so downstream tests can consume it.
  # Reuses router-image-build.yml (which also runs standalone on PRs).
  # The upload is a workflow artifact only — internal CI use; the .img is
  # never attached to the user-facing openwrt-latest release (only the
  # .ipk/.apk packages from publish-openwrt are).
  build-vm-image:
    name: Build OpenWRT VM image
    if: github.ref == 'refs/heads/main'
    needs: [ci-tests]
    permissions:
      contents: read
    uses: ./.github/workflows/router-image-build.yml

  # Gate 2 (#654/#686): router enforcement in qemu OpenWRT + Alpine client
  # against an in-process fake API serving snapshot fixtures. Runs on the
  # self-hosted KVM runner; e2e-vm-fake.yml's own concurrency group
  # serializes against the live-mode VM e2e workflow on the same host.
  gate-2-router-fake-api:
    name: Gate 2 — router fake-API e2e
    if: github.ref == 'refs/heads/main'
    needs: [ci-tests, build-vm-image]
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-vm-fake.yml
    with:
      consume_vm_image_artifact: true
    secrets: inherit

  # Gate 3a (#655): the same router image, but enrolled against the real
  # staging API. Confirms the freshly-built router agent talks to the
  # current production API contract — catching the class of regression
  # that's invisible against the fake-API snapshot fixtures (i.e. the
  # snapshot golden has drifted from what the API actually emits).
  # Shares the e2e-vm concurrency group with Gate 2 and the live-mode VM
  # e2e workflow.
  gate-3a-router-staging:
    name: Gate 3a — router staging smoke
    if: github.ref == 'refs/heads/main'
    needs: [ci-tests, build-vm-image]
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-vm-gate3a.yml
    with:
      consume_vm_image_artifact: true
    secrets: inherit

  # Manual-approval gate. Carries `environment: production` so GitHub pauses
  # the run for an approval click before the rolling release is touched.
  # API/UI prod approval lives on its own gate in master-api-ui.yml; both
  # queue on the same `production` environment, so GitHub serializes
  # approval prompts across the two pipelines.
  approve-production:
    name: Manual approval (router production gate)
    if: github.ref == 'refs/heads/main'
    needs: [gate-2-router-fake-api, gate-3a-router-staging]
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: production
      url: https://github.com/wifihaven/wifihaven/releases/tag/openwrt-latest
    steps:
      - name: Approved
        run: echo "Router release approved — publishing openwrt-latest."

  # Rolling openwrt-latest release. Reusable openwrt-build.yml with
  # publish_release: true; see that file for the gating logic. Intentionally
  # has NO concurrency group: once approval lands, this job must run to
  # completion regardless of any later main push.
  publish-openwrt:
    name: Publish OpenWRT release
    if: github.ref == 'refs/heads/main'
    needs: [approve-production]
    permissions:
      contents: write
    uses: ./.github/workflows/openwrt-build.yml
    with:
      publish_release: true
    secrets: inherit
