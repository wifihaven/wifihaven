name: Master Router CD

# Where do new tests go? See docs/testing.md (Gate 2 gates publish here).

# Router deployment pipeline — produces the openwrt-latest rolling release.
#
# Split off from the unified Master CD in #871: a single workflow handling
# both router and api/ui meant frequent api/ui pushes cancelled in-flight
# router publishes. The two pipelines now share no state and each only
# fires on changes to its own path scope, so api/ui churn cannot stall
# router releases.
#
# Flow (#1224 — build once, test those exact bits, publish without rebuild):
#   ci-tests                    (full matrix; ci.yml self-filters by path)
#     → build-release-artifacts (ONE job: .ipk/.apk + luci .ipk/.apk + both
#       │                        qemu VM images, versioned with the final
#       │                        release version derived ONCE; uploaded as
#       │                        workflow artifacts)
#       → gate-2-router-fake-api  (boots the uploaded VM image + fake API)
#       ‖ gate-3a-router-staging  (boots the uploaded VM image + staging API)
#         → approve-production    (manual gate, `production` environment)
#           → publish-openwrt     (DOWNLOADS the tested artifacts → rolling
#                                  openwrt-latest + versioned v<X.Y.Z>; no
#                                  rebuild, no version re-derivation)
#
# Gates 2 and 3a both share the e2e-vm self-hosted-runner concurrency
# group (#657 capacity follow-up), so in practice they serialize on the
# host even though the workflow graph runs them in parallel.
#
# Path scope: see `on.push.paths` below. shared/contract/** (wire-format
# goldens) triggers BOTH pipelines for tandem releases until #597 lands.
# Scala-only model changes under shared/src/ fire api/ui only — the router
# agent is Lua and doesn't link Scala. Docs, READMEs, and meta files fire
# neither.

on:
  push:
    branches: [main]
    paths:
      - 'openwrt/**'
      - 'opnsense/**'
      # shared/contract/** = wire-format goldens that gate-2's fake API
      # loads as fixtures. Scala-side model changes under shared/src/ don't
      # reach the Lua router agent, so we don't fire CD on those.
      - 'shared/contract/**'
      - '.github/workflows/master-router.yml'
      - '.github/workflows/build-release-artifacts.yml'
      - '.github/workflows/publish-openwrt-release.yml'
      - '.github/workflows/e2e-vm-fake.yml'
      - '.github/workflows/e2e-vm-gate3a.yml'
      - '.github/workflows/ci.yml'
      # e2e scenario files: a new or changed fake-mode scenario that gates the
      # router image should re-run the full pipeline, not just CI tests.
      - 'scripts/e2e/scenarios_fake/**'
      - 'scripts/e2e/lib/**'
      - 'scripts/e2e/fake-api/**'
      - 'scripts/e2e/pytest.ini'
      # The VM harness itself: gate-2 (e2e-vm-fake) and gate-3a boot the
      # router image via these scripts (router-up.sh, lib.sh's bridge pool +
      # orphan reaper, etc.). A bug here can red the gates without touching a
      # single agent byte — exactly #1369, where lib.sh's reaper aborted
      # router-up.sh under concurrency. router-image-build.yml already PR-gates
      # on scripts/vm/**; the CD gates that actually exercise the harness must
      # re-run on it too. (Publish still waits at the manual production gate,
      # so a harness-only change can't auto-ship a new openwrt-latest.)
      - 'scripts/vm/**'
  workflow_dispatch:

# Workflow-level concurrency scoped to THIS pipeline's group name — router
# pushes pre-empt earlier router pushes; api/ui pushes (on master-api-ui.yml,
# in a different group) cannot cancel a router run. Router commits are
# infrequent enough that a faster push cancelling an in-flight publish is
# rare; if it happens, the next push reproduces a fresh artifact.
concurrency:
  group: master-router-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN to minimum privilege at the workflow level — jobs
# that need more (publish-openwrt → contents: write) override locally.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci-tests:
    name: CI
    # Gate every job to main: the broad `paths:` filter above lets feature-
    # branch pushes create a run, but on a non-main ref no job is eligible
    # and GitHub records a 0-job `failure`. Skipping (not failing) the jobs
    # turns that spurious red run neutral. `workflow_dispatch` on main still
    # satisfies this; dispatch on a non-main ref is intentionally skipped. (#1136)
    if: github.ref == 'refs/heads/main'
    # ci.yml's migration-isolation job declares `pull-requests: read` (for the
    # merge_group `gh pr list` label lookup). GitHub validates a called
    # workflow's job permissions against the caller's grant at LOAD time,
    # before `if:` gating — so without this scope the call exceeds the cap and
    # the whole CD run startup_failures even though that job is skipped on
    # push. (#1259)
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  # #1224: build EVERY shippable release artifact exactly once, pre-gate,
  # versioned with the final release version derived a single time. The gates
  # boot the uploaded VM images and publish-openwrt downloads these same bytes
  # — so tested bits == published bits, and the coordinated-version invariant
  # (#499/#1134) is anchored here. Exposes `version` for the publish job.
  build-release-artifacts:
    name: Build release artifacts
    if: github.ref == 'refs/heads/main'
    needs: [ci-tests]
    permissions:
      contents: read
    uses: ./.github/workflows/build-release-artifacts.yml
    # publish_release forces the clean release version. The reusable workflow
    # otherwise falls back to github.event_name, which it inherits from THIS
    # caller — so a manual workflow_dispatch of Master Router CD would
    # otherwise produce an apk-invalid -dev.<sha> version and fail the build.
    with:
      publish_release: true

  # Gate 2 (#654/#686): router enforcement in qemu OpenWRT + Alpine client
  # against an in-process fake API serving snapshot fixtures. Runs on the
  # self-hosted KVM runner; e2e-vm-fake.yml's own concurrency group
  # serializes against the live-mode VM e2e workflow on the same host.
  gate-2-router-fake-api:
    name: Gate 2 — router fake-API e2e
    if: github.ref == 'refs/heads/main'
    needs: [ci-tests, build-release-artifacts]
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-vm-fake.yml
    with:
      consume_vm_image_artifact: true
    secrets: inherit

  # Gate 3a (#655): the same router image, but enrolled against the real
  # staging API. Confirms the freshly-built router agent talks to the
  # current production API contract — catching the class of regression
  # that's invisible against the fake-API snapshot fixtures (i.e. the
  # snapshot golden has drifted from what the API actually emits).
  # Shares the e2e-vm concurrency group with Gate 2.
  gate-3a-router-staging:
    name: Gate 3a — router staging smoke
    if: github.ref == 'refs/heads/main'
    needs: [ci-tests, build-release-artifacts]
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-vm-gate3a.yml
    with:
      consume_vm_image_artifact: true
    secrets: inherit

  # Manual-approval gate. Carries `environment: production` so GitHub pauses
  # the run for an approval click before the rolling release is touched.
  # API/UI prod approval lives on its own gate in master-api-ui.yml; both
  # queue on the same `production` environment, so GitHub serializes
  # approval prompts across the two pipelines.
  approve-production:
    name: Manual approval (router production gate)
    if: github.ref == 'refs/heads/main'
    needs: [gate-2-router-fake-api, gate-3a-router-staging]
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: production
      url: https://github.com/wifihaven/wifihaven/releases/tag/openwrt-latest
    steps:
      - name: Approved
        run: echo "Router release approved — publishing openwrt-latest."

  # #1224: download-and-release ONLY. publish-openwrt-release.yml pulls the
  # release-assets artifact built pre-gate by build-release-artifacts and
  # attaches those exact, already-tested bytes — no recompile, no version
  # re-derivation. The version is threaded verbatim from the build job's
  # output, preserving the coordinated-version invariant (#499/#1134).
  # `needs` build-release-artifacts (transitively satisfied via the gates,
  # but listed explicitly so its `version` output is in scope here).
  # Intentionally has NO concurrency group: once approval lands, this job
  # must run to completion regardless of any later main push.
  publish-openwrt:
    name: Publish OpenWRT release
    if: github.ref == 'refs/heads/main'
    needs: [build-release-artifacts, approve-production]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-openwrt-release.yml
    with:
      version: ${{ needs.build-release-artifacts.outputs.version }}
    secrets: inherit
