name: VM e2e KVM sanity

# Smoke-tests the self-hosted KVM runner registered for #149. Runs the
# orchestrator in fake mode + skip-VMs (E2E_VM_SKIP_VMS=1) so it exercises
# the venv + pytest wiring without booting the router/client VMs.
# Gate 2 (e2e-vm-fake.yml) is the real enforcement suite.
#
# Manual-only: trigger from Actions → "VM e2e KVM sanity" → Run workflow.

on:
  workflow_dispatch:

jobs:
  sanity:
    name: KVM runner sanity check
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Verify /dev/kvm
        run: |
          test -e /dev/kvm || { echo "/dev/kvm missing"; exit 1; }
          if ! { test -r /dev/kvm && test -w /dev/kvm; }; then
            echo "/dev/kvm not r/w for runner user"
            ls -l /dev/kvm
            exit 1
          fi
          echo "ok /dev/kvm"

      - name: Verify qemu
        run: qemu-system-x86_64 --version

      - name: Verify docker
        run: docker --version

      - name: Orchestrator wiring (skip VMs)
        env:
          E2E_VM_SKIP_VMS: "1"
        run: scripts/e2e-vm.sh --mode=fake
