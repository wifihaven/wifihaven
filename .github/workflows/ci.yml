name: CI

on:
  pull_request:
    # Run on PRs targeting any branch
  workflow_call:
    # Invoked by master.yml on push to main so the CD pipeline gates publish
    # on the same test matrix PRs run. Direct push: main is intentionally
    # omitted — main coverage flows through master.yml (issue #190).
  workflow_dispatch:

env:
  MILL_VERSION: "1.1.5"
  # Opt into Node.js 24 now (forced default June 2026 anyway). Silences the
  # Node 20 deprecation warnings emitted by actions/checkout@v4, setup-java@v4,
  # setup-node@v4, cache@v4, codeql-action@v4 etc.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Path filter: decide which downstream jobs need to run on this PR ─────
  # On workflow_call (from master.yml) and workflow_dispatch we force every
  # output to 'true' so the post-merge CD gate and manual runs still execute
  # the full matrix. On pull_request we let dorny/paths-filter compute deltas
  # against the PR base. Any change to ci.yml itself also forces everything.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      scala: ${{ steps.filter.outputs.scala || steps.force.outputs.all }}
      frontend: ${{ steps.filter.outputs.frontend || steps.force.outputs.all }}
      lua: ${{ steps.filter.outputs.lua || steps.force.outputs.all }}
      python: ${{ steps.filter.outputs.python || steps.force.outputs.all }}
      shell: ${{ steps.filter.outputs.shell || steps.force.outputs.all }}
      render: ${{ steps.filter.outputs.render || steps.force.outputs.all }}
      migrations: ${{ steps.filter.outputs.migrations || steps.force.outputs.all }}
    steps:
      - name: Force full matrix for non-PR triggers
        id: force
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            scala:
              - '.github/workflows/ci.yml'
              - 'api/**'
              - 'shared/**'
              - 'build.mill'
              - '.scalafmt.conf'
              - 'config/**'
              - 'docker/**'
              - 'deploy/**'
            frontend:
              - '.github/workflows/ci.yml'
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
            lua:
              - '.github/workflows/ci.yml'
              - 'openwrt/**'
            python:
              - '.github/workflows/ci.yml'
              - 'opnsense/**'
            shell:
              - '.github/workflows/ci.yml'
              - 'deploy/**/*.sh'
              - 'scripts/**'
              - '**/*.bats'
              - '**/*.test.sh'
            render:
              - '.github/workflows/ci.yml'
              - 'render.yaml'
            migrations:
              - '.github/workflows/ci.yml'
              - 'api/migrations/**'

  # ── Scala: format, compile, test ─────────────────────────────────────────
  scala:
    name: Scala Build & Test
    needs: changes
    if: needs.changes.outputs.scala == 'true'
    runs-on: ubuntu-latest

    env:
      WIFIHAVEN_JWT_SECRET: test-jwt-secret-for-ci-only

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Mill / Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.mill
            ~/.cache/coursier
            out/
          key: mill-${{ env.MILL_VERSION }}-${{ hashFiles('build.mill') }}
          restore-keys: |
            mill-${{ env.MILL_VERSION }}-
            mill-

      - name: Install Mill (official launcher) and scalafmt
        run: |
          # Mill 1.x ships an official Bash launcher on Maven Central
          curl -fsSL "https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/${MILL_VERSION}/mill-dist-${MILL_VERSION}-mill.sh" \
            -o /tmp/mill
          chmod +x /tmp/mill
          sudo mv /tmp/mill /usr/local/bin/mill
          mill --version
          # scalafmt via coursier (Coursier's app channel handles this fine)
          curl -fsSL https://github.com/coursier/coursier/releases/latest/download/cs-x86_64-pc-linux.gz \
            | gunzip > /tmp/cs
          chmod +x /tmp/cs
          /tmp/cs install --install-dir /usr/local/bin --quiet scalafmt

      - name: scalafmt --check
        run: scalafmt --check --non-interactive

      - name: Compile all modules
        run: mill __.compile

      - name: Run all tests (sequential to avoid embedded-pg lock contention)
        # api.test spins up EmbeddedPostgres; running sequentially avoids
        # JVM-wide file-lock contention if more DB-heavy tests are added later.
        run: |
          mill shared.test
          mill api.test

  # ── Migrations: forbid changes to existing files on PRs to main ─────────
  migrations-immutable:
    name: Migrations Immutability Check
    needs: changes
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject changes to existing migration files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check-migrations.sh "$BASE_SHA"

  # ── Shell test discovery ─────────────────────────────────────────────────
  # Auto-discovers and runs every *.test.sh in the repo. Add a new test by
  # dropping a *.test.sh file alongside the script/hook it covers — no CI
  # change needed. (web/, node_modules, build outputs are excluded.)
  shell-tests:
    name: Shell Tests
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover and run *.test.sh
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(
            find . \
              \( -path ./node_modules -o -path ./web -o -path ./out -o -path ./.git \) -prune \
              -o -type f -name '*.test.sh' -print0
          )
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "No *.test.sh files found." ; exit 0
          fi
          fail=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if ! bash "$t"; then fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

  # ── OpenWrt agent: Lua unit tests ───────────────────────────────────────
  lua-tests:
    name: OpenWrt Lua Tests
    needs: changes
    if: needs.changes.outputs.lua == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua + busted + lua-cjson
        run: |
          sudo apt-get update -q
          # lua5.1 matches OpenWrt 23.x (LuaJIT is 5.1-compatible).
          # liblua5.1-dev is needed for luarocks to compile C modules.
          sudo apt-get install -y lua5.1 liblua5.1-dev luarocks
          sudo luarocks install busted
          sudo luarocks install lua-cjson

      - name: Run openwrt agent tests
        working-directory: openwrt
        run: |
          LUA_PATH="./files/usr/lib/lua/wifihaven/?.lua;./test/shim/?.lua;./test/shim/?/init.lua;$(lua -e 'print(package.path)')" \
            busted test/conntrack_spec.lua

  # ── OPNsense agent: Python unit tests ───────────────────────────────────
  python-tests:
    name: OPNsense Python Tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run opnsense agent tests
        working-directory: opnsense
        run: python -m pytest test/ -v

  # ── render.yaml: YAML parse check ───────────────────────────────────────
  render-blueprint:
    name: Render Blueprint Lint
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse render.yaml
        # Ruby ships preinstalled on ubuntu-latest. Catches YAML regressions
        # before they reach Render's blueprint importer.
        run: ruby -ryaml -e "YAML.load_file('render.yaml')"

  # ── Frontend: type-check, lint, build ────────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  # ── Umbrella gating job ──────────────────────────────────────────────────
  # Branch protection requires this single check. It depends on every
  # downstream job and passes when each one is either successful or skipped
  # (i.e. its paths weren't touched on this PR). Any failure or cancellation
  # in a dependency fails this check.
  ci:
    name: CI
    if: always()
    needs:
      - changes
      - scala
      - migrations-immutable
      - shell-tests
      - lua-tests
      - python-tests
      - render-blueprint
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          bad = {name: meta["result"] for name, meta in data.items()
                 if meta["result"] not in ("success", "skipped")}
          if bad:
              print(f"Failing jobs: {bad}")
              sys.exit(1)
          print("All required jobs succeeded or were skipped.")
          '
