name: CI

# Where do new tests go? See docs/testing.md.

on:
  pull_request:
    # Run on PRs targeting any branch
  merge_group:
    # Run on gh-readonly-queue/* refs so the merge queue gates on the same
    # check PRs do (#1094).
  workflow_call:
    # Invoked by master-api-ui.yml and master-router.yml on push to main so
    # the CD pipelines gate publish on the same test matrix PRs run. Direct
    # push:main is intentionally omitted — main coverage flows through the
    # two Master CD workflows (issue #190).
  workflow_dispatch:

env:
  MILL_VERSION: "1.1.5"
  ACTIONLINT_VERSION: "1.7.12"
  # Opt into Node.js 24 now (forced default June 2026 anyway). Silences the
  # Node 20 deprecation warnings emitted by actions/checkout@v6, setup-java@v4,
  # setup-node@v4, cache@v4, codeql-action@v4 etc.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Path filter: decide which downstream jobs need to run on this PR ─────
  # On push (the Master CD workflows reach ci.yml as `push`) and
  # workflow_dispatch we force every output to 'true' so the post-merge CD
  # gate and manual runs still execute the full matrix. On pull_request AND
  # merge_group (the merge queue) we let dorny/paths-filter compute deltas —
  # against the PR base for PRs, against the merge-base for the queue (#1238)
  # — so the queue runs only the suites whose paths changed. Any change to
  # ci.yml itself also forces everything (it's in every filter).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      scala: ${{ steps.filter.outputs.scala || steps.force.outputs.all }}
      frontend: ${{ steps.filter.outputs.frontend || steps.force.outputs.all }}
      lua: ${{ steps.filter.outputs.lua || steps.force.outputs.all }}
      python: ${{ steps.filter.outputs.python || steps.force.outputs.all }}
      shell: ${{ steps.filter.outputs.shell || steps.force.outputs.all }}
      render: ${{ steps.filter.outputs.render || steps.force.outputs.all }}
      migrations: ${{ steps.filter.outputs.migrations || steps.force.outputs.all }}
      contract: ${{ steps.filter.outputs.contract || steps.force.outputs.all }}
      fake-api: ${{ steps.filter.outputs.fake-api || steps.force.outputs.all }}
      e2e-lib: ${{ steps.filter.outputs.e2e-lib || steps.force.outputs.all }}
      workflows: ${{ steps.filter.outputs.workflows || steps.force.outputs.all }}
      grafana-tf: ${{ steps.filter.outputs.grafana-tf || steps.force.outputs.all }}
      cloudflare-tf: ${{ steps.filter.outputs.cloudflare-tf || steps.force.outputs.all }}
      agent-prompts: ${{ steps.filter.outputs.agent-prompts || steps.force.outputs.all }}
      press-worker: ${{ steps.filter.outputs.press-worker || steps.force.outputs.all }}
    steps:
      - name: Force full matrix for CD / manual triggers
        id: force
        # Only push (CD via the Master workflows) and workflow_dispatch force
        # the whole matrix. merge_group path-filters like a PR (#1238).
        run: |
          case "${{ github.event_name }}" in
            push|workflow_dispatch) echo "all=true"  >> "$GITHUB_OUTPUT" ;;
            *)                      echo "all=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          # On merge_group, diff against the merge-base so the queue runs only
          # what the queued PR touched. On pull_request, an empty base lets
          # paths-filter auto-detect the PR base as before.
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            scala:
              # Narrowed: Scala job only compiles + tests Scala. Docker
              # images, deploy scripts, and config/ (example file only) do
              # not feed into compile or test, so they shouldn't trigger
              # a ~minutes-long EmbeddedPostgres run.
              - '.github/workflows/ci.yml'
              - 'api/**'
              - 'shared/**'
              - 'build.mill'
              - '.scalafmt.conf'
            frontend:
              - '.github/workflows/ci.yml'
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
            lua:
              - '.github/workflows/ci.yml'
              - 'openwrt/**'
            # Bidirectional contract (#634) lives in its own job — see
            # `contract-tests` below. Kept separate so a pure Scala model
            # tweak doesn't drag the full openwrt/lua matrix along.
            contract:
              - '.github/workflows/ci.yml'
              - 'contract/**'
              - 'shared/src/Models.scala'
              - 'shared/src/types/**'
              - 'openwrt/test/contract_spec.lua'
              - 'openwrt/test/contract_gen.lua'
              - 'openwrt/files/usr/lib/lua/wifihaven/render.lua'
              - 'openwrt/files/usr/lib/lua/wifihaven/render.nft'
              - 'openwrt/files/usr/lib/lua/wifihaven/conntrack.lua'
              - 'openwrt/files/usr/lib/lua/wifihaven/usage.lua'
              # #1206: metrics.lua is the production builder for the
              # router_metrics_batch.json fixture (build_metrics_batch in
              # contract_gen.lua calls it), so a change here can drift the
              # contract — run the bidirectional job when it moves.
              - 'openwrt/files/usr/lib/lua/wifihaven/metrics.lua'
              - 'openwrt/test/shim/**'
              # #1367: the real luci.jsonc encoder build + its fidelity spec —
              # the contract job builds and verifies against this module.
              - 'openwrt/test/build-luci-jsonc.sh'
              - 'openwrt/test/jsonc_shim_spec.lua'
              - 'api/**'
              # #1550: a schema-only migration PR (only api/resources/db/migration/**
              # files) cannot change any wire shape, so it must not trigger Contract
              # Tests. dorny/paths-filter applies leading-'!' patterns as per-file
              # ignores: a migration file fails to match ['api/**', '!.../migration/**'],
              # so a migration-only diff resolves contract=false (skipped, treated as
              # success by the umbrella `ci` job). A PR that also touches real api/**
              # code still matches and runs contract as before. The `scala` filter is
              # intentionally left matching api/** so api.test applies the migration —
              # that is the migration-isolation gate.
              - '!api/resources/db/migration/**'
              - 'shared/**'
              - 'build.mill'
              - 'scripts/regen-contract-fixtures.sh'
              # Additional producers (#667): the install.sh printf that
              # generates POST /api/router/register bodies (the documented
              # exception in contract/README.md), and the python
              # fake-router which is a second producer of router→API bodies
              # — #664 demonstrated it can drift the contract independently.
              - 'openwrt/install.sh'
              - 'docker/fake-router.py'
            python:
              - '.github/workflows/ci.yml'
              - 'opnsense/**'
            # Gate-2 (#654) fake API shim. Separate from `python:` so a
            # pure opnsense tweak doesn't run the aiohttp suite (and vice
            # versa). Also tracks the contract golden the fake loads as
            # its initial snapshot — a fixture regen should re-run these.
            fake-api:
              - '.github/workflows/ci.yml'
              - 'scripts/e2e/fake-api/**'
              - 'contract/api-to-router/policy_snapshot.json'
            # Pure-python unit cover for the e2e helper libs (scripts/e2e/lib).
            # These had no CI runner before #2179; the e2e-lib-tests job below
            # gives the staging-router pruner's selection logic a fast gate.
            e2e-lib:
              - '.github/workflows/ci.yml'
              - 'scripts/e2e/lib/**'
              - 'scripts/e2e/prune_stale_staging_routers.py'
            shell:
              - '.github/workflows/ci.yml'
              - 'deploy/**/*.sh'
              - 'scripts/**'
              - 'openwrt/install.sh'
              - 'openwrt/test/**'
              - '**/*.bats'
              - '**/*.test.sh'
              # #2407: docker/entrypoint.sh renders application.conf, and
              # docker/scripts/check-entrypoint-wiring.test.sh (#2405) is the gate that catches a
              # render.yaml key added without matching entrypoint wiring. Without this glob the
              # guard ran only when the guard ITSELF changed — so a PR that adds a key and forgets
              # the entrypoint reports "Shell Tests: skipping" and sails past its own gate.
              - 'docker/**'
              # #1843: same reasoning for render.yaml itself —
              # scripts/check-spa-allowlists.test.sh guards the apex/www entries in
              # WIFIHAVEN_ALLOWED_ORIGINS / WIFIHAVEN_UI_ALLOWED_HOSTS, and the edit it
              # guards against is a render.yaml-only edit. Without this glob that PR shape
              # skips Shell Tests entirely and the guard never runs.
              - 'render.yaml'
            render:
              - '.github/workflows/ci.yml'
              - 'render.yaml'
            grafana-tf:
              - '.github/workflows/ci.yml'
              - 'infra/grafana/**'
              - 'deploy/grafana/dashboards/**'
            cloudflare-tf:
              - '.github/workflows/ci.yml'
              - 'infra/cloudflare/**'
            # #2442: the press Email Worker carries the auto-reply/DSN loop guard, and
            # master-press-worker.yml only DEPLOYS it — nothing ran its tests before merge.
            press-worker:
              - '.github/workflows/ci.yml'
              - 'deploy/press-worker/**'
            migrations:
              - '.github/workflows/ci.yml'
              - '.github/scripts/check-migrations.sh'
              - '.github/scripts/check-migration-isolation.sh'
              - 'api/resources/db/migration/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actionlint.yaml'
            # #2469: the cloud-agent prompts. Their Claude Code Cloud ROUTINE copy
            # is web-UI-only, so a merge does NOT update the running agent — this
            # filter feeds the re-paste reminder + PROMPT_VERSION bump guard below.
            # GLOB, not an enumeration: the script itself iterates
            # `deploy/*-agent/agent.yaml`, so listing the two known channels here
            # would silently skip the gate for a future third cloud agent — the
            # job would not run, and the umbrella `ci` job treats skipped as
            # success. That is precisely the silently-inert-change failure this
            # guard exists to catch, so the filter must match the script's glob.
            agent-prompts:
              - '.github/workflows/ci.yml'
              - '.github/scripts/check-agent-prompt-repaste.sh'
              - 'deploy/*-agent/agent.yaml'

  # ── Scala: format, compile, test ─────────────────────────────────────────
  # The dominant test-time cost used to be the per-test Flyway re-run
  # inside cleanAndMigrate (~400-500 ms × 44 migrations × hundreds of
  # tests). #1188 moved that work to a one-shot template-DB init at JVM
  # startup; per-test reset is now a sub-ms `DROP DATABASE + CREATE
  # DATABASE … TEMPLATE wh_template`. Mill's testParallelism=true
  # (default) is what runs worker JVMs in parallel across the runner's
  # vCPUs — each worker has its own EmbeddedPostgres + per-spec DBs
  # cloned from the template. See docs/testing-parallelism.md.
  scala:
    name: Scala Build & Test
    needs: changes
    if: needs.changes.outputs.scala == 'true'
    runs-on: ubuntu-latest

    env:
      WIFIHAVEN_JWT_SECRET: test-jwt-secret-for-ci-only
      # Pinned to the standard `ubuntu-latest` runner's 4 vCPUs (matches
      # mill's default `availableProcessors()` but kept explicit so any
      # change to `runs-on` stays coupled with the worker count it
      # implies). Bump in lockstep if the runner gets wider.
      MILL_JOBS: "4"

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Mill / Coursier
        # NB: we deliberately do NOT cache `out/`. It holds Zinc incremental-
        # compile analysis pegged to the source tree it was built against;
        # restoring it across SHAs (especially via restore-keys, which match
        # any older cache) silently poisons the build whenever the source
        # structure has moved on. #1189 hit exactly this: PR #1185 was
        # branched off pre-#1184 main, its CI populated `out/` against the
        # pre-#1184 Routes.scala, and after the merge the post-merge CI
        # restored that stale state and failed compile with 281 cascading
        # "Not found: type X" errors. Only cache the dep stores, which are
        # immutable downloads and safe to share across SHAs.
        uses: actions/cache@v5
        with:
          path: |
            ~/.mill
            ~/.cache/coursier
          key: mill-${{ env.MILL_VERSION }}-${{ hashFiles('build.mill') }}
          restore-keys: |
            mill-${{ env.MILL_VERSION }}-
            mill-

      - name: Install Mill (official launcher) and scalafmt
        run: |
          # Mill 1.x ships an official Bash launcher on Maven Central
          curl -fsSL "https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/${MILL_VERSION}/mill-dist-${MILL_VERSION}-mill.sh" \
            -o /tmp/mill
          chmod +x /tmp/mill
          sudo mv /tmp/mill /usr/local/bin/mill
          mill --version
          # scalafmt via coursier (Coursier's app channel handles this fine)
          curl -fsSL https://github.com/coursier/coursier/releases/latest/download/cs-x86_64-pc-linux.gz \
            | gunzip > /tmp/cs
          chmod +x /tmp/cs
          /tmp/cs install --install-dir /usr/local/bin --quiet scalafmt

      - name: Verify git hooks configured (informational, #1050)
        # Informational only — CI itself doesn't need hooks; this surfaces
        # when a contributor's local hooks weren't installed so they can fix
        # it before the next scalafmt CI failure.
        run: bash scripts/verify-hooks-configured.sh

      - name: scalafmt --check
        run: scalafmt --check --non-interactive

      - name: Compile all modules
        # `out/` is not cached (see Cache step), so this is a clean
        # Zinc compile from scratch — the stale-class-file workaround
        # from #845 and the cache-vs-task-state hazard from #946 don't
        # apply here.
        #
        # scalac TypeComparer recurses deeply on the long `++` chain of `Routes`
        # values in api/src/Main.scala once the ZLayer environment intersection
        # grows. GitHub runners default to a 1 MiB JVM stack and StackOverflow
        # before scalac's recursion-limit guard catches it. Mill spawns scalac
        # in an isolated worker JVM and forwards JAVA_OPTS (not JAVA_TOOL_OPTIONS)
        # to it, so set both — JAVA_OPTS for the worker, JAVA_TOOL_OPTIONS as
        # belt-and-braces for the mill launcher.
        env:
          JAVA_OPTS: "-Xss8m"
          JAVA_TOOL_OPTIONS: "-Xss8m"
        run: mill --jobs "$MILL_JOBS" __.compile

      - name: Run all tests
        # NOT sequential: Mill's testParallelism=true (default) spawns up
        # to MILL_JOBS worker JVMs that pull specs from a shared queue.
        # Each worker has its own EmbeddedPostgres singleton — no DB-level
        # contention across specs. shared.test is tiny (~2s) and stays in
        # one fork. docs/testing-parallelism.md has the full model.
        env:
          JAVA_OPTS: "-Xss8m"
          JAVA_TOOL_OPTIONS: "-Xss8m"
        run: |
          mill --jobs "$MILL_JOBS" shared.test
          mill --jobs "$MILL_JOBS" api.test

  # ── Migrations: forbid changes to existing files on PRs to main ─────────
  migrations-immutable:
    name: Migrations Immutability Check
    needs: changes
    # Path-gated like every other job (#1236). Runs on pull_request,
    # merge_group (queue), and push (CD) — each resolves its own base SHA
    # below. merge_group/CD always target main, so no base.ref clause.
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      # Same merge-ref-vs-base.sha staleness as migration-isolation below:
      # the check diffs `base.sha...HEAD` (three-dot), so HEAD must be the
      # true PR head, not the synthetic merge ref, or the merge-base resolves
      # wrong and the diff over-reports. (Lower blast radius here — the diff
      # is scoped to the migration dir and only blocks mutations, which never
      # land on main — but the pattern is identical, so pin it for the same
      # reason.) On push/merge_group github.sha is the real commit, so the
      # fallback is correct.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve base SHA
        id: base
        # pull_request → PR base; merge_group → merge-base; push → before-SHA;
        # workflow_dispatch → HEAD's parent. The `changes` job treats
        # push|workflow_dispatch identically (all='true'), so this job runs on
        # a manual CD dispatch too — but `github.event.before` only exists on
        # push, so a dispatch left BASE_SHA empty and check-migrations.sh
        # exited on its `${1:?usage}` guard, reding Master Router CD's
        # migrations-immutable gate on every manual dispatch (see #2143).
        # fetch-depth: 0 above makes HEAD^ available; diffing the tip commit
        # against its parent matches the single-merge push case and the
        # duplicate-version scan runs regardless of base.
        run: |
          case "${{ github.event_name }}" in
            pull_request)      echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT" ;;
            merge_group)       echo "sha=${{ github.event.merge_group.base_sha }}"  >> "$GITHUB_OUTPUT" ;;
            push)              echo "sha=${{ github.event.before }}"                >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch) echo "sha=$(git rev-parse HEAD^)"                    >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Reject changes to existing migration files
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          # Emergency escape hatch for #883 (duplicate V27 rename). The
          # mutation check is bypassed only on this specific PR branch;
          # the duplicate-version check still runs. On non-PR events
          # head.ref is empty, so this resolves to '0'.
          # TODO(#885): remove this env block after the #883 PR has merged.
          ALLOW_MIGRATION_MUTATIONS: ${{ github.event.pull_request.head.ref == 'fix-883-dup-v27' && '1' || '0' }}
        run: bash .github/scripts/check-migrations.sh "$BASE_SHA"

  # ── Migrations: enforce migration-only PRs ──────────────────────────────
  # The existing api.test feature suite is the real back-compat gate — it
  # runs the existing production code against embedded Postgres loaded with
  # every migration (including the new one in this PR). That only works
  # when the migration ships alone; co-shipping schema + code bypasses the
  # gate and reintroduces the #1176-class of bug. See
  # AGENTS.md §migrations-back-compat. This gate is unconditional — there is
  # no label opt-out; the correct workflow is a schema-only PR followed by a
  # code PR (#2098).
  migration-isolation:
    name: Migration Isolation Check
    needs: changes
    # Runs on pull_request + merge_group only (NOT push — redundant
    # post-merge). Path-gated like the rest (#1236).
    if: |
      needs.changes.outputs.migrations == 'true'
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    # CodeQL actions/missing-workflow-permissions: contents:read to diff the
    # branch.
    permissions:
      contents: read
    steps:
      # Check out the REAL PR head, not the default synthetic merge ref.
      # The "Resolve base SHA" step below passes the CURRENT main tip
      # (pull_request.base.sha) as BASE, and the script diffs `BASE...HEAD`
      # (three-dot = merge-base). When HEAD is the merge ref it can be stale
      # relative to base.sha (main advances after the merge ref was computed),
      # which defeats the merge-base resolution and collapses the diff to
      # two-dot semantics — picking up every file main changed since the PR
      # branched. That false-positived a migration-only PR (#1267) for
      # touching render.yaml, which #1268/#1208 had changed on main after the
      # PR branched. Pinning HEAD to the true PR head makes the merge-base
      # resolve to the real branch point. For merge_group the checked-out
      # commit is the real queued commit (github.sha), so the fallback is
      # already correct there.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Diff against the per-event base (three-dot semantics): PR base.sha for
      # pull_request, merge-base for merge_group. The script already uses
      # `<base>...HEAD`, so this resolves the same merge-base intent as the old
      # hardcoded origin/main. Matches AGENTS.md "Branch-diff checks".
      - name: Resolve base SHA
        id: base
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT" ;;
            merge_group)  echo "sha=${{ github.event.merge_group.base_sha }}"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Reject migration PRs that also change production source
        run: bash .github/scripts/check-migration-isolation.sh "${{ steps.base.outputs.sha }}"

  # ── Usage period: forbid hardcoding the data-derived report period ───────
  # The usage-report period is single-sourced at the agent (usage_report_interval)
  # and rides each traffic_reports row as period_start/period_end. The API must
  # never hold its own copy — #846 did (a hardcoded 5-min raw window) and it
  # silently drifted off the real 60s cadence (#2018). This guard fails a PR that
  # ADDS a hardcoded usage-period literal to the scoped usage/traffic + rollup
  # paths. See docs/process/single-source-of-truth.md and #2020.
  usage-period-hardcode:
    name: Usage Period Hardcode Check
    needs: changes
    # Path-gated on Scala changes; the script narrows to specific usage/traffic
    # files. PR + merge_group only (push is redundant post-merge).
    if: |
      needs.changes.outputs.scala == 'true'
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check out the REAL PR head (not the synthetic merge ref) so the
      # three-dot `BASE...HEAD` diff resolves the true merge-base — same
      # rationale as the migration jobs above.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve base SHA
        id: base
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT" ;;
            merge_group)  echo "sha=${{ github.event.merge_group.base_sha }}"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Reject new hardcoded usage-period literals
        run: bash .github/scripts/check-usage-period-hardcode.sh "${{ steps.base.outputs.sha }}"

  # ── Cloud-agent prompts: re-paste reminder + PROMPT_VERSION bump ─────────
  # The Claude Code Cloud ROUTINE copy of deploy/{support,press}-agent/agent.yaml
  # is WEB-UI-ONLY: merging does not update the running agent, and a stale
  # routine reports a green run while behaving from an old prompt (#2419/#2425,
  # #2430/#2441). This job warns that a re-paste is due after merge, and FAILS a
  # system:-block change that forgot to bump PROMPT_VERSION — the marker the live
  # agent echoes back, without which the drift detector is blind. See #2469.
  agent-prompt-repaste:
    name: Agent Prompt Re-paste Check
    needs: changes
    if: |
      needs.changes.outputs.agent-prompts == 'true'
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check out the REAL PR head (not the synthetic merge ref) so the
      # three-dot `BASE...HEAD` diff resolves the true merge-base — same
      # rationale as the migration jobs above.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve base SHA
        id: base
        run: |
          case "${{ github.event_name }}" in
            pull_request) echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT" ;;
            merge_group)  echo "sha=${{ github.event.merge_group.base_sha }}"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Remind about the web-UI-only routine prompt re-paste
        run: bash .github/scripts/check-agent-prompt-repaste.sh "${{ steps.base.outputs.sha }}"

  # ── Shell test discovery ─────────────────────────────────────────────────
  # Auto-discovers and runs every *.test.sh in the repo. Add a new test by
  # dropping a *.test.sh file alongside the script/hook it covers — no CI
  # change needed. (web/, node_modules, build outputs are excluded.)
  shell-tests:
    name: Shell Tests
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Discover and run *.test.sh
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(
            find . \
              \( -path ./node_modules -o -path ./web -o -path ./out -o -path ./.git \) -prune \
              -o -type f -name '*.test.sh' -print0
          )
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "No *.test.sh files found." ; exit 0
          fi
          fail=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if ! bash "$t"; then fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

  # ── OpenWrt agent: Lua unit tests ───────────────────────────────────────
  lua-tests:
    name: OpenWrt Lua Tests
    needs: changes
    if: needs.changes.outputs.lua == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lua + busted + lua-cjson
        run: |
          sudo apt-get update -q
          # lua5.1 matches OpenWrt 23.x (LuaJIT is 5.1-compatible).
          # liblua5.1-dev is needed for luarocks to compile C modules.
          sudo apt-get install -y lua5.1 liblua5.1-dev luarocks lua-cqueues lua-luaossl
          sudo luarocks install busted
          sudo luarocks install lua-cjson

      - name: Run openwrt agent tests
        working-directory: openwrt
        # Single source of truth: invoke test/run_tests.sh rather than a
        # hand-copied busted list. The previous inline list had drifted from
        # run_tests.sh (omitted sni/quic/lan_warn/eb_refresh/static_ip_labels/
        # host_metrics + every `sh test/*.sh` shell spec), so those tests did
        # not gate merges (#1870). run_tests.sh sets its own LUA_PATH and runs
        # the full busted suite + the shell specs + the #1845 ws-client e2e
        # (spike/ws-1845/e2e_test.sh, which actually runs here because the
        # Install step above provides lua-cqueues/lua-luaossl); adding a spec
        # there now automatically gates CI, so no separate per-spec CI step is
        # needed.
        run: sh test/run_tests.sh

  # ── Bidirectional contract tests (#634) ──────────────────────────────────
  # One job, one green/red signal for "the API ↔ router wire contract holds".
  # Runs the Scala consumer-side round-trip spec (decodes router→api fixtures
  # via the production decoder) AND the lua consumer-side spec (parses
  # api→router fixtures via luci.jsonc + render.lua). Separated from
  # lua-tests so a pure Scala model tweak doesn't re-run the full openwrt
  # matrix.
  contract-tests:
    name: Contract Tests (API ↔ Router)
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest

    env:
      WIFIHAVEN_JWT_SECRET: test-jwt-secret-for-ci-only

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Mill / Coursier
        # See note in scala-build job: `out/` is intentionally not cached
        # because Zinc incremental state poisons builds across SHAs (#1189).
        uses: actions/cache@v5
        with:
          path: |
            ~/.mill
            ~/.cache/coursier
          key: mill-${{ env.MILL_VERSION }}-${{ hashFiles('build.mill') }}
          restore-keys: |
            mill-${{ env.MILL_VERSION }}-
            mill-

      - name: Install Mill (official launcher)
        run: |
          curl -fsSL "https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/${MILL_VERSION}/mill-dist-${MILL_VERSION}-mill.sh" \
            -o /tmp/mill
          chmod +x /tmp/mill
          sudo mv /tmp/mill /usr/local/bin/mill
          mill --version

      - name: Install Lua + busted + lua-cjson + json-c
        run: |
          sudo apt-get update -q
          # libjson-c-dev is needed to build the real luci-lib-jsonc module below.
          sudo apt-get install -y lua5.1 liblua5.1-dev luarocks libjson-c-dev
          sudo luarocks install busted
          sudo luarocks install lua-cjson

      # Build the REAL luci-lib-jsonc (luci.jsonc) C module the agent uses in
      # production, so the contract fixtures are generated and verified by the
      # exact encoder the router runs — not the lua-cjson shim (#1367). The shim
      # is verified-byte-equivalent and remains the local-dev default; this step
      # is what guarantees no shim-vs-real divergence can slip past CI.
      - name: Build real luci-lib-jsonc encoder
        run: |
          bash openwrt/test/build-luci-jsonc.sh "$RUNNER_TEMP/luci-jsonc"
          echo "WIFIHAVEN_LUCI_JSONC_CPATH=$RUNNER_TEMP/luci-jsonc/?.so" >> "$GITHUB_ENV"

      # The real module must satisfy the same luci.jsonc behavior the fixtures
      # assume (empty table → [], whole double → N, fractional → full %.17g,
      # /→\/). Running the fidelity spec against the REAL module (shim dropped
      # from LUA_PATH) proves that, and catches an upstream/json-c formatting
      # change before it silently rewrites a fixture.
      - name: Verify luci.jsonc fidelity contract (real module)
        working-directory: openwrt
        run: |
          LUA_CPATH="$WIFIHAVEN_LUCI_JSONC_CPATH;;" \
          LUA_PATH="./files/usr/lib/lua/?.lua;./files/usr/lib/lua/wifihaven/?.lua;$(lua -e 'print(package.path)')" \
            busted test/jsonc_shim_spec.lua

      - name: Run API → router contract spec (lua consumer, real luci.jsonc)
        working-directory: openwrt
        run: |
          LUA_CPATH="$WIFIHAVEN_LUCI_JSONC_CPATH;;" \
          LUA_PATH="./files/usr/lib/lua/?.lua;./files/usr/lib/lua/wifihaven/?.lua;$(lua -e 'print(package.path)')" \
            busted test/contract_spec.lua

      - name: Run router → API contract spec (Scala consumer)
        run: mill shared.test.testOnly wifihaven.shared.contract.ContractGoldenSpec

      # Drift guard: re-run the generators and fail if the committed fixtures
      # differ. The lua generator uses the REAL luci.jsonc (via
      # WIFIHAVEN_LUCI_JSONC_CPATH, set above), so this also catches any
      # shim-vs-real-module divergence. Catches a contributor who edited a
      # producer (router lua POST builder or Scala codec) without re-running
      # regen-contract-fixtures.sh.
      - name: Verify fixtures are in sync with producers
        run: |
          bash scripts/regen-contract-fixtures.sh
          if ! git diff --exit-code contract/; then
            echo "::error::contract/ is out of sync with producers — run scripts/regen-contract-fixtures.sh and commit the diff."
            exit 1
          fi

  # ── OPNsense agent: Python unit tests ───────────────────────────────────
  python-tests:
    name: OPNsense Python Tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run opnsense agent tests
        working-directory: opnsense
        run: python -m pytest test/ -v

  # ── Gate-2 fake API shim: aiohttp service unit tests (#682) ─────────────
  fake-api-tests:
    name: Fake API Shim Tests
    needs: changes
    if: needs.changes.outputs.fake-api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fake-api + test deps
        working-directory: scripts/e2e/fake-api
        run: pip install -e '.[test]'

      - name: Run pytest
        working-directory: scripts/e2e/fake-api
        run: pytest -v

  # ── E2E helper-lib unit tests (#2179) ───────────────────────────────────
  # Pure-python cover for scripts/e2e/lib. Introduced to gate the staging
  # test-router pruner's selection logic (stale_routers.select_stale_test_routers,
  # used by prune_stale_staging_routers.py). Scoped to an explicit allowlist of
  # test files (not the whole dir) so it doesn't retroactively turn on the older
  # lib test files that predate any CI runner and may need extra wiring — those
  # can be folded in separately. Members:
  #   test_stale_routers.py — staging test-router pruner selection (#2179)
  #   test_wan_health.py    — guest-WAN-DHCP Gate-2 flake signature (#2390)
  e2e-lib-tests:
    name: E2E lib unit tests
    needs: changes
    if: needs.changes.outputs.e2e-lib == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run e2e-lib unit tests
        # CWD = the lib dir so the modules import bare (the established
        # convention for scripts/e2e/lib/test_*.py — no package prefix).
        working-directory: scripts/e2e/lib
        run: python -m pytest test_stale_routers.py test_wan_health.py -v

  # ── render.yaml: YAML parse check ───────────────────────────────────────
  render-blueprint:
    name: Render Blueprint Lint
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Parse render.yaml
        # Ruby ships preinstalled on ubuntu-latest. Catches YAML regressions
        # before they reach Render's blueprint importer.
        run: ruby -ryaml -e "YAML.load_file('render.yaml')"

  # ── infra/grafana Terraform: fmt + validate ─────────────────────────────
  # Mirrors render-blueprint: a cheap config-quality gate for the Grafana
  # Cloud dashboard deploy layer (#1270). Catches fmt drift and invalid HCL
  # before the master-grafana.yml deploy-grafana job runs `terraform apply`.
  # Also json-parses every committed dashboard so a malformed export can't
  # reach Grafana.
  grafana-terraform:
    name: Grafana Terraform Lint
    needs: changes
    if: needs.changes.outputs.grafana-tf == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.3'

      - name: terraform fmt
        working-directory: infra/grafana
        run: terraform fmt -check -diff

      - name: terraform init + validate
        working-directory: infra/grafana
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate dashboard JSON parses
        run: |
          for f in deploy/grafana/dashboards/*.json; do
            echo "Checking $f"
            python3 -m json.tool "$f" > /dev/null
          done

  # ── infra/cloudflare Terraform: fmt + validate ──────────────────────────
  # Cheap config-quality gate for the Cloudflare DNS/Pages Terraform in
  # infra/cloudflare/. Catches fmt drift and invalid HCL before an operator
  # runs `terraform apply` against the wifihaven.net zone.
  #
  # NOTE: this job does NOT run `terraform apply`. Cloudflare API credentials
  # (CLOUDFLARE_API_TOKEN) are never needed here and are NOT in CI secrets.
  # All DNS record changes (including the e2e test fixture records added in
  # #1351) require a manual `terraform apply` by the operator.
  cloudflare-terraform:
    name: Cloudflare Terraform Lint
    needs: changes
    if: needs.changes.outputs.cloudflare-tf == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.3'

      - name: terraform fmt
        working-directory: infra/cloudflare
        run: terraform fmt -check -diff

      - name: terraform init + validate
        working-directory: infra/cloudflare
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # ── GitHub Actions workflow lint ─────────────────────────────────────────
  # actionlint statically checks every workflow under .github/workflows/ for
  # syntax errors, bad expressions, unknown runner labels, and (via the
  # shellcheck preinstalled on ubuntu-latest) issues in inline `run:` scripts.
  # The custom self-hosted `kvm` label is declared in .github/actionlint.yaml
  # so the VM e2e workflows don't trip the unknown-runner-label check.
  actionlint:
    name: Actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"

      - name: Run actionlint
        run: ./actionlint -color

  # ── Frontend: type-check, lint, build ────────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  # ── Press Email Worker: typecheck + unit tests ───────────────────────────
  # #2442. master-press-worker.yml only deploys this Worker, so until now nothing
  # ran against it before merge. The loop guard it now carries decides whether a
  # press message reaches a journalist at all, which is exactly the kind of logic
  # that must not ship on a deploy-only pipeline.
  press-worker:
    name: Press Worker Tests
    needs: changes
    if: needs.changes.outputs.press-worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/press-worker

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: deploy/press-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Vitest
        run: npm test

  # ── Umbrella gating job ──────────────────────────────────────────────────
  # Branch protection requires this single check. It depends on every
  # downstream job and passes when each one is either successful, skipped
  # (i.e. its paths weren't touched on this PR), or cancelled. Cancellation
  # is treated as neutral — it only happens when the entire run was cancelled
  # (concurrency supersede or manual cancel). GitHub already marks the head
  # commit's status from the newest run, so treating cancelled as neutral
  # does not weaken the gate. A genuine failure still fails this check.
  ci:
    name: CI
    if: always()
    needs:
      - changes
      - scala
      - migrations-immutable
      - migration-isolation
      - usage-period-hardcode
      - agent-prompt-repaste
      - shell-tests
      - lua-tests
      - contract-tests
      - python-tests
      - fake-api-tests
      - e2e-lib-tests
      - render-blueprint
      - grafana-terraform
      - cloudflare-terraform
      - actionlint
      - frontend
      - press-worker
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          bad = {name: meta["result"] for name, meta in data.items()
                 if meta["result"] not in ("success", "skipped", "cancelled")}
          if bad:
              print(f"Failing jobs: {bad}")
              sys.exit(1)
          print("All required jobs succeeded, were skipped, or were cancelled.")
          '
