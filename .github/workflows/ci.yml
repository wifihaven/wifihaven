name: CI

# Where do new tests go? See docs/testing.md.

on:
  pull_request:
    # Run on PRs targeting any branch
  merge_group:
    # Run on gh-readonly-queue/* refs so the merge queue gates on the same
    # check PRs do (#1094).
  workflow_call:
    # Invoked by master-api-ui.yml and master-router.yml on push to main so
    # the CD pipelines gate publish on the same test matrix PRs run. Direct
    # push:main is intentionally omitted — main coverage flows through the
    # two Master CD workflows (issue #190).
  workflow_dispatch:

env:
  MILL_VERSION: "1.1.5"
  ACTIONLINT_VERSION: "1.7.12"
  # Opt into Node.js 24 now (forced default June 2026 anyway). Silences the
  # Node 20 deprecation warnings emitted by actions/checkout@v6, setup-java@v4,
  # setup-node@v4, cache@v4, codeql-action@v4 etc.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Path filter: decide which downstream jobs need to run on this PR ─────
  # On workflow_call (from the Master CD workflows) and workflow_dispatch we force every
  # output to 'true' so the post-merge CD gate and manual runs still execute
  # the full matrix. On pull_request we let dorny/paths-filter compute deltas
  # against the PR base. Any change to ci.yml itself also forces everything.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      scala: ${{ steps.filter.outputs.scala || steps.force.outputs.all }}
      frontend: ${{ steps.filter.outputs.frontend || steps.force.outputs.all }}
      lua: ${{ steps.filter.outputs.lua || steps.force.outputs.all }}
      python: ${{ steps.filter.outputs.python || steps.force.outputs.all }}
      shell: ${{ steps.filter.outputs.shell || steps.force.outputs.all }}
      render: ${{ steps.filter.outputs.render || steps.force.outputs.all }}
      migrations: ${{ steps.filter.outputs.migrations || steps.force.outputs.all }}
      contract: ${{ steps.filter.outputs.contract || steps.force.outputs.all }}
      fake-api: ${{ steps.filter.outputs.fake-api || steps.force.outputs.all }}
      workflows: ${{ steps.filter.outputs.workflows || steps.force.outputs.all }}
    steps:
      - name: Force full matrix for non-PR triggers
        id: force
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            scala:
              # Narrowed: Scala job only compiles + tests Scala. Docker
              # images, deploy scripts, and config/ (example file only) do
              # not feed into compile or test, so they shouldn't trigger
              # a ~minutes-long EmbeddedPostgres run.
              - '.github/workflows/ci.yml'
              - 'api/**'
              - 'shared/**'
              - 'build.mill'
              - '.scalafmt.conf'
            frontend:
              - '.github/workflows/ci.yml'
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
            lua:
              - '.github/workflows/ci.yml'
              - 'openwrt/**'
            # Bidirectional contract (#634) lives in its own job — see
            # `contract-tests` below. Kept separate so a pure Scala model
            # tweak doesn't drag the full openwrt/lua matrix along.
            contract:
              - '.github/workflows/ci.yml'
              - 'shared/contract/**'
              - 'shared/src/Models.scala'
              - 'shared/src/types/**'
              - 'openwrt/test/contract_spec.lua'
              - 'openwrt/test/contract_gen.lua'
              - 'openwrt/files/usr/lib/lua/wifihaven/render.lua'
              - 'openwrt/files/usr/lib/lua/wifihaven/render.nft'
              - 'openwrt/files/usr/lib/lua/wifihaven/conntrack.lua'
              - 'openwrt/files/usr/lib/lua/wifihaven/usage.lua'
              - 'openwrt/test/shim/**'
              - 'api/**'
              - 'shared/**'
              - 'build.mill'
              - 'scripts/regen-contract-fixtures.sh'
              # Additional producers (#667): the install.sh printf that
              # generates POST /api/router/register bodies (the documented
              # exception in shared/contract/README.md), and the python
              # fake-router which is a second producer of router→API bodies
              # — #664 demonstrated it can drift the contract independently.
              - 'openwrt/install.sh'
              - 'docker/fake-router.py'
            python:
              - '.github/workflows/ci.yml'
              - 'opnsense/**'
            # Gate-2 (#654) fake API shim. Separate from `python:` so a
            # pure opnsense tweak doesn't run the aiohttp suite (and vice
            # versa). Also tracks the contract golden the fake loads as
            # its initial snapshot — a fixture regen should re-run these.
            fake-api:
              - '.github/workflows/ci.yml'
              - 'scripts/e2e/fake-api/**'
              - 'shared/contract/api-to-router/policy_snapshot.json'
            shell:
              - '.github/workflows/ci.yml'
              - 'deploy/**/*.sh'
              - 'scripts/**'
              - 'openwrt/install.sh'
              - 'openwrt/test/**'
              - '**/*.bats'
              - '**/*.test.sh'
            render:
              - '.github/workflows/ci.yml'
              - 'render.yaml'
            migrations:
              - '.github/workflows/ci.yml'
              - '.github/scripts/check-migrations.sh'
              - '.github/scripts/check-migration-isolation.sh'
              - 'api/resources/db/migration/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actionlint.yaml'

  # ── Scala: format, compile, test ─────────────────────────────────────────
  scala:
    name: Scala Build & Test
    needs: changes
    if: needs.changes.outputs.scala == 'true'
    runs-on: ubuntu-latest

    env:
      WIFIHAVEN_JWT_SECRET: test-jwt-secret-for-ci-only

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Mill / Coursier
        # NB: we deliberately do NOT cache `out/`. It holds Zinc incremental-
        # compile analysis pegged to the source tree it was built against;
        # restoring it across SHAs (especially via restore-keys, which match
        # any older cache) silently poisons the build whenever the source
        # structure has moved on. #1189 hit exactly this: PR #1185 was
        # branched off pre-#1184 main, its CI populated `out/` against the
        # pre-#1184 Routes.scala, and after the merge the post-merge CI
        # restored that stale state and failed compile with 281 cascading
        # "Not found: type X" errors. Only cache the dep stores, which are
        # immutable downloads and safe to share across SHAs.
        uses: actions/cache@v5
        with:
          path: |
            ~/.mill
            ~/.cache/coursier
          key: mill-${{ env.MILL_VERSION }}-${{ hashFiles('build.mill') }}
          restore-keys: |
            mill-${{ env.MILL_VERSION }}-
            mill-

      - name: Install Mill (official launcher) and scalafmt
        run: |
          # Mill 1.x ships an official Bash launcher on Maven Central
          curl -fsSL "https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/${MILL_VERSION}/mill-dist-${MILL_VERSION}-mill.sh" \
            -o /tmp/mill
          chmod +x /tmp/mill
          sudo mv /tmp/mill /usr/local/bin/mill
          mill --version
          # scalafmt via coursier (Coursier's app channel handles this fine)
          curl -fsSL https://github.com/coursier/coursier/releases/latest/download/cs-x86_64-pc-linux.gz \
            | gunzip > /tmp/cs
          chmod +x /tmp/cs
          /tmp/cs install --install-dir /usr/local/bin --quiet scalafmt

      - name: Verify git hooks configured (informational, #1050)
        # Informational only — CI itself doesn't need hooks; this surfaces
        # when a contributor's local hooks weren't installed so they can fix
        # it before the next scalafmt CI failure.
        run: bash scripts/verify-hooks-configured.sh

      - name: scalafmt --check
        run: scalafmt --check --non-interactive

      - name: Compile all modules
        # `out/` is not cached (see Cache step), so this is a clean
        # Zinc compile from scratch — the stale-class-file workaround
        # from #845 and the cache-vs-task-state hazard from #946 don't
        # apply here.
        #
        # scalac TypeComparer recurses deeply on the long `++` chain of `Routes`
        # values in api/src/Main.scala once the ZLayer environment intersection
        # grows. GitHub runners default to a 1 MiB JVM stack and StackOverflow
        # before scalac's recursion-limit guard catches it. Mill spawns scalac
        # in an isolated worker JVM and forwards JAVA_OPTS (not JAVA_TOOL_OPTIONS)
        # to it, so set both — JAVA_OPTS for the worker, JAVA_TOOL_OPTIONS as
        # belt-and-braces for the mill launcher.
        env:
          JAVA_OPTS: "-Xss8m"
          JAVA_TOOL_OPTIONS: "-Xss8m"
        run: mill __.compile

      - name: Run all tests (sequential to avoid embedded-pg lock contention)
        # api.test spins up EmbeddedPostgres; running sequentially avoids
        # JVM-wide file-lock contention if more DB-heavy tests are added later.
        env:
          JAVA_OPTS: "-Xss8m"
          JAVA_TOOL_OPTIONS: "-Xss8m"
        run: |
          mill shared.test
          mill api.test

  # ── Migrations: forbid changes to existing files on PRs to main ─────────
  migrations-immutable:
    name: Migrations Immutability Check
    needs: changes
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject changes to existing migration files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Emergency escape hatch for #883 (duplicate V27 rename). The
          # mutation check is bypassed only on this specific PR branch;
          # the duplicate-version check still runs.
          # TODO(#885): remove this env block after the #883 PR has merged.
          ALLOW_MIGRATION_MUTATIONS: ${{ github.event.pull_request.head.ref == 'fix-883-dup-v27' && '1' || '0' }}
        run: bash .github/scripts/check-migrations.sh "$BASE_SHA"

  # ── Migrations: enforce migration-only PRs ──────────────────────────────
  # The existing api.test feature suite is the real back-compat gate — it
  # runs the existing production code against embedded Postgres loaded with
  # every migration (including the new one in this PR). That only works
  # when the migration ships alone; co-shipping schema + code bypasses the
  # gate and reintroduces the #1176-class of bug. See
  # AGENTS.md §migrations-back-compat. Skip with the
  # `migration-coupled-justified` label on the PR.
  migration-isolation:
    name: Migration Isolation Check
    needs: changes
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.base.ref == 'main'
      && needs.changes.outputs.migrations == 'true'
      && !contains(github.event.pull_request.labels.*.name, 'migration-coupled-justified')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject migration PRs that also change production source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check-migration-isolation.sh "$BASE_SHA"

  # ── Shell test discovery ─────────────────────────────────────────────────
  # Auto-discovers and runs every *.test.sh in the repo. Add a new test by
  # dropping a *.test.sh file alongside the script/hook it covers — no CI
  # change needed. (web/, node_modules, build outputs are excluded.)
  shell-tests:
    name: Shell Tests
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Discover and run *.test.sh
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(
            find . \
              \( -path ./node_modules -o -path ./web -o -path ./out -o -path ./.git \) -prune \
              -o -type f -name '*.test.sh' -print0
          )
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "No *.test.sh files found." ; exit 0
          fi
          fail=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if ! bash "$t"; then fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

  # ── OpenWrt agent: Lua unit tests ───────────────────────────────────────
  lua-tests:
    name: OpenWrt Lua Tests
    needs: changes
    if: needs.changes.outputs.lua == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lua + busted + lua-cjson
        run: |
          sudo apt-get update -q
          # lua5.1 matches OpenWrt 23.x (LuaJIT is 5.1-compatible).
          # liblua5.1-dev is needed for luarocks to compile C modules.
          sudo apt-get install -y lua5.1 liblua5.1-dev luarocks
          sudo luarocks install busted
          sudo luarocks install lua-cjson

      - name: Run openwrt agent tests
        working-directory: openwrt
        run: |
          LUA_PATH="./files/usr/lib/lua/wifihaven/?.lua;./test/shim/?.lua;./test/shim/?/init.lua;$(lua -e 'print(package.path)')" \
            busted test/conntrack_spec.lua

  # ── Bidirectional contract tests (#634) ──────────────────────────────────
  # One job, one green/red signal for "the API ↔ router wire contract holds".
  # Runs the Scala consumer-side round-trip spec (decodes router→api fixtures
  # via the production decoder) AND the lua consumer-side spec (parses
  # api→router fixtures via luci.jsonc + render.lua). Separated from
  # lua-tests so a pure Scala model tweak doesn't re-run the full openwrt
  # matrix.
  contract-tests:
    name: Contract Tests (API ↔ Router)
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest

    env:
      WIFIHAVEN_JWT_SECRET: test-jwt-secret-for-ci-only

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Mill / Coursier
        # See note in scala-build job: `out/` is intentionally not cached
        # because Zinc incremental state poisons builds across SHAs (#1189).
        uses: actions/cache@v5
        with:
          path: |
            ~/.mill
            ~/.cache/coursier
          key: mill-${{ env.MILL_VERSION }}-${{ hashFiles('build.mill') }}
          restore-keys: |
            mill-${{ env.MILL_VERSION }}-
            mill-

      - name: Install Mill (official launcher)
        run: |
          curl -fsSL "https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/${MILL_VERSION}/mill-dist-${MILL_VERSION}-mill.sh" \
            -o /tmp/mill
          chmod +x /tmp/mill
          sudo mv /tmp/mill /usr/local/bin/mill
          mill --version

      - name: Install Lua + busted + lua-cjson
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1 liblua5.1-dev luarocks
          sudo luarocks install busted
          sudo luarocks install lua-cjson

      - name: Run API → router contract spec (lua consumer)
        working-directory: openwrt
        run: |
          LUA_PATH="./files/usr/lib/lua/?.lua;./files/usr/lib/lua/wifihaven/?.lua;./test/shim/?.lua;./test/shim/?/init.lua;$(lua -e 'print(package.path)')" \
            busted test/contract_spec.lua

      - name: Run router → API contract spec (Scala consumer)
        run: mill shared.test.testOnly wifihaven.shared.contract.ContractGoldenSpec

      # Drift guard: re-run the generators and fail if the committed fixtures
      # differ. Catches a contributor who edited a producer (router lua POST
      # builder or Scala codec) without re-running regen-contract-fixtures.sh.
      - name: Verify fixtures are in sync with producers
        run: |
          bash scripts/regen-contract-fixtures.sh
          if ! git diff --exit-code shared/contract/; then
            echo "::error::shared/contract/ is out of sync with producers — run scripts/regen-contract-fixtures.sh and commit the diff."
            exit 1
          fi

  # ── OPNsense agent: Python unit tests ───────────────────────────────────
  python-tests:
    name: OPNsense Python Tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run opnsense agent tests
        working-directory: opnsense
        run: python -m pytest test/ -v

  # ── Gate-2 fake API shim: aiohttp service unit tests (#682) ─────────────
  fake-api-tests:
    name: Fake API Shim Tests
    needs: changes
    if: needs.changes.outputs.fake-api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fake-api + test deps
        working-directory: scripts/e2e/fake-api
        run: pip install -e '.[test]'

      - name: Run pytest
        working-directory: scripts/e2e/fake-api
        run: pytest -v

  # ── render.yaml: YAML parse check ───────────────────────────────────────
  render-blueprint:
    name: Render Blueprint Lint
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Parse render.yaml
        # Ruby ships preinstalled on ubuntu-latest. Catches YAML regressions
        # before they reach Render's blueprint importer.
        run: ruby -ryaml -e "YAML.load_file('render.yaml')"

  # ── GitHub Actions workflow lint ─────────────────────────────────────────
  # actionlint statically checks every workflow under .github/workflows/ for
  # syntax errors, bad expressions, unknown runner labels, and (via the
  # shellcheck preinstalled on ubuntu-latest) issues in inline `run:` scripts.
  # The custom self-hosted `kvm` label is declared in .github/actionlint.yaml
  # so the VM e2e workflows don't trip the unknown-runner-label check.
  actionlint:
    name: Actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"

      - name: Run actionlint
        run: ./actionlint -color

  # ── Frontend: type-check, lint, build ────────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  # ── Umbrella gating job ──────────────────────────────────────────────────
  # Branch protection requires this single check. It depends on every
  # downstream job and passes when each one is either successful or skipped
  # (i.e. its paths weren't touched on this PR). Any failure or cancellation
  # in a dependency fails this check.
  ci:
    name: CI
    if: always()
    needs:
      - changes
      - scala
      - migrations-immutable
      - migration-isolation
      - shell-tests
      - lua-tests
      - contract-tests
      - python-tests
      - fake-api-tests
      - render-blueprint
      - actionlint
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          bad = {name: meta["result"] for name, meta in data.items()
                 if meta["result"] not in ("success", "skipped")}
          if bad:
              print(f"Failing jobs: {bad}")
              sys.exit(1)
          print("All required jobs succeeded or were skipped.")
          '
