name: Master API/UI CD

# Where do new tests go? See docs/testing.md (Gate 1 lives in this workflow).

# API + SPA deployment pipeline. Split off from the unified Master CD in
# #871 — see master-router.yml for the router half and the split rationale.
#
# Flow (unchanged from the pre-split unified workflow, minus the router
# leg):
#
#   ci-tests + bootstrap-smoke + e2e + prod-stack-smoke
#     → build-image                  (push sha-<commit> + `staging` tags ONLY; not `:latest`)
#     → deploy-staging               (curl staging deploy hook; wait for /api/health)
#       ‖ deploy-spa-staging         (build + wrangler push to Cloudflare Pages — parallel
#                                     with deploy-staging, gated on the same test chain)
#     → smoke-staging                (lightweight curl checks against api-staging.wifihaven.net
#                                     AND staging.wifihaven.net SPA)
#     → api-smoke-staging            (Gate 1 — admin + router API contract smoke against staging)
#     → gate-3b-api-staging          (Gate 3b — last-published qemu router + freshly-deployed
#                                     staging API; #655)
#     → approve-production           (manual-approval gate — GitHub `production`
#                                     environment; required reviewer must click
#                                     "Approve and deploy" before the deploy-production
#                                     jobs run; see #498)
#     → deploy-production            (parallel jobs; all gated on approve-production):
#                                       • retag-latest       — promote sha-<commit> → :latest
#                                                              via `docker buildx imagetools create`
#                                       • deploy-prod-render — curl prod deploy hook + health poll
#                                       • deploy-spa-prod    — build + wrangler push to
#                                                              wifihaven Pages project (#613)
#
# OpenWRT release lives on master-router.yml. shared/** wire-schema changes
# fire BOTH pipelines until #597 (capability negotiation) lands — the
# `production` environment serializes approval prompts so tandem releases
# stay coordinated.
#
# TODO(#597): the wire-schema bump (capability negotiation framework) gets
# coordinated across both pipelines once #597's mechanism lands.

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'config/**'
      - 'deploy/**'
      - 'docker/**'
      - 'infra/**'
      - 'scripts/**'
      - 'shared/**'
      - '.github/workflows/master-api-ui.yml'
      - '.github/workflows/e2e-vm-gate3b.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Workflow-level concurrency scoped to THIS pipeline's group name — api/ui
# pushes pre-empt earlier api/ui pushes; router pushes (on master-router.yml,
# in a different group) cannot cancel an api/ui run. The original #871 bug
# was a unified group cancelling across both surfaces; the split fixes that.
concurrency:
  group: master-api-ui-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN to minimum privilege at the workflow level — jobs
# that need more (build-image, retag-latest → packages: write) override
# locally.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wifihaven-api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  STAGING_API_URL: https://api-staging.wifihaven.net
  PROD_API_URL: https://api.wifihaven.net

jobs:
  # ── 1. Full CI test matrix (unit, lint, lua, python, shell, frontend) ─────
  ci-tests:
    name: CI
    # Gate every job to main: the broad `paths:` filter above lets feature-
    # branch pushes create a run, but on a non-main ref no job is eligible
    # and GitHub records a 0-job `failure`. Skipping (not failing) the jobs
    # turns that spurious red run neutral. `workflow_dispatch` on main still
    # satisfies this; dispatch on a non-main ref is intentionally skipped. (#1136)
    if: github.ref == 'refs/heads/main'
    # ci.yml's migration-isolation job declares `pull-requests: read` (for the
    # merge_group `gh pr list` label lookup). GitHub validates a called
    # workflow's job permissions against the caller's grant at LOAD time,
    # before `if:` gating — so without this scope the call exceeds the
    # workflow-level `contents: read` cap and the whole CD run startup_failures
    # even though that job is skipped on push. (#1259)
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  # ── 2. E2E + smoke tests (unconditional) ──────────────────────────────────
  bootstrap-smoke:
    name: bootstrap-host.sh smoke (Ubuntu container)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build + run bootstrap test image
        run: |
          docker build -f docker/bootstrap-test.Dockerfile -t wifihaven-bootstrap-test .
          docker run --rm wifihaven-bootstrap-test

  e2e:
    name: Live e2e against staging stack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build + start staging stack
        run: |
          docker compose -f docker/docker-compose.yml up -d --build --wait

      - name: Run e2e tests
        run: scripts/e2e-tests.sh

      - name: Run router e2e tests
        run: scripts/e2e-router.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml logs api          || true
          docker compose -f docker/docker-compose.yml logs postgres     || true
          docker compose -f docker/docker-compose.yml logs fake-router  || true

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  prod-stack-smoke:
    name: deploy/docker-compose.prod.yml smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run prod-stack smoke
        run: scripts/smoke-prod.sh

  # VM e2e on the API/UI side is Gate 3b (gate-3b-api-staging, below),
  # which gates approve-production. The old monolithic e2e-vm.yml that
  # gated nothing was retired in #656.

  # ── 3. Build the API image (sha-<commit> + `staging` tags only) ──────────
  # `:latest` is NOT pushed here. Promotion to `:latest` happens in the
  # deploy-production retag job, only after staging smoke passes. Staging
  # tracks the moving `staging` tag — simpler than rewriting the Render
  # service image URL via API on every deploy (issue #588 says: pick the
  # simpler option; we did).
  build-image:
    name: Build Docker image to ghcr.io (sha + staging tags)
    if: github.ref == 'refs/heads/main'
    needs: [ci-tests, bootstrap-smoke, e2e, prod-stack-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # #1140: surfaced so deploy-staging can assert /api/version == this SHA.
      short_sha: ${{ steps.ver.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          # #499: derive-version.sh counts commits since VERSION last
          # changed; shallow clones break that count.
          fetch-depth: 0

      - name: Derive WifiHaven version (#499)
        id: ver
        run: |
          set -eu
          short=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version=$(./scripts/ci/derive-version.sh --dev "$short")
          else
            version=$(./scripts/ci/derive-version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # #1140: short SHA is baked into the image and asserted by the
          # deploy-staging health-poll to prove THIS build is serving.
          echo "short_sha=$short" >> "$GITHUB_OUTPUT"
          echo "Derived version: $version (sha-$short)"

      - name: Set up QEMU (for linux/arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # NOTE: `latest` is deliberately omitted — it's published by the
          # deploy-production retag job after staging smoke.
          # #499: v<X.Y.Z> is added so the API image is reachable at the
          # same semver tag as the OpenWRT release.
          tags: |
            type=raw,value=staging
            type=sha,prefix=sha-,format=short
            type=raw,value=v${{ steps.ver.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # #1140: bake the short SHA so /api/version reports this build.
          build-args: |
            WIFIHAVEN_GIT_SHA=${{ steps.ver.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Deploy staging ─────────────────────────────────────────────────────
  # The Render staging service is configured to track the `staging` image
  # tag. The deploy hook tells Render to pull whatever now lives at that tag
  # (which the build-image job just pushed) and roll the service.
  deploy-staging:
    name: Deploy staging (Render)
    if: github.ref == 'refs/heads/main'
    needs: [build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render staging deploy hook
        env:
          RENDER_DEPLOY_HOOK_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: |
          # Use --fail to surface non-2xx; pipe to /dev/null so the URL
          # (which contains the secret key) is never echoed even on failure.
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$RENDER_DEPLOY_HOOK_STAGING" >/dev/null
          echo "Staging deploy hook accepted."

      - name: Wait for staging to serve THIS build (#1140)
        env:
          EXPECTED_SHA: ${{ needs.build-image.outputs.short_sha }}
        run: |
          # Poll /api/version until the served `sha` equals the SHA we just
          # built and pushed. This is the load-bearing check: during a Render
          # rollover the OLD container keeps answering 200 on /api/health, so
          # a green health-poll does NOT prove the new image is live (the
          # #1138 false positive). Asserting the served SHA closes that blind
          # spot. Render's rollout typically takes 30-90s; allow 15 minutes.
          set -u
          echo "Expecting served sha=${EXPECTED_SHA}"
          deadline=$(( $(date +%s) + 900 ))
          while (( $(date +%s) < deadline )); do
            served=$(curl --fail --silent --max-time 15 \
                       "${STAGING_API_URL}/api/version" \
                     | grep -oE '"sha":"[^"]*"' | cut -d'"' -f4 || true)
            if [ "$served" = "$EXPECTED_SHA" ]; then
              echo "Staging is serving the just-deployed build (sha=${served})."
              exit 0
            fi
            echo "Still waiting — served sha=${served:-<none>}, want ${EXPECTED_SHA}"
            sleep 10
          done
          echo "Timed out waiting for staging to serve sha=${EXPECTED_SHA}." >&2
          exit 1

  # ── 4b. Deploy SPA to Cloudflare Pages (staging) ──────────────────────────
  # Runs in parallel with deploy-staging — SPA build doesn't depend on the
  # API image. Gated on the same test chain as build-image so a CI failure
  # blocks both surfaces. smoke-staging waits on this job, so the SPA is
  # live at staging.wifihaven.net before the cross-origin CORS checks run.
  deploy-spa-staging:
    name: Deploy SPA to Cloudflare Pages (staging)
    if: github.ref == 'refs/heads/main'
    needs: [ci-tests, bootstrap-smoke, e2e, prod-stack-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Build SPA (staging)
        working-directory: web
        env:
          VITE_API_BASE_URL: https://api-staging.wifihaven.net
        run: npm run build

      - name: Stage wrangler.staging.toml as wrangler.toml
        working-directory: web
        # Wrangler 4 rejects `--config` for `pages deploy` entirely (#672).
        # Pages only reads the default `wrangler.toml`, so swap it in.
        run: cp wrangler.staging.toml wrangler.toml

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: web
          # Pass an explicit ASCII commit message + hash. Without these
          # wrangler auto-detects the git commit message, and the
          # Cloudflare Pages deployments API rejects multi-byte UTF-8
          # (e.g. `§`) with code 8000111 despite advertising UTF-8.
          command: pages deploy --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.sha }}"

  # ── 5. Smoke-test staging ─────────────────────────────────────────────────
  # Fast (<2 min) end-user-facing checks against the deployed staging URL.
  # NOT a replica of scripts/e2e-tests.sh — that runs pre-deploy against the
  # docker-compose stack. This is "did the deploy itself break anything that
  # only manifests on real Render infra" — CORS, TLS, db connectivity, the
  # SPA cross-origin contract.
  smoke-staging:
    name: Smoke-test staging
    if: github.ref == 'refs/heads/main'
    needs: [deploy-staging, deploy-spa-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Health endpoint returns 200 + db ok
        run: |
          body=$(curl --fail --silent --show-error --max-time 10 \
            "${STAGING_API_URL}/api/health")
          echo "$body"
          echo "$body" | grep -q '"db":\s*"ok"'

      - name: CORS preflight from staging SPA origin returns expected headers
        # Catches the class of bug fixed in #626 (empty
        # Access-Control-Allow-Headers).
        run: |
          headers=$(curl --silent --show-error --max-time 10 -i \
            -X OPTIONS \
            -H "Origin: https://staging.wifihaven.net" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,authorization" \
            "${STAGING_API_URL}/api/health")
          echo "$headers"
          echo "$headers" | grep -i '^access-control-allow-origin: https://staging.wifihaven.net'
          # Allow-Headers must echo back the requested headers — empty value
          # is the #626 regression.
          allow=$(echo "$headers" | grep -i '^access-control-allow-headers:' || true)
          [[ -n "$allow" ]] || { echo "missing Access-Control-Allow-Headers" >&2; exit 1; }
          echo "$allow" | grep -iq 'content-type'

      - name: Staging SPA returns 200 and bakes the staging API URL
        # Confirms the Cloudflare Pages deploy aliased the new build to
        # staging.wifihaven.net and the VITE_API_BASE_URL was wired
        # correctly (a prod-API URL in a staging bundle would silently
        # break cross-origin auth).
        run: |
          body=$(curl --fail --silent --show-error --max-time 10 \
            https://staging.wifihaven.net/)
          echo "$body" | head -c 500
          # The Vite-built index.html references the hashed JS bundle.
          # Pull it and grep for the staging API origin.
          js_path=$(echo "$body" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          [[ -n "$js_path" ]] || { echo "could not find JS bundle path" >&2; exit 1; }
          curl --fail --silent --show-error --max-time 10 \
            "https://staging.wifihaven.net${js_path}" \
            | grep -q 'api-staging.wifihaven.net' \
            || { echo "staging bundle missing api-staging.wifihaven.net" >&2; exit 1; }

      - name: Authenticated route reaches the database
        # Hits a route that exercises a DB read. /api/health already checks
        # connectivity, but a 401 from an auth-gated route confirms the
        # request actually reached the app router (not a Render edge cache
        # or maintenance page).
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 10 "${STAGING_API_URL}/api/devices")
          echo "status=$status"
          # 401 (unauth) or 200 (if endpoint is public) are both fine; 5xx
          # or 404 indicates the deploy is broken.
          [[ "$status" == "401" || "$status" == "200" || "$status" == "403" ]]

  # ── 5b. Gate 1 — API contract smoke against staging (#653) ──────────────
  # Re-runs the same admin + router-API e2e scripts that already gate
  # build-image (scripts/e2e-tests.sh + scripts/e2e-router.sh) — but against
  # the freshly-deployed staging Render service instead of the in-CI
  # docker-compose stack. Same semantic coverage (timeLimit → blockReason,
  # pause → Paused, schedule → Schedule, HostId variants, etag round-trip,
  # legacy `hostname` rejection) plus 401 / 4xx negatives per endpoint.
  # Blocks API publish (retag-latest, deploy-prod-render) and the SPA prod
  # deploy by sitting on `approve-production`'s `needs:`.
  api-smoke-staging:
    name: Gate 1 — API contract smoke (staging)
    if: github.ref == 'refs/heads/main'
    # Runs in parallel with smoke-staging — both `needs: [deploy-staging]`,
    # both feed approve-production. smoke-staging covers the SPA bundle +
    # CORS plane; this job covers the admin + router API plane. Either
    # going red still blocks prod via approve-production's `needs:`.
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Admin API smoke against staging
        env:
          E2E_BASE_URL: ${{ env.STAGING_API_URL }}
          ADMIN_PASS: ${{ secrets.WH_STAGING_ADMIN_PASS }}
          RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/e2e-tests.sh
      - name: Router API smoke against staging
        env:
          E2E_BASE_URL: ${{ env.STAGING_API_URL }}
          # Post-#613 the SPA is on Cloudflare Pages, not the API host —
          # so the `/blocked` SPA-route check has to hit the SPA host.
          E2E_SPA_URL: https://staging.wifihaven.net
          ADMIN_PASS: ${{ secrets.WH_STAGING_ADMIN_PASS }}
          RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/e2e-router.sh

  # ════════════════════════════════════════════════════════════════════════
  # ── DEPLOY-PRODUCTION ── (manual-approval gate + parallel jobs) ─────────
  # ════════════════════════════════════════════════════════════════════════
  # An `approve-production` sentinel job carries `environment: production` so
  # GitHub pauses the run for manual approval before any consumer-facing
  # surface is touched. All three deploy-production jobs `needs:
  # [approve-production]`, so a single approval gates them atomically;
  # denial blocks every one of them.
  #
  # The router pipeline (master-router.yml) has its own approve-production
  # job pointing at the same `production` environment, so GitHub serializes
  # approval prompts across the two pipelines when shared/** changes fire
  # both sides.

  # ── 5c. Gate 3b — last-published router vs freshly-deployed staging ────
  # Boots the *last published* qemu OpenWRT router image (from the
  # openwrt-latest GitHub Release, per #893) against the staging API this
  # PR just deployed. Catches API/UI changes that break forward
  # compatibility with routers customers are actually running — a class
  # of regression Gate 1's current-contract goldens cannot see.
  gate-3b-api-staging:
    name: Gate 3b — last-published router + staging API
    if: github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-vm-gate3b.yml
    secrets: inherit

  approve-production:
    name: Manual approval (production gate)
    if: github.ref == 'refs/heads/main'
    needs: [smoke-staging, api-smoke-staging, gate-3b-api-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.wifihaven.net
    steps:
      - name: Approved
        run: echo "Production deploy approved — releasing API image + SPA."

  # 6a. Retag sha-<commit> → :latest. No rebuild — `imagetools create`
  # operates on the registry-side manifest. The sha image has already been
  # gated by ci + staging smoke, so this is a pure pointer move.
  # Chose `docker buildx imagetools create` over `regctl` to avoid pulling
  # in another tool; buildx is already set up on github-hosted runners.
  retag-latest:
    name: Promote sha → :latest (deploy-production)
    if: github.ref == 'refs/heads/main'
    needs: [approve-production]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag sha-<short> to :latest
        run: |
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          src="${REGISTRY}/${IMAGE_NAME}:sha-${short_sha}"
          dst="${REGISTRY}/${IMAGE_NAME}:latest"
          echo "Promoting $src → $dst"
          docker buildx imagetools create -t "$dst" "$src"

  # 6b. Cut the v<X.Y.Z> annotated git tag (#499). Idempotent: skipped if
  # the tag already exists (e.g. an earlier OpenWRT-only release on the same
  # SHA already cut it). The OpenWRT publish path (publish-openwrt-release.yml)
  # also creates this tag on the v<X.Y.Z> release; whichever pipeline finishes
  # first wins, the other no-ops.
  cut-release-tag:
    name: Cut v<X.Y.Z> release tag (#499)
    if: github.ref == 'refs/heads/main'
    needs: [approve-production, retag-latest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Need a token with push perms; GITHUB_TOKEN at `contents: write`
          # is enough for ref creation.
          persist-credentials: true

      - name: Derive version
        id: ver
        run: |
          set -eu
          version=$(./scripts/ci/derive-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push annotated tag (idempotent)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          tag="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "Tag ${tag} already exists on origin — skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "WifiHaven ${tag}"
          git push origin "${tag}"

  # 6c. Trigger the Render prod deploy hook + wait for healthy. Prod tracks
  # the `:latest` tag, so this must run after retag-latest has moved the
  # pointer — or Render will deploy whatever was on `:latest` before. We
  # depend on retag-latest to enforce ordering.
  deploy-prod-render:
    name: Deploy production (Render)
    if: github.ref == 'refs/heads/main'
    needs: [approve-production, retag-latest]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render prod deploy hook
        env:
          RENDER_DEPLOY_HOOK_PROD: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$RENDER_DEPLOY_HOOK_PROD" >/dev/null
          echo "Production deploy hook accepted."

      - name: Wait for production to be healthy
        run: |
          deadline=$(( $(date +%s) + 480 ))
          while (( $(date +%s) < deadline )); do
            if curl --fail --silent --max-time 10 \
                 "${PROD_API_URL}/api/health" | grep -q '"db":\s*"ok"'; then
              echo "Production is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for production /api/health." >&2
          exit 1

  # 6d. Deploy SPA to Cloudflare Pages (prod). Independent of the API
  # promotion (Render and Cloudflare are separate planes), gated only on
  # smoke-staging. Cross-origin SPA↔API skew between this job and
  # deploy-prod-render is bounded to the duration of either job.
  deploy-spa-prod:
    name: Deploy SPA to Cloudflare Pages (prod) (deploy-production)
    if: github.ref == 'refs/heads/main'
    needs: [approve-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Build SPA (prod)
        working-directory: web
        env:
          VITE_API_BASE_URL: https://api.wifihaven.net
        run: npm run build

      - name: Deploy to Cloudflare Pages (prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler 4 rejects `--config` for `pages deploy` (#672); the
          # default `wrangler.toml` in web/ already targets the prod project.
          wranglerVersion: '4'
          workingDirectory: web
          # See staging step for why --commit-message is forced ASCII.
          command: pages deploy --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.sha }}"
