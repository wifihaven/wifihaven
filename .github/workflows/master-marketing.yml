name: Master Marketing CD

# Deploys the static marketing site (web-marketing/) to the Cloudflare Pages
# project `wifihaven-www`, which fronts the apex (wifihaven.net) + www.
#
# Split out as its own pipeline (mirrors master-cloudflare.yml / master-grafana.yml):
# the marketing site has nothing to do with the API/SPA release cadence, so it
# only fires when web-marketing/** or this workflow changes, and never blocks —
# or is blocked by — an API/SPA release.
#
# There is NO build step: web-marketing/site/ is plain static HTML/CSS and is
# uploaded as-is. The Pages project, its custom domains, the apex/www DNS, and
# the redirect rules (incl. the /blocked router-compat shim) live in
# infra/cloudflare and are applied by master-cloudflare.yml. On the very first
# rollout that Terraform apply must land first (the project must exist for
# wrangler to target); subsequent deploys are independent.

on:
  push:
    branches: [main]
    paths:
      - 'web-marketing/**'
      - '.github/workflows/master-marketing.yml'
  workflow_dispatch:

# Queue (don't cancel) so a deploy in flight isn't killed mid-upload.
concurrency:
  group: master-marketing-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-marketing:
    name: Deploy marketing site to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # #2233: the press page carries the launch release, and the release has operator-input slots
      # spelled `[LIKE_THIS]` in the authored copy. Merging this site is what publishes it, so an
      # unfilled slot would go live on wifihaven.net the moment the PR lands. Fail the deploy
      # instead — the placeholder is a "not ready yet" marker and it should behave like one, rather
      # than reaching readers as literal brackets (the #2677 lesson, one layer up).
      #
      # The pattern matches the OPENING `[ABC` only, never the closing bracket. An earlier version
      # required `[...]` intact and passed for free, because the HTML formatter had wrapped the one
      # real placeholder across two lines and the closing bracket was on the next one. Underscores,
      # not spaces, inside the placeholder for the same reason: a token a formatter can split is a
      # token this guard can miss.
      - name: Guard — no unfilled [PLACEHOLDER] slots in the published site
        run: |
          set -euo pipefail
          if grep -rnE '\[[A-Z][A-Z0-9_]+' web-marketing/site; then
            echo "::error::Unfilled placeholder(s) above. Fill them (or remove the copy) before this deploys."
            exit 1
          fi
          echo "no unfilled placeholders"

      - name: Deploy to Cloudflare Pages (wifihaven-www)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler 4 rejects `--config` for `pages deploy` (#672); the default
          # wrangler.toml in web-marketing/ already targets the wifihaven-www
          # project and points pages_build_output_dir at ./site.
          wranglerVersion: '4'
          workingDirectory: web-marketing
          command: pages deploy --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.sha }}"
