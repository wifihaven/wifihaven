name: VM e2e

# Full VM-based e2e: boots the OpenWRT router VM + Alpine client VM and runs
# the scenarios under scripts/e2e/scenarios/ against a disposable docker
# compose API stack. Runs on the self-hosted KVM runner (#149).
#
# Triggers — VM e2e is currently a stabilization workstream and is not gating
# publish; see docs/ops/kvm-runner.md → "Trust model":
#
#   1. pull_request targeting the `ci/vm-e2e` branch — that branch is the
#      iteration baseline. Merging fixes into it via PR exercises the suite.
#      The fork-safety guard on the job restricts execution to PRs from
#      branches in this repository — fork PRs do not run on the self-hosted
#      runner (public repo + private hardware).
#   2. workflow_dispatch — manual runs from the Actions tab against any ref.
#   3. workflow_call — kept for future use; not currently invoked from any
#      other workflow.
#
# Notably NOT triggered on push:main and NOT a `needs:` of Master CD's
# publish-api job. Image publish is ungated from the VM e2e while we
# stabilize the suite.

on:
  pull_request:
    branches: [ci/vm-e2e]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: e2e-vm
  cancel-in-progress: false

jobs:
  e2e:
    name: VM e2e suite
    # Block fork PRs on the self-hosted runner. Same-repo PRs and manual
    # dispatch / workflow_call invocations are always allowed.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, kvm]
    # Observed durations: 30m was cut off mid-test_pause; 60m got past
    # test_pause but was killed mid-test_time_limit, which sleeps 330s
    # waiting for the agent's usage-report flush. The full suite needs
    # ~80–100m wall clock. 120m gives one slow scenario's worth of slack
    # without masking real regressions; concurrency=e2e-vm keeps the
    # queue serialized so a slow run doesn't pile up.
    timeout-minutes: 120

    steps:
      # Self-hosted runner: a prior run of scripts/vm/build-router-image.sh
      # left root-owned files under scripts/vm/.cache/imagebuilder/ (older
      # versions of the script only chowned bin/ and build_dir/ — see the
      # broadened trap in this same change). actions/checkout@v6 cleans the
      # workspace and fails with EACCES on those files. The runner has no
      # NOPASSWD sudo (only /usr/sbin/ip per docs/ops/kvm-runner.md), so we
      # use docker — which runs as root — to chown the cache back to the
      # runner user before checkout. No-op on clean runners.
      - name: Reclaim root-owned cache files (pre-checkout)
        run: |
          # Belt+braces for #487/#490: previously-cancelled CI runs can leave
          # the imagebuilder container running, which keeps writing root-owned
          # files into the cache after the reclaim sweep finished. Force-remove
          # by name before reclaiming.
          docker rm -f wh-imagebuilder 2>/dev/null || true
          CACHE="${{ github.workspace }}/scripts/vm/.cache"
          if [ -d "$CACHE" ]; then
            docker run --rm -v "$CACHE":/c alpine sh -c '
              chmod -R u+rwX,a+rX /c 2>/dev/null
              chown -R '"$(id -u):$(id -g)"' /c 2>/dev/null
            ' || true
          fi

      - uses: actions/checkout@v6

      - name: Preflight (kvm/qemu/docker)
        run: |
          test -e /dev/kvm && test -r /dev/kvm && test -w /dev/kvm \
            || { echo "/dev/kvm missing or not r/w"; ls -l /dev/kvm || true; exit 1; }
          qemu-system-x86_64 --version | head -n1
          docker --version

      - name: Build router image (if not cached)
        run: |
          if [[ -f scripts/vm/.cache/openwrt-wifihaven.img ]]; then
            echo "router image cached, skipping build"
          else
            scripts/vm/build-router-image.sh
          fi

      - name: Build client base (if not cached)
        run: scripts/vm/build-client-base.sh

      # The self-hosted KVM runner keeps docker images across jobs (see
      # docs/ops/kvm-runner.md). scripts/e2e/lib/stack.py defaults to
      # rebuild=False, so `docker compose up` reuses any cached
      # wifihaven-e2e-vm-api image — which can be months stale relative to
      # current source. Force a fresh build here so CI always tests HEAD.
      # `--pull` refreshes base layers; only `api` is built locally
      # (postgres and fake-router use upstream images). Local dev keeps the
      # fast no-rebuild path. Fixes #465.
      - name: Build API image (force fresh layer)
        run: |
          docker compose -f docker/docker-compose.yml -p wifihaven-e2e-vm \
            build --pull api

      - name: Pre-flight kill of stale wh VMs
        run: |
          scripts/vm/router-down.sh || true
          scripts/vm/client-down.sh || true

      - name: Run e2e suite
        env:
          WH_ROUTER_IMAGE_PATH: ${{ github.workspace }}/scripts/vm/.cache/openwrt-wifihaven.img
          # #473: pytest's stack fixture defaults to tearing the docker
          # compose stack down at session end, which removes containers
          # before the failure-capture step below can read their logs.
          # Keep the stack up here; the explicit "Tear down API stack" step
          # at the bottom of this job (if: always()) handles cleanup after
          # logs are captured.
          E2E_VM_KEEP_STACK: "1"
        run: scripts/e2e-vm.sh

      - name: Capture docker compose logs
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml -p wifihaven-e2e-vm \
            logs --no-color > /tmp/api-logs.txt 2>&1 || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-vm-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scripts/vm/.run/**
            /tmp/api-logs.txt
            !scripts/vm/.run/**/*.qcow2
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down VMs
        if: always()
        run: |
          scripts/vm/router-down.sh || true
          scripts/vm/client-down.sh || true

      - name: Tear down API stack
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml -p wifihaven-e2e-vm \
            down -v --remove-orphans || true
