# WifiHaven press-outreach send manifest (#2233).
#
# Machine-readable companion to docs/marketing/media-list.md — that doc is the
# narrative source of truth (why each outlet, the "Why" evidence, the workflow);
# THIS file is what the send path (PressOutreach) actually iterates. Keep the two
# in sync when the list changes.
#
# Fabrication rule (inherited from media-list.md): `email` is present ONLY where a
# journalist address is actually published and verified. Nothing here is invented.
# As of the 2026-07-12 research pass NO target has a publishable direct email — every
# Priority 1–3 outlet routes through a contact FORM or tip-line (`contactUrl`), so a
# real send today emails nobody and the dry-run reports them all as "manual submission".
# The operator supplies verified addresses at send time via the request's
# `emailOverrides` map (contactId -> address) — no redeploy, no fabricated address in-repo.
#
# Community channels (Show HN, r/selfhosted, r/openwrt, lobste.rs, …) are NOT here:
# they are posted directly, not emailed. See media-list.md "Community channels".
#
# Fields per contact:
#   id         stable key (idempotency + emailOverrides key). Never reused/renumbered.
#   outlet     publication / channel name.
#   person     the specific journalist/host (media-list.md "Person").
#   priority   1 | 2 | 3 (send-order tier from media-list.md).
#   angle      the personalized pitch angle (media-list.md "Pitch angle").
#   contactUrl the published form/tip-line/route to reach them (media-list.md "Contact").
#   email      verified direct address, or omitted. OMITTED for all today (see above).

