    contactUrl: "https://www.xda-developers.com/author/adamconway-xda/"
    pitch: >-
      Your July piece on the four reasons people self-host lines up with what we've just
      shipped: WifiHaven is an open-source parental-control system that replaces a
      per-device subscription with something running on your own OpenWrt router. There's
      no app on the kid's phone to delete and no per-device fee, and the self-hosted
      version is free permanently. Technically it's a departure from the Pi-hole-shaped
      thing readers expect — blocking is an nftables drop at the gateway, not a DNS
      answer, so encrypted DNS doesn't route around it. If a hands-on would suit XDA we
      can get you set up on a Flint 2.

