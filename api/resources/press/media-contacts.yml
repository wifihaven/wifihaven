# WifiHaven press-outreach send manifest (#2233).
#
# Machine-readable companion to docs/marketing/media-list.md — that doc is the
# narrative source of truth (why each outlet, the "Why" evidence, the workflow);
# THIS file is what the send path (PressOutreach) actually iterates. Keep the two
# in sync when the list changes.
#
# Fabrication rule (inherited from media-list.md): `email` is present ONLY where a
# journalist address is actually published and verified. Nothing here is invented.
# As of the 2026-08-15 re-verification pass NO target has a publishable direct email — every
# Priority 1–3 outlet routes through a contact FORM or tip-line (`contactUrl`), so a
# real send today emails nobody and the dry-run reports them all as "manual submission".
# The operator supplies verified addresses at send time via the request's
# `emailOverrides` map (contactId -> address) — no redeploy, no fabricated address in-repo.
#
# Community channels (Show HN, r/selfhosted, r/openwrt, lobste.rs, …) are NOT here:
# they are posted directly, not emailed. See media-list.md "Community channels".
#
# Fields per contact:
#   id         stable key (idempotency + emailOverrides key). Never reused/renumbered.
#   outlet     publication / channel name.
#   person     the specific journalist/host (media-list.md "Person").
#   priority   1 | 2 | 3 (send-order tier from media-list.md).
#   angle      the one-line pitch angle (media-list.md "Pitch angle"). Editorial metadata —
#              it is what a human reads when submitting via a contact FORM. It is NOT the
#              email body.
#   pitch      REQUIRED. The authored body of this outlet's email, written for this outlet
#              and no other. The composer adds the greeting and the sign-off around it and
#              has no generic fallback — a contact without a pitch fails to load
#              (PressOutreachSpec), because a template with the outlet name interpolated
#              into it is what a blast looks like from the receiving end.
#   contactUrl the published form/tip-line/route to reach them (media-list.md "Contact").
#   email      verified direct address, or omitted. OMITTED for all today (see above).
#
# Copy note: the pitches went through an independent slop-review pass on 2026-08-15 and are
# written in the first person PLURAL (operator decision — the sender speaks for a team).

contacts:
  # ── Priority 1 — Core audience (self-hosting / OpenWRT / homelab) ──────────
  - id: selfhst
    outlet: "selfh.st / Self-Host Weekly"
    person: "Ethan Sholly"
    priority: 1
    angle: "New open-source self-hosted parental controls enforced at the router, not DNS — exactly his weekly-roundup beat."
    contactUrl: "https://selfh.st/about/"
    pitch: >-
      We've just opened the beta of WifiHaven, an open-source parental-control and
      screen-time system that runs on the household's OpenWrt router instead of on the
      kids' phones. It's the whole stack under an open licence and free to self-host
      permanently; the hosted tier is the optional convenience half. The part your
      readers will care about is that it isn't a DNS filter: enforcement is an nftables
      drop on the gateway, so DNS resolves as normal and the connection just doesn't go
      anywhere. If it fits Self-Host Weekly we'd be glad to send whatever detail helps,
      and we'll submit it to the apps directory separately.

  - id: hackaday
    outlet: "Hackaday"
    person: "Maya Posch"
    priority: 1
    angle: "The nftables forward-drop + dnsmasq ipset attribution mechanism as a hack story, not a product pitch."
    contactUrl: "https://hackaday.com/submit-a-tip/"
    pitch: >-
      Your June piece on building your own router in 2026 is roughly the audience we
      built this for, so we wanted to send you the mechanism rather than the product.
      WifiHaven does parental controls on OpenWrt by dropping forwarded packets in
      nftables, and it attributes destination IPs back to hostnames using dnsmasq's
      nftset callback: each (MAC, hostname) pair gets its own set, populated at resolve
      time, and the forward chain matches on membership. That means DNS is never the
      enforcement point, which is what makes it survive DoH and hard-coded IPs — a
      destination the router can't attribute to a resolved hostname can be dropped
      outright. Happy to walk through the set layout, or the tmpfs discipline the agent
      needs to live on a router with 128MB of RAM.

