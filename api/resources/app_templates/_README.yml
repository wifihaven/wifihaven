# app_templates — starter library for the apps feature (#768).
#
# Each YAML file in this directory defines one app template. Templates are
# seeded into the `apps` table at API startup (find-or-create by template_id).
# Operator host edits win — if an `app_hosts` row already exists for the seeded
# app, the seeder leaves the host list ALONE. The SPA's "reset to template"
# action restores the host list via POST /api/apps/:id/reset-to-template.
#
# Schema (required fields are marked):
#
#   slug:      required, kebab-case [a-z0-9][a-z0-9-]{0,63}. Used as the app's
#              `template_id` and as the initial `slug` of the seeded apps row.
#              Must be unique across the directory; the file name (without
#              `.yml`) must match the slug for clarity.
#   name:      required, human-readable display name (e.g. "YouTube").
#   icon:      optional. Opaque TEXT — interpreted according to `icon_type`.
#              Drop this field if the app has no icon yet.
#   icon_type: optional, defaults to `emoji`. One of:
#                emoji      — `icon` is a single emoji character or short
#                             grapheme cluster the SPA renders inline.
#                url        — `icon` is an absolute URL (http(s)://...) the
#                             SPA loads as an <img>.
#                png_base64 — `icon` is a base64-encoded PNG (no data: prefix);
#                             the SPA renders it inline as a data URI.
#   hosts:     required, list of apex hostnames (e.g. "youtube.com"). Don't
#              include wildcards — the router matches subdomains inherently.
#              Be conservative: prefer the few FQDNs each service truly needs;
#              we iterate over time.
#
#              List the app's full host-set, including off-domain asset/CDN
#              domains (e.g. youtube.com + ytimg.com + googlevideo.com). For a
#              time-limited app the host-set is ONE aggregated budget (#1505):
#              traffic to any host counts toward the app's single per-site limit
#              and is exempt from the daily cap together — not a separate budget
#              per host. Prefer the service's STABLE branded asset domains;
#              avoid pinning rotating shared-CDN artifacts (*.akamai.net,
#              *.fastly.net, *.cloudfront.net) here — they rot. These are the
#              app's own dependency domains and are distinct from the
#              device-level infra-allow list (#1337/#1411).
#
# ──────────────────────────────────────────────────────────────────────────
# SHARED-POOL COLLATERAL — don't block a host you don't own the IPs of
# ──────────────────────────────────────────────────────────────────────────
#
# Enforcement is IP-layer, not DNS (see AGENTS.md / docs/architecture.md §0.2).
# A blocked host's *resolved IPs* go into a per-(MAC, host) `eb_<host>` nftables
# drop set; the kernel then drops every flow to those dst_ips. So a host whose
# IPs are SHARED with traffic we never meant to block drags that other traffic
# into the drop. This was the root cause of #1636 (kids' iPads couldn't sign
# into Google Drive when YouTube was blocked): `youtubei.googleapis.com`
# resolves to the same Google GFE anycast pool as Drive/OAuth/Calendar, so the
# YouTube `eb_` rule dropped every Google product API on that pool.
#
# THE RULE: Don't put a shared vendor-API / multi-tenant-CDN host into a block
# host-set when a DEDICATED-BYTES host already carries the meaningful block.
# Prefer the app's dedicated-bytes host — `googlevideo.com` for YouTube,
# `nflxvideo.net` for Netflix — that's where the attention-heavy traffic lives
# and it carries no collateral. `imessage.yml` is the worked example of a
# collateral-aware host-set: it deliberately EXCLUDES the shared APNs push
# channel and targets only the iMessage-specific `ess.apple.com` edge; read
# its inline comments before authoring a new host-set on shared infra.
#
# Two classes of shared-pool host (from the #1648 audit):
#
#   Class 1 — vendor-API anycast pools (Google GFE `*.googleapis.com`, and any
#     host that fronts a whole vendor's product APIs on one IP pool). Collision
#     is NEAR-CERTAIN. STRIP THESE — they never carry app-specific bytes worth
#     blocking; the dedicated-bytes host already does. Audit found exactly one
#     across all 15 templates: `youtubei.googleapis.com` in youtube.yml,
#     being removed in Phase 0 (#1660).
#
#   Class 2 — third-party cloud-CDN edge (branded per-app asset domains that
#     happen to sit behind a multi-tenant CDN): `discordapp.net` (Cloudflare),
#     `rbxcdn.com`, `tiktokcdn.com`, `sc-cdn.net`, `jtvnw.net` / `ttvnw.net`,
#     `kastatic.org`, and similar across the set. These are LATENT risk only —
#     they ARE where the app's own bytes live, so stripping them defeats the
#     block. DO NOT mass-strip Class 2. They are a watch-list for the deferred
#     Phase 3 evidence loop (#1663): only remove one if real traffic evidence
#     shows it actually shares IPs with collateral we care about.
#
# When in doubt: block the dedicated-bytes host, leave the shared edge alone,
# and file against #1663 rather than editing blind.
#
# ──────────────────────────────────────────────────────────────────────────
# SHARED HOSTS FOR ATTRIBUTION — `shared_hosts:` (#1888 / #1896)
# ──────────────────────────────────────────────────────────────────────────
#
# The collateral rule above is about NOT BLOCKING a host whose IPs you don't
# own. `shared_hosts:` is its ATTRIBUTION sibling — the same multi-tenant
# vendor backends are also dangerous to CREDIT, because a host listed on many
# apps would otherwise mis-attribute its time to whichever app won the
# minBy(appId) tiebreak. The two rules reinforce each other: a host that's
# shared for attribution is exactly the kind of host that's dangerous to block.
#
#   hosts:         DISTINCTIVE — traffic here, on its own, is strong evidence
#                  THIS app is in use (`app.feelinggreat.com`, `youtube.com`).
#                  Keep their current unconditional attribution.
#   shared_hosts:  SHARED — multi-tenant vendor APIs/backends several unrelated
#                  apps legitimately depend on (`elevenlabs.io`, `launchdarkly.com`,
#                  generic auth/CDN edges). Traffic here, in isolation, tells you
#                  nothing about which app is running.
#
# `shared_hosts:` is OPTIONAL and defaults to empty — every existing template is
# unchanged. It is enforced by the directory-wide validation test (S1b, #1896):
#
#   1. Every app MUST have at least one distinctive host (`hosts:` non-empty).
#      An all-shared template could never be "demonstrably in use" and would
#      receive zero attribution forever — almost certainly an authoring error.
#   2. GLOBAL CONSISTENCY: a host marked `shared` on ANY template must be
#      `shared` on EVERY template that lists it. Listing it under plain `hosts:`
#      somewhere else re-introduces the unconditional mis-credit the flag exists
#      to prevent. (The flag is stored per-(app, host), but distinctiveness is an
#      emergent property of a host across the whole catalog.)
#
# A shared host is credited to an app ONLY while that app's distinctive hosts
# have a live session on the same device (the co-presence rule). NOTE: as of
# S1b the flag is STORED AND IGNORED — attribution behavior is unchanged until
# S2-S5 land. See `docs/design/shared-host-allocation.md` (#1888) for the full
# allocation rule.
#
# File names beginning with `_` are reserved for documentation (this file) and
# the manifest (`_index.yml`) and are ignored by the template loader.

slug: example
name: Example App
icon: "🧩"
icon_type: emoji
hosts:                  # distinctive — uniquely identify this app's use
  - example.com
  - cdn.example.com
# shared_hosts:         # optional — multi-tenant backends; credited only while a
#   - elevenlabs.io     #   distinctive host above is active (#1888). Stored but
#   - launchdarkly.com  #   ignored until S2-S5.
