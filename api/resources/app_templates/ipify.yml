slug: ipify
name: ipify
icon: "https://icons.duckduckgo.com/ip3/ipify.org.ico"
icon_type: url
# Display-cleanup app (#2811), sibling of icanhazip (#2805): ipify is
# a public-IP lookup API that apps and scripts call in the background, not
# something a kid "uses". api.ipify.org (~173 proportional min) and
# api64.ipify.org (~8) showed up as orphans on the Kids and Chromebook profiles.
#
# Scoped to the two API hosts rather than the `ipify.org` apex on purpose:
# www.ipify.org CNAMEs to a CloudFront distribution on the 99.84.118.x pool that
# arduino.yml already flags as shared, and no www traffic was observed.
# api.ipify.org is Cloudflare-fronted (104.26.12-13.205, 172.67.74.152), the
# ordinary accepted Class 2 case; api64.ipify.org is on 173.231.16.77 /
# 104.237.62.213. Whether the Cloudflare addresses are shared with unrelated
# tenants was NOT verified, so treat this as attribution/visibility, not blocking.
hosts:
  - api.ipify.org
  - api64.ipify.org
