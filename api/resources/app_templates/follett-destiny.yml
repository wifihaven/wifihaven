slug: follett-destiny
name: Follett Destiny
icon: "https://icons.duckduckgo.com/ip3/follettsoftware.com.ico"
icon_type: url
# #3010 (2026-11-16 weekly pass): Follett Destiny — the school library
# catalog/circulation system (Follett Software Company). 6.1 MB / 15 hits
# combined over a 30d window on one kid device, across `portalapi`/
# `prd-appcdn`/`search`/`security`/`titlepeek2.follettsoftware.com` (the
# catalog UI's backend/search/cover-art hosts) and
# `flagstafflmc.follettdestiny.com` + `portal.follettdestiny.com` (the
# district's own hosted Destiny instance — `flagstafflmc` is Flagstaff
# Academy's library-media-center tenant).
#
# `dig`ged EACH observed subdomain individually (not inferred from the bare
# apex, which is NOT in this host-set — caught by independent review, see
# the skill's #3010 learning): `portalapi.`/`titlepeek2.follettsoftware.com`
# resolve to Azure Public IPs on `*.cloudapp.azure.com`
# (`puse2ilbase01-pip.eastus2...`, 52.177.91.164) — a dedicated-per-resource
# Azure primitive, Follett's own backend, not a shared PaaS edge. The other
# four resolve to GENERIC multi-tenant platforms used by countless unrelated
# companies: `prd-appcdn.`/`search.`/`security.follettsoftware.com` are Azure
# Front Door (`*.azurefd.net`); `portal.follettdestiny.com` is Azure Static
# Web Apps (`*.azurestaticapps.net`), the same class of risk as the
# CloudFront `/24` pool and `shops.myshopify.com` — enforcement drops by raw
# destination IP, so an unrelated site sharing that edge IP would be swept
# into the same drop/allow set. `flagstafflmc.follettdestiny.com` also
# stayed out of `hosts:` out of caution: it names this household's own
# district tenant, but the underlying Destiny instance
# (`destinypublic3.eastus2.cloudapp.azure.com`) may be shared across several
# of Follett's OWN district customers, and that couldn't be independently
# ruled out as also touching the generic-platform risk above.
#
# Same pattern as `onenote.yml`'s Office-Online-pool writeup: the
# shared-platform hosts go in `shared_hosts` (credited for attribution while
# a distinctive host above is active, never entering a drop/allow set), so
# the block/allow half is narrowed to the two confirmed-dedicated hosts while
# visibility still covers the whole surface.
#
# Bare `follettsoftware.com`/`follettdestiny.com` apexes are deliberately
# EXCLUDED — not observed in traffic, and the latter is the shared
# multi-tenant platform (other districts' subdomains) that a bare-apex entry
# would sweep in wholesale.
hosts:
  - portalapi.follettsoftware.com
  - titlepeek2.follettsoftware.com
shared_hosts:
  - prd-appcdn.follettsoftware.com
  - search.follettsoftware.com
  - security.follettsoftware.com
  - flagstafflmc.follettdestiny.com
  - portal.follettdestiny.com
