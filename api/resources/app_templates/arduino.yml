slug: arduino
name: Arduino
icon: "https://icons.duckduckgo.com/ip3/arduino.cc.ico"
icon_type: url
# Operator request: Arduino — the maker/electronics platform. The kid-facing
# surface is the Cloud Editor / Arduino Cloud plus the docs, Project Hub and
# IDE downloads.
#
# Host-set is the Arduino-operated SUBDOMAINS, NOT the `arduino.cc` apex — a
# deliberate deviation from the "apex hostnames" default in _README.yml, same
# pattern as `lego.yml`. Enforcement is IP-layer, so an apex entry would pull
# every subdomain's resolved IP into the `eb_` drop set, including five hosts
# across four third-party MULTI-TENANT platforms (each `dig`-verified):
#   store.arduino.cc, store-usa.arduino.cc  shops.myshopify.com → 23.227.38.74
#   forum.arduino.cc     arduino.hosted-by-discourse.com → 184.104.178.51
#   blog.arduino.cc      wp.wpenginepowered.com → 141.193.213.10/.11
#   support.arduino.cc   arduino.zendesk.com → 216.198.53.11/.54.11
# Blocking Arduino must not drop every Shopify store, Discourse community, WP
# Engine site or Zendesk help center on the device, and none of those five
# carries Arduino's own engagement bytes. The store is also a parent purchasing
# surface rather than something a kid engages with, which is the same call the
# #2740 pass made on Scholastic.
#
# Bare `arduino.cc` is omitted deliberately, and there is no way to keep it and
# still spare those five: render.lua emits `nftset=/<host>/` verbatim per host
# and dnsmasq matches by pure suffix, so an apex entry necessarily captures
# every child. It would also drag AWS CloudFront's shared 99.84.118.x pool
# (what the bare apex resolves to) into the drop set. Two residuals to record
# so a later author doesn't "fix" this by adding the apex back:
#   1. Over plain HTTP the apex redirects twice — http://arduino.cc → 301 →
#      https://arduino.cc → 301 → https://www.arduino.cc. Every one of those
#      hops completes, because the apex's IPs are in no `eb_` set, and the drop
#      lands only on the follow-on `www` request. The port-80 DNAT block page
#      won't render for the apex either, so the user sees the redirects and then
#      a failed TLS handshake, not the block page.
#   2. Bytes to bare `arduino.cc` go unattributed against the app's budget:
#      HostMatch.matchesApex matches it against none of the hosts below.
#
# The kept hosts sit behind Cloudflare/CloudFront edges, which is the accepted
# Class-2 latent risk from _README.yml (branded per-app domains on a
# multi-tenant CDN — that IS where the app's bytes live, so stripping them
# would defeat the block). They are not all equally exposed, and if the #1663
# evidence loop ever revisits this set, `projects.arduinocontent.cc` is the
# member to look at first. Of the ORIGINAL ten `*.arduino.cc` hosts, eight land
# on Arduino's own Cloudflare pair (104.18.12.135/104.18.13.135), `downloads` on
# 104.18.10.21/104.18.11.21 and `api2` on CloudFront 18.238.176.x — whereas that
# one lands on Cloudflare's broadly-shared 104.21.x / 172.67.x pool. The three
# #2754 additions land on three MORE distinct pools — `login` on Cloudflare
# 172.64.150.238/104.18.37.18, `projecthub-api` on a dedicated AWS ELB, and
# `builder` on the same CloudFront 18.238.176.x range as `api2` — see the #2754
# note below for each.
#
# Kept host-set, and what each surface is:
#   www.arduino.cc                main site
#   cloud.arduino.cc              Arduino Cloud
#   app.arduino.cc                Arduino Cloud web app / editor
#   create.arduino.cc             legacy Web Editor (Arduino Create)
#   api2.arduino.cc               Arduino Cloud API backend
#   docs.arduino.cc               documentation / language reference
#   projecthub.arduino.cc         Project Hub
#   content.arduino.cc            site content/assets
#   cdn.arduino.cc                static asset CDN
#   downloads.arduino.cc          IDE, cores and library downloads
#   projects.arduinocontent.cc    Project Hub content, on a separate domain
#   login.arduino.cc              sign-in (Arduino's own Auth0 tenant, #2754)
#   projecthub-api.arduino.cc     Project Hub API backend (#2754)
#   builder.arduino.cc            Arduino Cloud API surface (#2754)
#
# #2754: three hosts added after the first traffic pass past this template's
# merge (#2753) showed real hits against them:
#
#   login.arduino.cc — CNAMEs to `arduino-prod-cd-*.edge.tenants.auth0.com`,
#     Arduino's own dedicated Auth0 tenant, proxied through the same class of
#     Cloudflare edge as the rest of this set (172.64.150.238/104.18.37.18) —
#     no new risk class. It's not optional: `curl`-ing app.arduino.cc,
#     create.arduino.cc and cloud.arduino.cc's own HTML each link directly to
#     `login.arduino.cc` for sign-in, so without it a kid can load the Cloud
#     Editor shell but can never authenticate into it. This was a functional
#     gap in the template as merged, not a new-traffic addition.
#
#   projecthub-api.arduino.cc — CNAMEs to
#     `prd-arduino-prjhub-be-*.us-east-1.elb.amazonaws.com`, a dedicated
#     Arduino-named ELB (not a shared ALB pool) — the API backend for the
#     already-kept `projecthub.arduino.cc` frontend.
#
#   builder.arduino.cc — `dig`-verified to resolve to the IDENTICAL four edge
#     IPs as `api2.arduino.cc` (18.238.176.{7,46,72,103}), same `awselb`
#     origin + CloudFront error signature on `curl -I`. Matching A records
#     only prove the same CloudFront *edge* (edge IPs are shared across many
#     distributions within a PoP), not necessarily the same distribution —
#     but that's all the collateral argument needs: no IP outside this app's
#     already-accepted set enters the `eb_` drop set by adding this host.
#     Purpose unconfirmed beyond that (no public docs describe it), kept on
#     that zero-incremental-IP-exposure basis plus observed real traffic.
#
# Considered and left OUT as analytics/tracking collateral, not app surface:
#   sgtm.arduino.cc              server-side Google Tag Manager (Google
#                                 Frontend, isolated IP 34.110.195.2) — a
#                                 tracking relay, same call as excluding
#                                 `ct.canva.com` in `canva.yml`.
#   api.aayinltcs.arduino.cc,
#   evs.aayinltcs.arduino.cc     randomized-label subdomain under a shared
#                                 zone, `evs` (events) + `api` shape typical of
#                                 a CNAME-cloaked third-party telemetry vendor;
#                                 no recognizable Arduino-owned service name.
#
# The last entry is the SUBDOMAIN, not the `arduinocontent.cc` apex, for the
# same reason bare `arduino.cc` is excluded, and the zone shows why concretely:
# `www.arduinocontent.cc` and `assets.arduinocontent.cc` also have A records on
# the same Cloudflare pair (not a wildcard — a random label under the zone
# resolves to nothing), so an apex entry would sweep both in. The apex itself
# has no A record.
#
# `assets.arduinocontent.cc` is a WATCH ITEM for the next catalog pass, not an
# omission: it answers identically to `projects.` (same IP pair, and the same
# 111-byte `AccessDenied` XML body on a 403), consistent with the same content
# origin, but nothing referenced it from www.arduino.cc and no traffic has been
# observed against it. Per the "only template what you've seen used" rule it
# stays out. If a pass sees real bytes there, add it to `hosts:` — it resolves
# to IPs already in this app's sets, so it carries no new collateral.
# `www.arduinocontent.cc` returns a Cloudflare 530 with error code 1016 — an
# origin DNS failure, so its origin hostname doesn't resolve — and is not a
# surface at all.
#
# `arduinocontent.cc` is Arduino-operated, and whois shows it: the domain and
# `arduino.cc` share a registrant, `Qualcomm Incorporated` /
# `hostmast@qualcomm.com`, through the same registrar (MarkMonitor). Query it as
# `whois arduinocontent.cc` and let the referral run — the `.cc` registry
# (ccwhois.verisign-grs.com) is a THIN registry that returns no registrant
# fields at all, so a lookup that stops there looks redacted and is not.
hosts:
  - www.arduino.cc
  - cloud.arduino.cc
  - app.arduino.cc
  - create.arduino.cc
  - api2.arduino.cc
  - docs.arduino.cc
  - projecthub.arduino.cc
  - content.arduino.cc
  - cdn.arduino.cc
  - downloads.arduino.cc
  - projects.arduinocontent.cc
  - login.arduino.cc
  - projecthub-api.arduino.cc
  - builder.arduino.cc
