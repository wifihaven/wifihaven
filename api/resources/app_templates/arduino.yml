slug: arduino
name: Arduino
icon: "https://icons.duckduckgo.com/ip3/arduino.cc.ico"
icon_type: url
# Operator request: Arduino — the maker/electronics platform. The kid-facing
# surface is the Cloud Editor / Arduino Cloud plus the docs, Project Hub and
# IDE downloads.
#
# Host-set is the Arduino-operated SUBDOMAINS, NOT the `arduino.cc` apex — a
# deliberate deviation from the "apex hostnames" default in _README.yml, same
# pattern as `lego.yml`. Enforcement is IP-layer, so an apex entry would pull
# every subdomain's resolved IP into the `eb_` drop set, including five hosts
# across four third-party MULTI-TENANT platforms (each `dig`-verified):
#   store.arduino.cc, store-usa.arduino.cc  shops.myshopify.com → 23.227.38.74
#   forum.arduino.cc     arduino.hosted-by-discourse.com → 184.104.178.51
#   blog.arduino.cc      wp.wpenginepowered.com → 141.193.213.10/.11
#   support.arduino.cc   arduino.zendesk.com → 216.198.53.11/.54.11
# Blocking Arduino must not drop every Shopify store, Discourse community, WP
# Engine site or Zendesk help center on the device, and none of those five
# carries Arduino's own engagement bytes. The store is also a parent purchasing
# surface rather than something a kid engages with, which is the same call the
# #2740 pass made on Scholastic.
#
# Bare `arduino.cc` is omitted deliberately, and there is no way to keep it and
# still spare those five: render.lua emits `nftset=/<host>/` verbatim per host
# and dnsmasq matches by pure suffix, so an apex entry necessarily captures
# every child. It would also drag AWS CloudFront's shared 99.84.118.x pool
# (what the bare apex resolves to) into the drop set. Two residuals to record
# so a later author doesn't "fix" this by adding the apex back:
#   1. A device navigating to bare `arduino.cc` completes those hops — its IPs
#      are in no `eb_` set — and is dropped only on the follow-on `www` request.
#      Over plain HTTP the apex redirects twice (http://arduino.cc → 301 →
#      https://arduino.cc → 301 → https://www.arduino.cc), and the port-80 DNAT
#      block page won't render for the apex, so the user sees those redirects
#      and then a failed TLS handshake, not the block page.
#   2. Bytes to bare `arduino.cc` go unattributed against the app's budget:
#      HostMatch.matchesApex matches it against none of the hosts below.
#
# The kept hosts sit behind Cloudflare/CloudFront edges, which is the accepted
# Class-2 latent risk from _README.yml (branded per-app domains on a
# multi-tenant CDN — that IS where the app's bytes live, so stripping them
# would defeat the block). They are not all equally exposed, and if the #1663
# evidence loop ever revisits this set, `projects.arduinocontent.cc` is the
# member to look at first. Of the ten `*.arduino.cc` hosts, eight land on
# Arduino's own Cloudflare pair (104.18.12.135/104.18.13.135), `downloads` on
# 104.18.10.21/104.18.11.21 and `api2` on CloudFront 18.238.176.x — whereas that
# one lands on Cloudflare's broadly-shared 104.21.x / 172.67.x pool.
#
# Kept host-set, and what each surface is:
#   www.arduino.cc                main site
#   cloud.arduino.cc              Arduino Cloud
#   app.arduino.cc                Arduino Cloud web app / editor
#   create.arduino.cc             legacy Web Editor (Arduino Create)
#   api2.arduino.cc               Arduino Cloud API backend
#   docs.arduino.cc               documentation / language reference
#   projecthub.arduino.cc         Project Hub
#   content.arduino.cc            site content/assets
#   cdn.arduino.cc                static asset CDN
#   downloads.arduino.cc          IDE, cores and library downloads
#   projects.arduinocontent.cc    Project Hub content, on a separate domain
#
# The last entry is the SUBDOMAIN, not the `arduinocontent.cc` apex, for the
# same reason bare `arduino.cc` is excluded: an apex entry opts in to whatever
# Arduino puts under that zone next. It is also the only host that resolves
# there today — the apex itself has no A record.
#
# `arduinocontent.cc` is Arduino-operated, and whois shows it: the domain and
# `arduino.cc` share a registrant, `Qualcomm Incorporated` /
# `hostmast@qualcomm.com`, through the same registrar (MarkMonitor). Query it as
# `whois arduinocontent.cc` and let the referral run — the `.cc` registry
# (ccwhois.verisign-grs.com) is a THIN registry that returns no registrant
# fields at all, so a lookup that stops there looks redacted and is not.
hosts:
  - www.arduino.cc
  - cloud.arduino.cc
  - app.arduino.cc
  - create.arduino.cc
  - api2.arduino.cc
  - docs.arduino.cc
  - projecthub.arduino.cc
  - content.arduino.cc
  - cdn.arduino.cc
  - downloads.arduino.cc
  - projects.arduinocontent.cc
