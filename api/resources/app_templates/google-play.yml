# Added from prod evidence (#1705): operator-created in prod with the
# subdomain `play.google.com` — deliberately NOT the `google.com` apex
# (which is a shared-platform host and would pull in Search, Drive, every
# Google product per #1661). dnsmasq's nftset= suffix-matches every
# *.play.google.com subdomain (apps, content delivery) without touching
# any other google.com surface.
hosts:
