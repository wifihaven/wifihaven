slug: youtube
name: YouTube
# Emoji fallback: 📺
icon: "https://icons.duckduckgo.com/ip3/youtu.be.ico"
icon_type: url
# youtubei.googleapis.com is deliberately EXCLUDED from this set. It rides
# Google's shared *.googleapis.com GFE anycast pool (216.239.32-38.223) — the
# SAME front-end IPs that serve oauthaccountmanager.googleapis.com and the
# Drive / Calendar / Docs APIs. Because the block enforces at the IP layer
# (nftables drop on dst_ip ∈ eb_<host>), blocking youtubei poisons that shared
# pool and collateral-drops Google sign-in / Drive on the device (#1636).
# googlevideo.com below is YouTube's dedicated video-bytes pool, so keeping it
# in the set preserves the meaningful block (no video) without the collateral.
# youtubekids.com added from prod evidence (#2596: 2026-08-03 app-catalog
# pass): www.youtubekids.com observed on 3 separate kid devices — the YouTube
# Kids web app, same brand family as youtube.com.
#
# youtube-nocookie.com added from the #2774 orphan-driven pass. It is YouTube's
# privacy-enhanced EMBED domain: a video embedded on a third-party page with
# "enable privacy-enhanced mode" is served from
# `www.youtube-nocookie.com/embed/<id>` instead of youtube.com. Watching one is
# watching YouTube, so the time belongs in this app's budget — and it was not
# landing there. Prod, 30d: 31.9 MB / 334 hits on Kid Laptop, and 799
# proportional minutes over 14 days as an `orphanHosts` row attributed to no
# app at all.
#
# Read the exclusion above carefully before assuming this contradicts it — it
# does not. `youtubei.googleapis.com` is barred because it rides the shared
# *.googleapis.com VENDOR-API pool that also fronts Drive/OAuth/Calendar
# (README Class 1; #1636). `youtube-nocookie.com` is a YouTube-owned CONTENT
# domain, the same class as `youtube.com` itself, which this template has
# always carried, and it is not on the #2601 `SharedGfeHosts` ban list.
#
# The concrete version of "same class", checkable with one `dig`:
# `www.youtube-nocookie.com` CNAMEs to `youtube-ui.l.google.com` — the
# IDENTICAL target `www.youtubekids.com` resolves through, an entry this
# host-set has carried since #2596 and which has been enforcing in prod since.
# So the marginal enforcement surface this adds is one an already-shipped
# member of this same set already points at.
#
# Deliberately NOT justified by any claim about which IP ADDRESSES it shares
# with youtube.com: those answers are DNS-steered and move between lookups, so
# a pool-overlap argument would be unverifiable. The CNAME target is stable and
# checkable; the addresses behind it are not.
hosts:
  - youtube.com
  - youtu.be
  - ytimg.com
  - googlevideo.com
  - youtubekids.com
  - youtube-nocookie.com
