slug: eaglercraft
name: Eaglercraft
icon: "https://icons.duckduckgo.com/ip3/eaglercraft.dev.ico"
icon_type: url
# Added from prod evidence (#1705): kid-discovered Minecraft-in-browser
# clone. eaglercraft.dev is the marketing/launcher apex; the account-scoped
# workers.dev subdomain is the actual game runtime — included specifically
# because it's account-scoped (NOT the shared workers.dev apex, which would
# be a #1661 violation).
# eaglercraft.com added from prod evidence (#2058 app-catalog pass): a direct
# game mirror of the same Eaglercraft browser-Minecraft project (serves the
# launcher at eaglercraft.com/play), observed in active kid use but unattributed
# to this app. It's a game host, not an "unblocked games" proxy portal, so it
# extends the app host-set (not games.yml) per the operator's #1705 decision
# that Eaglercraft is a time-limited app, not a block target.
# eaglercraft.ru added from prod evidence (#2596: 2026-08-03 app-catalog pass):
# a third Eaglercraft mirror (cdn.eaglercraft.ru serves the game's WASM/asset
# bundle), already present in blocklists/games.yml from a prior blocklist pass
# (#2212) but not wired into this template — same dual-listing precedent as
# eaglercraft.com.
# eaglercraftgame.io added from prod evidence (#2699: 2026-08-14 app-catalog pass):
# a fourth mirror (eaglercraftgame.io — the game itself, no marketing-only
# subdomains observed), already present in blocklists/games.yml (#2599) but
# not wired into this template — same dual-listing precedent as .com/.ru.
# relay.lax1dude.net / relay.deev.is / relay.shhnowisnottheti.me added from
# the same pass: WebSocket relay servers the client falls back through for
# LAN/world-sharing multiplayer (web-confirmed — lax1dude is Eaglercraft's
# creator; the near-identical byte pattern across all three, each observed
# right after the other, is the client trying its relay list in order).
# Support infra for the app, not a game-hosting mirror, so kept out of
# games.yml (same reasoning as the account-scoped workers.dev entry above).
hosts:
  - eaglercraft.dev
  - eaglercraft.com
  - eaglercraft.ru
  - eaglercraftgame.io
  - eaglercraft-99f.workers.dev
  - relay.lax1dude.net
  - relay.deev.is
  - relay.shhnowisnottheti.me
