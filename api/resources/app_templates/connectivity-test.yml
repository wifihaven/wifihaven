slug: connectivity-test
name: Connectivity Test
icon: "https://icons.duckduckgo.com/ip3/neverssl.com.ico"
icon_type: url
# A deliberately blockable app whose only purpose is to PROVE enforcement works
# on a given deployment — added while validating prod for the beta launch
# (#2527), where there was no way to demonstrate a block end-to-end without
# blocking something a real household actually uses.
#
# WHY THESE TWO HOSTS, and why plain HTTP is the whole point.
#
# Blocking is IP-layer: a blocked host's resolved IPs land in the per-(MAC,
# host) `eb_` drop set and the kernel drops the flows. Over HTTPS that shows up
# as a failed handshake or a cert warning — the block IS working, but nothing
# renders, so it looks identical to a network fault. The block PAGE is only
# reachable over plain HTTP, because that is what the router DNATs to the local
# uhttpd listener. So a host that can be fetched over http:// without being
# upgraded is the only way to see the block page at all.
#
#   neverssl.com  — exists precisely to serve plain HTTP and never redirect to
#                   HTTPS (the standard captive-portal trick). Browsers'
#                   HTTPS-First upgrading does not rewrite it, so this is the
#                   host that reliably renders the block page.
#
# COLLATERAL — why this list is ONE host, and why example.com was removed.
#
# The first draft of this file also carried example.com, on the assumption that
# an IANA-reserved documentation domain sits on its own dedicated address. That
# was WRONG and was caught in review. It resolves into Cloudflare's shared
# anycast ranges:
#
#   example.com  -> 104.20.23.154, 172.66.147.243, 2606:4700:10::…
#                   (104.16.0.0/12, 172.64.0.0/13, 2606:4700::/32 — Cloudflare)
#   neverssl.com -> 34.223.124.45, 2600:1f13:…  (EC2; PTR
#                   ec2-34-223-124-45.us-west-2.compute.amazonaws.com — an
#                   address bound to a single instance — which is the property
#                   that matters for collateral. (Strictly, one instance could
#                   still be a reverse proxy for others; the PTR does not rule
#                   that out. Negligible here, but stated rather than glossed,
#                   since this file now holds itself to that bar.) Note it
#                   is deliberately not described as a "dedicated Elastic IP":
#                   the PTR does not establish that, and over-claiming from a
#                   plausible-looking lookup is what put example.com in this
#                   file in the first place.)
#
# Blocking a host on a shared pool is precisely the #1636 mechanism (YouTube's
# shared-GFE apex taking Drive/OAuth down with it) and precisely what the
# SHARED-POOL COLLATERAL section of _README.yml forbids. It is WORSE here than
# a quiet drop: the same `eb_` predicate drives the block-page DNAT, so an
# unrelated Cloudflare-fronted site sharing that IP would be served OUR block
# page or a cert warning. And an operator could not undo it locally — the
# seeder re-adds removed template hosts on every boot.
#
# So: neverssl.com carries the demo alone. That makes this app dependent on one
# third party we do not control and do not monitor — an accepted, deliberate
# tradeoff, because the alternative on offer was collateral damage. If a second
# host is ever added here, RESOLVE IT FIRST and confirm the addresses are
# dedicated; do not reason from what a domain is "for".
hosts:
  - neverssl.com
