#                               hostname (`coddy-15505`) is a project-specific
#                               literal, not a shared alias other tenants also
#                               answer on — same reasoning `amazon-telemetry.
#                               yml` uses for `unagi.amazon.com` on a shared
#                               cloud platform.
#
# `coddy.tech` is Cloudflare-fronted (104.26.x/172.67.x) — the standard
