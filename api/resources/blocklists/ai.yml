  # matches on the RESOLVED IP, and both front on Google's shared GFE pool.
  # Resolved from three different vantage points during review, notebooklm
  # returned three different /24s — 64.233.179.x (Drive's EXACT six-address set
  # at that moment) and 74.125.69.x, both recorded in the #2772 review thread,
  # plus 209.85.145.x from the author's own vantage, which is NOT in that
  # thread and rests on a single unrecorded observation — i.e. the host<->pool
  # mapping is resolver- and geo-dependent and cannot be relied on to stay
  # disjoint from Drive/Docs. One disjoint observation is not evidence of
  # safety; the observed collision is evidence of the hazard. Putting it in `bl_ai`
  # therefore risks dropping Google Drive for a kid MAC — precisely the #2601
  # collateral bug (see `shared/src/types/SharedGfeHosts.scala` and
  # `evidence/google-gfe-collateral-2601.md`). This is the same structural limit
  # §2 of evidence/ai-classification-2768.md describes for Search/Docs/Gmail.
  # Blocking Google's own AI surfaces is a product decision tracked in #2605,
