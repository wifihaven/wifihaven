  #
  # ── preemptive hardening (#2768), 2026-09-10 ────────────────────────────
  #
  # DEPARTURE FROM THE TRAFFIC-DRIVEN DEFAULT, and why it is justified here.
  # Every prior addition to this file was traffic-driven: an apex showed up in
  # a prod sweep, was classified, and was added. That discipline is right for
  # `ads` (where the `-extended` StevenBlack feed carries the long tail and the
  # curated list only needs the gaps) — but `ai` has NO upstream sibling feed,
  # so this file is the category's ONLY coverage. A list that can only ever add
  # what a kid has already successfully reached is, by construction, always one
  # step behind: the first visit to every new service succeeds. That is the
  # operator-reported failure mode this block addresses.
  #
  # The #2768 sweep (5 kid devices, 30d, ~80k connection events, 549 apexes)
  # found ZERO drops against this category and ZERO traffic to any dedicated AI
  # service — i.e. the curated list was NOT leaking. So these entries are
  # explicitly preemptive, not observed. They were selected as the consumer AI
  # surfaces a supervised minor is most likely to reach for, prioritising the
  # "free, no login, works around a block" tier over B2B platforms.
  #
  # Verification, stated precisely (the first cut of this block overclaimed it).
  # Every host below returned an A or AAAA record at the apex on re-check, and
  # was identity-checked. Two candidates were DROPPED on that re-check rather
  # than shipped: `play.ht` (no apex A/AAAA at all — the zone moved to Meta's
  # nameservers) and `figgs.ai` (parked on 0.0.0.0; the service is defunct). A
  # dead apex is not harmless here: a lapsed domain can be re-registered onto
  # shared hosting, at which point the entry silently becomes an IP-enforcement
  # target for someone else's infrastructure.
  #
  # COLLATERAL, stated honestly. No entry below is a CDN/cloud APEX
  # (cloudfront/fastly/akamai/amazonaws). That is a hostname-level property and
  # it is NOT the same as "no shared-IP collateral" — enforcement matches on the
  # resolved IP, and many of these are single-tenant names fronting on shared
  # anycast. Measured at authoring time, the largest clusters among the new
  # hosts are 76.76.21.21 (Vercel, 12 hosts), 216.150.1.1 (Vercel, 5) and
  # 198.202.211.1 (Webflow, 5). Resolving one host in a cluster puts that
  # address in `bl_ai`, so other tenants of the same frontend are dropped for
  # that MAC. This is accepted, not overlooked.
  #
  # Scope the claim to the 50-host BASELINE, never to
  # `main` — #2772 merged, so `main` now includes this pass and would make the
  # claim circular. That baseline already carried four hosts on 76.76.21.21
  # (pplx.ai, runwayml.com, udio.com, delphi.ai), so for that address the
  # exposure is unchanged in kind. It also already reached
  # 198.202.211.1 (jasper.ai, copy.ai). 216.150.1.1 is an address the baseline
  # did not touch — its nearest was lumalabs.ai on 216.150.1.129, the same
  # Vercel /24 (whois VERCEL-09, 216.150.1.0/24), so a neighbouring address in
  # the same shared block rather than a new frontend. Same class, still a newly
  # reached address.
  #
  # Proportion, with the method stated. NOT exactly reproducible, and say so:
  # this keys on exact A records, and CDN edge answers rotate per query and per
  # vantage, so the count over CDN-fronted names is a SNAPSHOT. Measured
  # 2026-09-10 from a single resolver; a re-measure a round later moved it by
  # two hosts (monica.im, pixai.art landing on a shared CloudFront edge). Expect
  # a couple either way and do not "correct" it in circles. Counting a host as
  # "shared" when at least one of its A records is also served for a DIFFERENT
  # host in the same list — each half counted against its OWN version of the
  # file, baseline against the 50 and added against the 147 — gives 13/50
  # before and 29/97 added. Counting instead by membership of published CDN
  # anycast ranges (Cloudflare + Fastly + the three /24s above) gives 30/50
  # before and 66/97 added. Widening the range set (more Vercel/Google/
  # CloudFront blocks) gives 36/50 -> 70/97, i.e. 72% -> 72%, +0.2pt — the
  # reading LEAST favourable to the "goes up" framing, given here rather than
  # gestured at, since the rule below is that both figures in a pair travel
  # together.
  #
  # State the direction honestly: the shared proportion goes UP slightly, not
  # down — 26.0% -> 29.9% (+3.9pt) by co-tenancy, 60% -> 68% (+8.0pt) by narrow
  # ranges. An earlier draft said "flat" and "did not worsen" — Δ = 0 and Δ <= 0
  # respectively; both assert a NON-INCREASE, and no method produces one. The
  # defensible claim is that it is
  # unchanged in ORDER, not that it improved. Both figures in a pair must travel
  # together or neither can be checked. See #2369, and do not read the CDN-apex
  # line as a clearance.
  #
  # Same host-scoping rules as the header: apexes (suffix-matched at the
  # router), product subdomains for shared vendors.
  #
  # Multi-model access — the highest-value bypass tier, because each one is a
