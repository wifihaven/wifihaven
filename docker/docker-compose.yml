# Local + CI staging stack.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# Then:
#   - browse to http://localhost:8080
#   - run e2e tests:  scripts/e2e-tests.sh && scripts/e2e-router.sh
#
# Used identically in GitHub Actions (.github/workflows/e2e.yml).
# fake-router registers as a router, polls /policy, and posts canned usage/events
# every few seconds — proving the OpenWRT API surface works end-to-end.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wifihaven
      POSTGRES_PASSWORD: wifihaven
      POSTGRES_DB: wifihaven
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifihaven -d wifihaven"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "5433:5432"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WIFIHAVEN_DB_HOST: postgres
      WIFIHAVEN_DB_PORT: "5432"
      WIFIHAVEN_DB_NAME: wifihaven
      WIFIHAVEN_DB_USER: wifihaven
      WIFIHAVEN_DB_PASSWORD: wifihaven
      WIFIHAVEN_HTTP_PORT: "8080"
      WIFIHAVEN_JWT_SECRET: "staging-jwt-secret-do-not-use-in-prod-32ch"
      # #612: allow the Vite dev server and the JVM-bundled SPA on localhost.
      WIFIHAVEN_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080"
      # #614: dev defaults to serving the bundled SPA at http://localhost:8080/.
      # Override with `WIFIHAVEN_SERVE_SPA=false docker compose up` to simulate
      # the Render API-only mode (non-/api/* paths return 404).
      WIFIHAVEN_SERVE_SPA: ${WIFIHAVEN_SERVE_SPA:-true}
    ports:
      - "0.0.0.0:8080:8080"
    healthcheck:
      # Login endpoint with bad creds → 401, which proves the API + DB are alive.
      # `curl -f` would treat 401 as failure, so we check the body shape instead.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://localhost:8080/api/auth/login | grep -qE '^(400|401)$'"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  fake-router:
    image: python:3.12-slim
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./fake-router.py:/fake-router.py:ro
    environment:
      API_BASE: "http://api:8080"
      ADMIN_USER: "admin"
      ADMIN_PASS: "changeme"
      ADMIN_NEW_PASS: "fake-router-bootstrap-pw-do-not-use-elsewhere"
      FAKE_ROUTER_SEED: "42"
      POLL_INTERVAL: "3"
      USAGE_INTERVAL: "10"
      EVENT_INTERVAL: "15"
    command: python /fake-router.py
    healthcheck:
      # Healthy once the registration token file is written.
      test: ["CMD-SHELL", "test -f /tmp/fake-router-token"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

