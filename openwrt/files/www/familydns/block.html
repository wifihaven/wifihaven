<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blocked</title>
<style>
body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;
     min-height:100vh;margin:0;background:#f5f5f5}
.card{background:#fff;border-radius:8px;padding:2rem 2.5rem;max-width:400px;
      box-shadow:0 2px 8px rgba(0,0,0,.12);text-align:center}
h1{color:#c0392b;margin-top:0}
p{color:#555;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <h1>&#128683; Blocked</h1>
  <p id="msg">This site is blocked by FamilyDNS.</p>
  <p><small id="detail"></small></p>
</div>
<script>
// Extract query params passed by the nftables DNAT redirect via CGI
// In production the init script patches API_URL; the default below is a fallback.
var API_URL = "FAMILYDNS_API_URL";

var host   = location.hostname;
var params = new URLSearchParams(location.search);
var reason = params.get("reason") || "blocked";
var mac    = params.get("mac")    || "";

document.getElementById("detail").textContent =
  host ? "Site: " + host : "";

// If API_URL was patched, redirect to the full block page immediately.
// Otherwise stay on this page — the parent can visit the admin UI directly.
if (API_URL && API_URL !== "FAMILYDNS_API_URL") {
  var dest = API_URL + "/blocked?host=" +
    encodeURIComponent(host) + "&reason=" +
    encodeURIComponent(reason) +
    (mac ? "&mac=" + encodeURIComponent(mac) : "");
  window.location.replace(dest);
}
</script>
</body>
</html>
