# wifihaven — allow DNAT from LAN clients to 127.0.0.1:8081 (block page).
#
# nftables `chain wifihaven_block_nat` (see render.lua) DNATs blocked HTTP/80
# traffic from LAN devices to 127.0.0.1:8081 (local uhttpd serving the block
# page). The kernel by default refuses to route packets whose destination is
# in 127.0.0.0/8 if they arrived on a non-loopback interface — so without
# this setting the DNAT'd packets are silently dropped at the routing
# decision and the user sees a hung connection instead of the block page.
#
# Scoped to br-lan only (the LAN bridge); we never want to route external
# loopback traffic in from WAN.
net.ipv4.conf.br-lan.route_localnet = 1
