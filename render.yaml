# Render Blueprint — wifihaven staging + production environments
#
# This file defines the API stack (web services + Postgres) on Render. The
# SPA moved to Cloudflare Pages in #613; see `.github/workflows/deploy-spa.yml`
# and `docs/deploy-cloud.md`. Do NOT add Static Site blocks back here — the
# SPA hosting boundary is intentionally split.
#
# Region: `oregon` (us-west). Operator is on the US West Coast — Oregon is
# the lowest-RTT US Render region. The OpenWRT agent polls every 5 s, so
# region choice affects steady-state load on both ends. Revisit if the
# operator relocates.
#
# Image tags (post-#588):
#   - staging tracks `:staging` — moved by Master CD's build-image job on
#     every successful build, before staging smoke runs.
#   - prod    tracks `:latest`  — moved ONLY by Master CD's retag-latest job,
#     after staging smoke passes (and, post-#498, manual approval).
# `autoDeploy: no` on both API services disables Render's poll-the-registry
# auto-deploy: only the explicit deploy hooks fired by Master CD promote.
#
# WIFIHAVEN_JWT_SECRET: `generateValue: true` runs ONCE at first apply. Do
# NOT rotate this value — rotating invalidates every admin session AND every
# router agent token, requiring a full re-pair of every deployed gateway.
#
# Tracked under #251 (umbrella render.com deploy effort).
# Staging closes #585; production + CDN closes #587. SPA migrated in #613.

services:
  # ── Staging API ────────────────────────────────────────────────────────────
  - type: web
    runtime: image
    name: wifihaven-api-staging
    # #1454: starter is the FLOOR for a working staging API — do NOT re-drop
    # to `free`. #1393's cost pass tried `free` (#1389 / #1386) to save ~$7/mo,
    # but the free tier cannot keep the JVM API serving: it spins down on idle
    # and the 0.1 CPU cold-start blew the CD smoke window, so staging returned
    # 502 and "Gate 1 — API contract smoke (staging)" failed. This is the same
    # regression #1268 originally fixed (free → starter). starter (~$7/mo) is
    # the minimum non-spin-down JVM-capable tier; any future staging cost trim
    # must come from a different lever (e.g. suspend staging when not
    # deploying), NOT from dropping to free.
    #
    # #1989: bumped starter → standard (2 GB). #1984/#1988 tried to fit the
    # JVM into starter's HARD 512 MB cgroup cap by bounding every memory
    # region, but it STILL OOM-killed under the (grown) CD smoke burst:
    # organic push run 28239722872 (post-#1988-deploy) saw staging
    # server_failed/oomKilled at 2026-06-26T13:17:41Z mid-Gate-1, surfacing as
    # `curl (22) 502` after the retry budget → Gate 1 / 3a / 3b red. Honest
    # tuning could not fit 512 MB, so per the operator's pre-authorized
    # fallback ("try JVM tuning, bump if needed") we move to standard — which
    # also makes staging memory-representative of prod. JVM_HEAP_OPTS below
    # now mirror prod rather than the (removed) 512 MB-fit envelope.
    plan: standard
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    # Promoted only by Master CD's deploy-staging job firing the staging
    # deploy hook. Render does NOT poll the registry — see header.
    autoDeploy: no
    image:
      url: ghcr.io/wifihaven/wifihaven-api:staging
    domains:
      - api-staging.wifihaven.net
    envVars:
      - key: WIFIHAVEN_DB_HOST
        fromDatabase:
          name: wifihaven-pg-staging
          property: host
      - key: WIFIHAVEN_DB_PORT
        fromDatabase:
          name: wifihaven-pg-staging
          property: port
      - key: WIFIHAVEN_DB_NAME
        fromDatabase:
          name: wifihaven-pg-staging
          property: database
      - key: WIFIHAVEN_DB_USER
        fromDatabase:
          name: wifihaven-pg-staging
          property: user
      - key: WIFIHAVEN_DB_PASSWORD
        fromDatabase:
          name: wifihaven-pg-staging
          property: password
      - key: WIFIHAVEN_HTTP_PORT
        value: 8080
      # #1221: HikariCP pool size. The HOCON default (5) crash-looped prod
      # under concurrent ingest + the time_used_daily rollup fiber + slow
      # UsageSeries reads (pool exhausted → 30s connectionTimeout → healthcheck
      # fails → crash loop). wifihaven-pg-staging is free (256 MB RAM → 100
      # max_connections). Staging is single-instance and low-traffic, so 8 is
      # ample and stays well clear of Render's reserved connections.
      - key: WIFIHAVEN_DB_POOL_SIZE
        value: "8"
      # #1989: now that staging is `standard` (2 GB, see plan note above) the
      # API no longer needs the cramped 512 MB-fit envelope #1984/#1988 added
      # (heap 288m + hard metaspace/codecache/direct caps + SerialGC) — which
      # proved insufficient anyway: it still OOM-killed under the CD smoke at
      # starter's 512 MB cap. Mirror prod's heap profile instead (see
      # wifihaven-api-prod JVM_HEAP_OPTS below) so staging is memory-
      # representative and the CD smoke runs against a prod-shaped heap.
      - key: JVM_HEAP_OPTS
        value: "-Xms512m -Xmx1400m"
      # Staging runs DEBUG so issues are visible in the Render log stream.
      - key: WIFIHAVEN_LOG_LEVEL
        value: DEBUG
      # Entrypoint warns if WIFIHAVEN_DEBUG is non-empty (mounts debug
      # endpoints on loopback). Keep explicitly empty in staging.
      - key: WIFIHAVEN_DEBUG
        value: ""
      # #612: SPA on https://staging.wifihaven.net calls this API cross-origin.
      # #1840: app-staging.wifihaven.net added additively (#1832 rename) — the
      # SPA now also fronts on app-staging.*; old origin kept through transition.
      - key: WIFIHAVEN_ALLOWED_ORIGINS
        value: "https://staging.wifihaven.net,https://app-staging.wifihaven.net"
      # #944: union into every profile's snapshot extraAllowed so a paused
      # operator can still reach the admin UI on staging. Staging-only —
      # MUST NOT include prod hosts (router would let them through too).
      # #1840: app-staging.wifihaven.net added additively (#1832 rename).
      - key: WIFIHAVEN_UI_ALLOWED_HOSTS
        value: "staging.wifihaven.net,api-staging.wifihaven.net,app-staging.wifihaven.net"
      # #1969: SPA-websocket Origin allowlist (design §8). HOSTS only (scheme/port
      # ignored) — the cross-site-upgrade backstop that pairs with the SameSite=Strict
      # wh_ws cookie. Staging-only hosts; mirrors the SPA origins above.
      - key: WIFIHAVEN_WS_ALLOWED_ORIGINS
        value: "staging.wifihaven.net,app-staging.wifihaven.net"
      # #614: SPA is served by the wifihaven-spa-staging Static Site (CDN).
      # The JVM still bundles a copy as a self-hosted fallback, but the API
      # origin must not serve it here — non-/api/* paths return 404.
      - key: WIFIHAVEN_SERVE_SPA
        value: "false"
      # Generated ONCE on first apply. Never rotate — see header.
      - key: WIFIHAVEN_JWT_SECRET
        generateValue: true
      # #1242: GET /metrics is internet-facing on Render, so gate it behind a
      # bearer token. Generated ONCE on first apply; share with the scraper.
      - key: WIFIHAVEN_METRICS_SCRAPE_TOKEN
        generateValue: true
      # #2266: the token is MANDATORY on this internet-facing deploy — an unset
      # token FAILS BOOT (AppConfig.validateRequired) rather than silently serving
      # /metrics unauthenticated. Safe because the token above is generateValue
      # (always present). Self-hosted leaves this false (loopback-open default).
      - key: WIFIHAVEN_METRICS_REQUIRE_TOKEN
        value: "true"
      # #1873: env label for the Loki appender (logback.xml reads ${WIFIHAVEN_ENV}).
      - key: WIFIHAVEN_ENV
        value: staging
      # #1873: Grafana Cloud Loki push endpoint + basic-auth creds for the
      # loki-logback-appender (api/resources/logback.xml). Render-managed secrets
      # set out of band — same sync:false pattern as GRAFANA_CLOUD_PROM_* on the
      # alloy worker below. Presence of GRAFANA_CLOUD_LOKI_URL is also the gate
      # that activates the appender (deployed envs only). URL is the Loki push API
      # (.../loki/api/v1/push); USER is the numeric instance id; PASSWORD is a
      # Grafana Cloud API token with logs-push scope. NEVER commit values.
      - key: GRAFANA_CLOUD_LOKI_URL
        sync: false
      - key: GRAFANA_CLOUD_LOKI_USER
        sync: false
      - key: GRAFANA_CLOUD_LOKI_PASSWORD
        sync: false
      # #2250: single per-environment SPA origin. The beta-invite link, Stripe
      # Checkout/Portal return, and the alert/email "review in dashboard" link all
      # derive from this in entrypoint.sh (each keeps its own override, but staging
      # sets only this one). Before #2250 the beta invite base had no env binding
      # and the email base no staging value, so both sent staging users to the prod
      # SPA. Prod sets the same key to https://app.wifihaven.net below.
      - key: WIFIHAVEN_APP_BASE_URL
        value: "https://app-staging.wifihaven.net"
      # #2135: Stripe billing (test mode on staging). Secrets (key + webhook signing
      # secret) are Render-managed sync:false — never committed. Price ids + promo
      # code are also sync:false because they differ between Stripe test and live
      # modes. Checkout/Portal returns resolve to the staging SPA via the shared
      # WIFIHAVEN_APP_BASE_URL above (#2250).
      # #2266: EXPLICIT enable flag (no dark-by-default). Staging bills in test mode,
      # and the test secretKey is already set here, so enabled=true validates cleanly;
      # an unset key under enabled=true would fail boot.
      # #2414: WIFIHAVEN_STRIPE_WEBHOOK_SECRET is required under enabled=true as well —
      # without it every Stripe webhook 200s and no-ops (Stripe never retries), so
      # subscription state never advances. It must hold the test-mode `whsec_…` signing
      # secret BEFORE this deploys, or staging boot fails loudly — which is the point.
      - key: WIFIHAVEN_STRIPE_ENABLED
        value: "true"
      - key: WIFIHAVEN_STRIPE_SECRET_KEY
        sync: false
      - key: WIFIHAVEN_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: WIFIHAVEN_STRIPE_PRICE_MONTHLY
        sync: false
      - key: WIFIHAVEN_STRIPE_PRICE_ANNUAL
        sync: false
      - key: WIFIHAVEN_STRIPE_FOUNDING_PROMO
        sync: false
      # #578: outbound email for block-page kid→parent access-request notifications
      # on STAGING. Secrets are sync:false (entrypoint.sh renders them into the config
      # `email {}` block). Uses the same Resend domain (wifihaven.net) as prod, so it
      # needs the domain verified (DNS) + a key set here to actually send. NEVER commit values.
      # #2266: EXPLICIT enable flag (no dark-by-default). Both email secrets are already
      # set here, so enabled=true validates cleanly; an unset secret under enabled=true
      # would fail boot.
      - key: WIFIHAVEN_EMAIL_ENABLED
        value: "true"
      - key: WIFIHAVEN_EMAIL_RESEND_API_KEY
        sync: false
      - key: WIFIHAVEN_EMAIL_FROM_ADDRESS
        sync: false
      # #2437: the OPERATOR mailbox every support/press ESCALATION notice is emailed to — the human
      # end of "a team member will follow up". REQUIRED whenever email is enabled AND a responder is
      # on: with it unset the API refuses to boot rather than silently drop escalations.
      # A per-service literal, not a secret: `sameer@wifihaven.net` is an on-domain ROLE alias whose
      # Cloudflare Email Routing rule (infra/cloudflare/main.tf `operator_personal_forward`) already
      # forwards to the operator's real inbox — and that alias is itself already committed there, so
      # naming it here discloses nothing new. Same handling as the support@/press@/alerts@ literals
      # elsewhere in this file; the operator's PERSONAL address stays out of the repo.
      - key: WIFIHAVEN_EMAIL_OPERATOR_ADDRESS
        value: sameer@wifihaven.net
      # #2199: Plain helpdesk integration on STAGING (test Plain workspace). Secrets are sync:false
      # (entrypoint.sh renders them into the config `support.plain {}` block). WEBHOOK_SECRET is
      # consumed by #2200. NEVER commit values.
      # #2266: EXPLICIT enable flags (no dark-by-default). The Plain secrets are already set on
      # staging, so widget + write enabled=true validate cleanly; an unset secret under an enabled
      # flag would fail boot.
      - key: WIFIHAVEN_SUPPORT_WIDGET_ENABLED
        value: "true"
      - key: WIFIHAVEN_SUPPORT_WRITE_ENABLED
        value: "true"
      # The machine-user key must carry the right `permissions` array or the customer/tenant
      # upserts 403 — permissions are set via GraphQL, not a UI toggle. See docs/ops/plain-setup.md §5.1.
      - key: WIFIHAVEN_SUPPORT_PLAIN_API_KEY
        sync: false
      - key: WIFIHAVEN_SUPPORT_PLAIN_WEBHOOK_SECRET
        sync: false
      - key: WIFIHAVEN_SUPPORT_PLAIN_IDENTITY_SECRET
        sync: false
      - key: WIFIHAVEN_SUPPORT_PLAIN_APP_ID
        sync: false
      # #2437: the Plain LABEL TYPE id (`lt_…`) the server applies when the support agent escalates,
      # so the operator can filter the inbox for "waiting on a human". NOT a secret — it is workspace
      # state (Settings → Labels, docs/ops/plain-setup.md §5.4), so it is committed here rather than
      # entered in the dashboard: declarative config beats a dashboard toggle, and a committed value
      # can't drift out from under the code. Workspace-specific — this is the STAGING (test) workspace's
      # `Needs human` label; prod's live workspace has a different id. The machine-user key ALSO needs
      # the `label:create` permission (§5.1) or the write 403s. REQUIRED when RESPONDER_ENABLED=true:
      # an escalation that cannot mark the thread is an invisible handoff, so boot fails instead.
      - key: WIFIHAVEN_SUPPORT_PLAIN_ESCALATION_LABEL_TYPE_ID
        value: lt_01KYFWXH8GM4JNEZ8C38GGSAP8
      # #2200: the Claude support responder on STAGING (test Plain + test Managed Agent). #2265: NO
      # dark-by-default — RESPONDER_ENABLED / ISSUE_FILING_ENABLED are explicit flags. RESPONDER is
      # flipped true at go-live (#2335), AFTER the claude-code-cloud routine secrets below were set —
      # config precedes code; with a flag true and any required key missing the API refuses to boot,
      # bulk-listing the gaps. ISSUE_FILING flipped true on STAGING at #2427; GITHUB_BOT_TOKEN
      # (fine-grained, Issues ONLY — read+write, since #2458's duplicate check LISTS open issues;
      # the structural no-PR scope is the absence of contents/pull_requests, #2241) MUST be set on the
      # service FIRST — with the flag true and the token unset the API REFUSES TO BOOT
      # (Config.missingRequiredKeys). Prod stays false until staging is validated AND prod's own
      # bot token is set. NEVER commit values.
      - key: WIFIHAVEN_SUPPORT_RESPONDER_ENABLED
        value: "true"
      - key: WIFIHAVEN_SUPPORT_ISSUE_FILING_ENABLED
        value: "true"
      # #2300: cloud-agent transport — "managed-agents" (Anthropic Managed Agents, API-credit billed)
      # or "claude-code-cloud" (a Claude Code Cloud routine fired per message, Claude-subscription
      # billed — the credit-free path). Only the selected transport's config chain is required at
      # boot; an unknown value fails boot. Flipped to claude-code-cloud at go-live (#2335) — the routine
      # id + token secrets below are set.
      - key: WIFIHAVEN_SUPPORT_DISPATCHER
        value: claude-code-cloud
      - key: WIFIHAVEN_SUPPORT_ANTHROPIC_API_KEY
        sync: false
      - key: WIFIHAVEN_SUPPORT_CLAUDE_AGENT_ID
        sync: false
      - key: WIFIHAVEN_SUPPORT_CLAUDE_ENVIRONMENT_ID
        sync: false
      # #2300: claude-code-cloud transport — the pre-provisioned routine id + its per-routine bearer
      # token (from the routine's "API trigger" in https://claude.ai/code/routines). Required only
      # when DISPATCHER=claude-code-cloud. NEVER commit values. ROUTINE_ID is the `trig_…` segment of
      # the fire URL. Two provisioning steps are NOT config and easy to miss (see
      # deploy/support-agent/README.md "Claude Code Cloud routine transport"): (1) the routine prompt
      # must be the transport-agnostic deploy/support-agent/agent.yaml `system:` block — a prompt
      # that never names <routine-fire-payload> makes the routine post NOTHING while still reporting a
      # green run; (2) the routine's cloud environment must allow-list the AGENT_API_BASE host
      # (Network access → Custom/Full), else the callback fails 403 host_not_allowed.
      - key: WIFIHAVEN_SUPPORT_CLAUDE_CODE_ROUTINE_ID
        sync: false
      - key: WIFIHAVEN_SUPPORT_CLAUDE_CODE_ROUTINE_TOKEN
        sync: false
      - key: WIFIHAVEN_SUPPORT_AGENT_TOKEN_SECRET
        generateValue: true
      - key: WIFIHAVEN_SUPPORT_AGENT_API_BASE
        value: https://api-staging.wifihaven.net
      # Deployment identity for the agent kickoff: staging sessions are operator tests, prod
      # sessions are real customers. A literal, not a secret.
      - key: WIFIHAVEN_SUPPORT_DEPLOYMENT_ENV
        value: staging
      - key: WIFIHAVEN_SUPPORT_GITHUB_BOT_TOKEN
        sync: false
      # #2429: the support inbox the SPA publishes to logged-in admins. STAGING routes through the
      # `support_staging_to_plain` Cloudflare Email Routing rule (infra/cloudflare/main.tf) into the
      # same Plain workspace. A literal, not a secret; required because the widget is enabled above.
      - key: WIFIHAVEN_SUPPORT_EMAIL_ADDRESS
        value: support@staging.wifihaven.net
      # #2203: the Claude PRESS/PR responder on STAGING. Press email arrives via Cloudflare Email
      # Routing → an Email Worker (deploy/press-worker/) that HMAC-signs + POSTs to /api/press/inbound;
      # the reply is EMAILED back to the sender via Resend (the WIFIHAVEN_EMAIL_* config above must be
      # set too). A SEPARATE Managed Agent persona from support; press being public, NO household data
      # path. WEBHOOK_SECRET is shared with the Worker. #2265: NO dark-by-default — RESPONDER_ENABLED
      # is an explicit flag (flip to true via PR at go-live, AFTER the secrets below AND email are set);
      # with it true and any required key missing the API refuses to boot. NEVER commit values.
      - key: WIFIHAVEN_PRESS_RESPONDER_ENABLED
        value: "true"
      # #2327: press cloud-agent transport — "managed-agents" (Anthropic Managed Agents, API-credit
      # billed) or "claude-code-cloud" (a Claude Code Cloud routine fired per message, Claude-
      # subscription billed — the credit-free path). Only the selected transport's config chain is
      # required at boot; an unknown value fails boot. Flip via PR alongside the routine secrets below.
      - key: WIFIHAVEN_PRESS_DISPATCHER
        value: claude-code-cloud
      - key: WIFIHAVEN_PRESS_WEBHOOK_SECRET
        sync: false
      - key: WIFIHAVEN_PRESS_ANTHROPIC_API_KEY
        sync: false
      - key: WIFIHAVEN_PRESS_CLAUDE_AGENT_ID
        sync: false
      - key: WIFIHAVEN_PRESS_CLAUDE_ENVIRONMENT_ID
        sync: false
      # #2327: claude-code-cloud transport — the pre-provisioned PRESS routine id + its per-routine
      # bearer token (from the routine's "API trigger" in https://claude.ai/code/routines). Required
      # only when DISPATCHER=claude-code-cloud. NEVER commit values. ROUTINE_ID is the `trig_…` segment
      # of the fire URL. Two provisioning steps are NOT config and easy to miss (see
      # deploy/press-agent/README.md "Claude Code Cloud routine transport"): (1) the routine prompt
      # must be the transport-agnostic deploy/press-agent/agent.yaml `system:` block — a prompt that
      # never names <routine-fire-payload> makes the routine post NOTHING while still reporting a green
      # run; (2) the routine's cloud environment must allow-list the AGENT_API_BASE host (Network
      # access → Custom/Full), else the callback fails 403 host_not_allowed.
      - key: WIFIHAVEN_PRESS_CLAUDE_CODE_ROUTINE_ID
        sync: false
      - key: WIFIHAVEN_PRESS_CLAUDE_CODE_ROUTINE_TOKEN
        sync: false
      - key: WIFIHAVEN_PRESS_AGENT_TOKEN_SECRET
        generateValue: true
      - key: WIFIHAVEN_PRESS_AGENT_API_BASE
        value: https://api-staging.wifihaven.net
      - key: WIFIHAVEN_PRESS_DEPLOYMENT_ENV
        value: staging
      # #2407: the press From-address the autonomous reply is sent FROM. Resend verifies per-DOMAIN
      # and only the apex wifihaven.net is verified, so staging borrows the apex as `press-staging@`
      # — `staging.wifihaven.net` is a separate, UNVERIFIED Resend domain and a From there would be
      # rejected outright under our `p=reject; sp=reject; adkim=s` DMARC.
      - key: WIFIHAVEN_PRESS_FROM_ADDRESS
        value: "WifiHaven Press <press-staging@wifihaven.net>"
      # #2407: Reply-To — the press mailbox the CF Email Worker actually watches, so a journalist's
      # human follow-up threads back into the responder pipeline. Reply-To is exempt from DMARC
      # alignment, so it may name the subdomain even though the From cannot. Both required when
      # RESPONDER_ENABLED=true.
      - key: WIFIHAVEN_PRESS_REPLY_TO_ADDRESS
        value: press@staging.wifihaven.net

  # ── Production API ─────────────────────────────────────────────────────────
  - type: web
    runtime: image
    name: wifihaven-api-prod
    plan: standard
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    # Promoted only by Master CD's deploy-prod-render job firing the prod
    # deploy hook, after staging smoke passes. Render does NOT poll the
    # registry — see header.
    autoDeploy: no
    image:
      url: ghcr.io/wifihaven/wifihaven-api:latest
    domains:
      - api.wifihaven.net
    envVars:
      - key: WIFIHAVEN_DB_HOST
        fromDatabase:
          name: wifihaven-pg-prod
          property: host
      - key: WIFIHAVEN_DB_PORT
        fromDatabase:
          name: wifihaven-pg-prod
          property: port
      - key: WIFIHAVEN_DB_NAME
        fromDatabase:
          name: wifihaven-pg-prod
          property: database
      - key: WIFIHAVEN_DB_USER
        fromDatabase:
          name: wifihaven-pg-prod
          property: user
      - key: WIFIHAVEN_DB_PASSWORD
        fromDatabase:
          name: wifihaven-pg-prod
          property: password
      - key: WIFIHAVEN_HTTP_PORT
        value: 8080
      # #1221: HikariCP pool size. The HOCON default (5) is fatal here — under
      # household load, concurrent router ingest POSTs + the time_used_daily
      # rollup fiber (#1165/#1167) + slow per-profile UsageSeries reads (#1099)
      # held all 5 connections, the 30s connectionTimeout fired, the healthcheck
      # failed, and Render crash-looped the instance (incident 2026-05-31).
      #
      # #1228: 20 was the over-correction that wedged prod on basic-256mb. The
      # Postgres connection cap was never the binding constraint there
      # (max_connections=103, verified live 2026-05-31, no per-role/per-db
      # connlimit) — the binding constraint was the 256 MB of DB RAM, where
      # every backend costs several MB. Render rolling deploys briefly run TWO
      # instances (old + new), so peak connections = 2×poolSize + the
      # rollup/seed fibers. At 20 that overlap (~40+ backends) pressured the
      # 256 MB instance enough that the NEW instance's startup queries stalled
      # — it logged "starting on 0.0.0.0:8080" but never bound the port, and
      # Render failed the deploy at the 15-min port-scan timeout (deploys
      # dep-d8e4p5… update_failed, prod went undeployable). #1228 dropped to 8
      # as a stopgap and pre-authorized raising it once the tier grew.
      #
      # #1251: prod Postgres is now basic-1gb (0.5 vCPU / 1 GB) — 4× the RAM
      # that was the actual ceiling — so we raise the pool to 12 as #1228
      # planned. Rolling-deploy peak is 2×12 = 24 backends plus a few
      # rollup/seed fibers. That sat comfortably under even basic-256mb's 103
      # connection cap (~4× headroom); basic-1gb's cap scales up with RAM, so
      # 24 has even more room, and the 1 GB of RAM absorbs 24 backends without
      # the startup-stall pressure that 40+ caused at 256 MB. Confirm against
      # `SHOW max_connections;` post-resize if ever pushing the pool higher.
      - key: WIFIHAVEN_DB_POOL_SIZE
        value: "12"
      # #786 / #785: bumped to `plan: standard` (2 GB / 1 CPU, $25/mo) after
      # prod started flapping under household load on free's 512 MB cap.
      # Heap sized to leave ~600 MB for OS + JIT + native; revisit if OOM
      # appears in logs or if growing dataset pushes `traffic_reports`
      # working set past the new ceiling.
      - key: JVM_HEAP_OPTS
        value: "-Xms512m -Xmx1400m"
      # Production uses INFO to avoid PII leakage in logs.
      # Resolves the TODO from #586 / PR #599.
      - key: WIFIHAVEN_LOG_LEVEL
        value: INFO
      # Keep explicitly empty — debug endpoints must never run in prod.
      - key: WIFIHAVEN_DEBUG
        value: ""
      # #612: SPA on https://wifihaven.net (apex + www) calls this API cross-origin.
      # #1840: app.wifihaven.net added additively (#1832 rename) — the SPA now
      # also fronts on app.*; apex + www kept through transition (no cut-over).
      - key: WIFIHAVEN_ALLOWED_ORIGINS
        value: "https://wifihaven.net,https://www.wifihaven.net,https://app.wifihaven.net"
      # #944: union into every profile's snapshot extraAllowed so a paused
      # operator can still reach the admin UI on prod. Prod-only — MUST NOT
      # include staging hosts (router would let them through too).
      # #1840: app.wifihaven.net added additively (#1832 rename).
      - key: WIFIHAVEN_UI_ALLOWED_HOSTS
        value: "wifihaven.net,www.wifihaven.net,api.wifihaven.net,app.wifihaven.net"
      # #1969: SPA-websocket Origin allowlist (design §8). HOSTS only (scheme/port
      # ignored) — the cross-site-upgrade backstop that pairs with the SameSite=Strict
      # wh_ws cookie. Mirrors the SPA origins above (where the dashboard ws client runs).
      - key: WIFIHAVEN_WS_ALLOWED_ORIGINS
        value: "wifihaven.net,www.wifihaven.net,app.wifihaven.net"
      # #614: SPA is served by the wifihaven-spa-prod Static Site (CDN).
      # The JVM still bundles a copy as a self-hosted fallback, but the API
      # origin must not serve it here — non-/api/* paths return 404.
      - key: WIFIHAVEN_SERVE_SPA
        value: "false"
      # Generated ONCE on first apply. Never rotate — see header.
      - key: WIFIHAVEN_JWT_SECRET
        generateValue: true
      # #1242: GET /metrics is internet-facing on Render, so gate it behind a
      # bearer token. Generated ONCE on first apply; share with the scraper.
      - key: WIFIHAVEN_METRICS_SCRAPE_TOKEN
        generateValue: true
      # #2266: the token is MANDATORY on this internet-facing deploy — an unset
      # token FAILS BOOT (AppConfig.validateRequired) rather than silently serving
      # /metrics unauthenticated. Safe because the token above is generateValue
      # (always present). Self-hosted leaves this false (loopback-open default).
      - key: WIFIHAVEN_METRICS_REQUIRE_TOKEN
        value: "true"
      # #1873: env label for the Loki appender (logback.xml reads ${WIFIHAVEN_ENV}).
      - key: WIFIHAVEN_ENV
        value: production
      # #1873: Grafana Cloud Loki push endpoint + basic-auth creds for the
      # loki-logback-appender (api/resources/logback.xml). Render-managed secrets
      # set out of band — same sync:false pattern as GRAFANA_CLOUD_PROM_* on the
      # alloy worker below. Presence of GRAFANA_CLOUD_LOKI_URL is also the gate
      # that activates the appender (deployed envs only). URL is the Loki push API
      # (.../loki/api/v1/push); USER is the numeric instance id; PASSWORD is a
      # Grafana Cloud API token with logs-push scope. NEVER commit values.
      - key: GRAFANA_CLOUD_LOKI_URL
        sync: false
      - key: GRAFANA_CLOUD_LOKI_USER
        sync: false
      - key: GRAFANA_CLOUD_LOKI_PASSWORD
        sync: false
      # #2250: single per-environment SPA origin (see staging block). Beta-invite,
      # Stripe Checkout/Portal return, and alert/email dashboard links all derive
      # from this in entrypoint.sh. Matches the code default, so this is also what
      # self-hosted/unset uses.
      - key: WIFIHAVEN_APP_BASE_URL
        value: "https://app.wifihaven.net"
      # #2135: Stripe billing (LIVE mode on prod). Secrets (key + webhook signing
      # secret) are Render-managed sync:false — never committed. Price ids + promo
      # code are also sync:false (live-mode values differ from staging's test-mode).
      # Checkout/Portal returns resolve to the prod SPA apex via the shared
      # WIFIHAVEN_APP_BASE_URL above (#2250).
      # #2266: EXPLICIT enable flag (no dark-by-default). Billing is DISABLED on prod —
      # the live-mode secretKey is not populated yet, and enabled=false means the unset
      # key can't fail boot. Flip to "true" ONLY once the live Stripe secrets are set here.
      # #2414: that flip now also requires WIFIHAVEN_STRIPE_WEBHOOK_SECRET (the live-mode
      # `whsec_…`) — enabled=true with it unset fails boot, deliberately, because otherwise
      # every webhook would 200 and no-op and no subscription would ever activate.
      - key: WIFIHAVEN_STRIPE_ENABLED
        value: "false"
      - key: WIFIHAVEN_STRIPE_SECRET_KEY
        sync: false
      - key: WIFIHAVEN_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: WIFIHAVEN_STRIPE_PRICE_MONTHLY
        sync: false
      - key: WIFIHAVEN_STRIPE_PRICE_ANNUAL
        sync: false
      - key: WIFIHAVEN_STRIPE_FOUNDING_PROMO
        sync: false
      # #578: outbound email for block-page kid→parent access-request notifications.
      # Secrets are sync:false (declared here, value entered out of band; entrypoint.sh
      # renders them into the config's `email {}` block). RESEND_API_KEY is a Resend key
      # ("re_…"); FROM_ADDRESS is a verified sender like "WifiHaven <alerts@wifihaven.net>".
      # NEVER commit values.
      # #2266: EXPLICIT enable flag (no dark-by-default). Both email secrets are already
      # set on prod, so enabled=true validates cleanly; an unset secret under enabled=true
      # would fail boot.
      - key: WIFIHAVEN_EMAIL_ENABLED
        value: "true"
      - key: WIFIHAVEN_EMAIL_RESEND_API_KEY
        sync: false
      - key: WIFIHAVEN_EMAIL_FROM_ADDRESS
        sync: false
      # #2437: the OPERATOR mailbox every support/press ESCALATION notice is emailed to — the human
      # end of "a team member will follow up". REQUIRED whenever email is enabled AND a responder is
      # on: with it unset the API refuses to boot rather than silently drop escalations.
      # A per-service literal, not a secret: `sameer@wifihaven.net` is an on-domain ROLE alias whose
      # Cloudflare Email Routing rule (infra/cloudflare/main.tf `operator_personal_forward`) already
      # forwards to the operator's real inbox — and that alias is itself already committed there, so
      # naming it here discloses nothing new. Same handling as the support@/press@/alerts@ literals
      # elsewhere in this file; the operator's PERSONAL address stays out of the repo.
      - key: WIFIHAVEN_EMAIL_OPERATOR_ADDRESS
        value: sameer@wifihaven.net
      # #2199: Plain helpdesk integration on PROD (live Plain workspace). Secrets are sync:false
      # (entrypoint.sh renders them into the config `support.plain {}` block). WEBHOOK_SECRET is
      # consumed by #2200 (the Claude responder). NEVER commit values.
      # #2266: EXPLICIT enable flags (no dark-by-default). The Plain secrets are already set on prod,
      # so widget + write enabled=true validate cleanly; an unset secret under an enabled flag would
      # fail boot.
      - key: WIFIHAVEN_SUPPORT_WIDGET_ENABLED
        value: "true"
      - key: WIFIHAVEN_SUPPORT_WRITE_ENABLED
        value: "true"
      # The machine-user key must carry the right `permissions` array or the customer/tenant
      # upserts 403 — permissions are set via GraphQL, not a UI toggle. See docs/ops/plain-setup.md §5.1.
      - key: WIFIHAVEN_SUPPORT_PLAIN_API_KEY
        sync: false
      - key: WIFIHAVEN_SUPPORT_PLAIN_WEBHOOK_SECRET
        sync: false
      - key: WIFIHAVEN_SUPPORT_PLAIN_IDENTITY_SECRET
        sync: false
      - key: WIFIHAVEN_SUPPORT_PLAIN_APP_ID
        sync: false
      # #2437: the Plain LABEL TYPE id (`lt_…`) the server applies when the support agent escalates,
      # so the operator can filter the inbox for "waiting on a human". NOT a secret — workspace state
      # (Settings → Labels, docs/ops/plain-setup.md §5.4), so it is committed rather than dashboard-set,
      # the same as staging above. This is the LIVE workspace's `Needs human` label, created 2026-07-29
      # and committed here as the boot gate requires (with RESPONDER_ENABLED=true and this unset the
      # API refuses to boot) — a DIFFERENT id from staging's, as expected for a different workspace.
      - key: WIFIHAVEN_SUPPORT_PLAIN_ESCALATION_LABEL_TYPE_ID
        value: lt_01KYTM9YRBKHYWBF6TG3ZRPN1Y
      # #2200: the Claude support responder on PROD (live Plain + prod Managed Agent). #2265: NO
      # dark-by-default — same explicit-flag pattern as staging; flipped true by #2537 at go-live
      # once the secrets were set (a true flag with missing keys refuses to boot, bulk-listing the
      # gaps). NOTE the flag alone does not make support REACHABLE here: prod's Plain workspace
      # still posts no webhook to this API (#2543), so the responder is on but never invoked.
      # GITHUB_BOT_TOKEN is the fine-grained Issues-ONLY support-bot credential — read+write, since
      # #2458's duplicate check LISTS open issues (structural no-PR is the absence of
      # contents/pull_requests, #2241). NEVER commit values.
      - key: WIFIHAVEN_SUPPORT_RESPONDER_ENABLED
        value: "true"
      - key: WIFIHAVEN_SUPPORT_ISSUE_FILING_ENABLED
        value: "false"
      # #2300: cloud-agent transport — "managed-agents" (Anthropic Managed Agents, API-credit billed)
      # or "claude-code-cloud" (a Claude Code Cloud routine fired per message, Claude-subscription
      # billed — the credit-free path). Only the selected transport's config chain is required at
      # boot; an unknown value fails boot. Flip via PR alongside the routine secrets below.
      - key: WIFIHAVEN_SUPPORT_DISPATCHER
        value: claude-code-cloud
      - key: WIFIHAVEN_SUPPORT_ANTHROPIC_API_KEY
        sync: false
      - key: WIFIHAVEN_SUPPORT_CLAUDE_AGENT_ID
        sync: false
      - key: WIFIHAVEN_SUPPORT_CLAUDE_ENVIRONMENT_ID
        sync: false
      # #2300: claude-code-cloud transport — the pre-provisioned routine id + its per-routine bearer
      # token (from the routine's "API trigger" in https://claude.ai/code/routines). Required only
      # when DISPATCHER=claude-code-cloud. NEVER commit values. ROUTINE_ID is the `trig_…` segment of
      # the fire URL. Two provisioning steps are NOT config and easy to miss (see
      # deploy/support-agent/README.md "Claude Code Cloud routine transport"): (1) the routine prompt
      # must be the transport-agnostic deploy/support-agent/agent.yaml `system:` block — a prompt
      # that never names <routine-fire-payload> makes the routine post NOTHING while still reporting a
      # green run; (2) the routine's cloud environment must allow-list the AGENT_API_BASE host
      # (Network access → Custom/Full), else the callback fails 403 host_not_allowed.
      - key: WIFIHAVEN_SUPPORT_CLAUDE_CODE_ROUTINE_ID
        sync: false
      - key: WIFIHAVEN_SUPPORT_CLAUDE_CODE_ROUTINE_TOKEN
        sync: false
      - key: WIFIHAVEN_SUPPORT_AGENT_TOKEN_SECRET
        generateValue: true
      - key: WIFIHAVEN_SUPPORT_AGENT_API_BASE
        value: https://api.wifihaven.net
      # Deployment identity for the agent kickoff: prod sessions are real customers. A literal.
      - key: WIFIHAVEN_SUPPORT_DEPLOYMENT_ENV
        value: prod
      - key: WIFIHAVEN_SUPPORT_GITHUB_BOT_TOKEN
        sync: false
      # #2429: the support inbox the SPA publishes to logged-in admins. PROD routes through the
      # `support_to_plain` Cloudflare Email Routing rule (infra/cloudflare/main.tf) into Plain.
      # A literal, not a secret; required because the widget is enabled above.
      - key: WIFIHAVEN_SUPPORT_EMAIL_ADDRESS
        value: support@wifihaven.net
      # #2203: the Claude PRESS/PR responder on PROD (live press@ Email Worker + prod Managed Agent).
      # Press email arrives via Cloudflare Email Routing → an Email Worker → /api/press/inbound; the
      # reply is EMAILED back to the sender via Resend (WIFIHAVEN_EMAIL_* must be set). A SEPARATE
      # Managed Agent persona from support; press is public so NO household data path. WEBHOOK_SECRET
      # is shared with the Worker. #2265: NO dark-by-default — RESPONDER_ENABLED was flipped true by
      # #2537 at go-live, AFTER the secrets AND email were set. Unlike support above, press IS
      # reachable here: the Email Worker already posts to this API. NEVER commit values.
      - key: WIFIHAVEN_PRESS_RESPONDER_ENABLED
        value: "true"
      # #2327: press cloud-agent transport — "managed-agents" (Anthropic Managed Agents, API-credit
      # billed) or "claude-code-cloud" (a Claude Code Cloud routine fired per message, Claude-
      # subscription billed — the credit-free path). Only the selected transport's config chain is
      # required at boot; an unknown value fails boot. Flip via PR alongside the routine secrets below.
      - key: WIFIHAVEN_PRESS_DISPATCHER
        value: claude-code-cloud
      - key: WIFIHAVEN_PRESS_WEBHOOK_SECRET
        sync: false
      - key: WIFIHAVEN_PRESS_ANTHROPIC_API_KEY
        sync: false
      - key: WIFIHAVEN_PRESS_CLAUDE_AGENT_ID
        sync: false
      - key: WIFIHAVEN_PRESS_CLAUDE_ENVIRONMENT_ID
        sync: false
      # #2327: claude-code-cloud transport — the pre-provisioned PRESS routine id + its per-routine
      # bearer token (from the routine's "API trigger" in https://claude.ai/code/routines). Required
      # only when DISPATCHER=claude-code-cloud. NEVER commit values. ROUTINE_ID is the `trig_…` segment
      # of the fire URL. Two provisioning steps are NOT config and easy to miss (see
      # deploy/press-agent/README.md "Claude Code Cloud routine transport"): (1) the routine prompt
      # must be the transport-agnostic deploy/press-agent/agent.yaml `system:` block — a prompt that
      # never names <routine-fire-payload> makes the routine post NOTHING while still reporting a green
      # run; (2) the routine's cloud environment must allow-list the AGENT_API_BASE host (Network
      # access → Custom/Full), else the callback fails 403 host_not_allowed.
      - key: WIFIHAVEN_PRESS_CLAUDE_CODE_ROUTINE_ID
        sync: false
      - key: WIFIHAVEN_PRESS_CLAUDE_CODE_ROUTINE_TOKEN
        sync: false
      - key: WIFIHAVEN_PRESS_AGENT_TOKEN_SECRET
        generateValue: true
      - key: WIFIHAVEN_PRESS_AGENT_API_BASE
        value: https://api.wifihaven.net
      - key: WIFIHAVEN_PRESS_DEPLOYMENT_ENV
        value: prod
      # #2407: the press From-address the autonomous reply is sent FROM. The apex wifihaven.net IS a
      # verified Resend sending domain, so prod's From and Reply-To are the same mailbox — unlike
      # staging, which must borrow the apex because staging.wifihaven.net is unverified.
      - key: WIFIHAVEN_PRESS_FROM_ADDRESS
        value: "WifiHaven Press <press@wifihaven.net>"
      # #2407: Reply-To — the press mailbox the CF Email Worker watches, so a journalist's human
      # follow-up threads back into the responder pipeline. Both required when RESPONDER_ENABLED=true.
      - key: WIFIHAVEN_PRESS_REPLY_TO_ADDRESS
        value: press@wifihaven.net

  # ── Metrics collector: Grafana Alloy → Grafana Cloud ─────────────────────────
  # #1208: the cloud APP-metrics path. Alloy (Prometheus agent-mode) scrapes
  # each API's INTERNAL Render address — http://wifihaven-api-{prod,staging}:8080
  # /metrics, never the public api.wifihaven.net — and remote_writes the samples
  # to Grafana Cloud Prometheus. Config is checked in at deploy/alloy/config.alloy
  # and baked into a thin image via deploy/alloy/Dockerfile (a runtime:image
  # service can't mount a repo-local config). See docs/design/metrics-observability.md §6.2.
  #
  # NON-CRITICAL (design §6.2): a metrics outage must never affect API
  # availability or block an API deploy. Nothing here is a dependency of either
  # API service, and neither API depends on this — the two surfaces fail
  # independently. This is the APP-metrics producer only; Render's own INFRA
  # metrics (managed-Postgres CPU/conns/disk) stream separately via #1244.
  #
  # type:worker — Alloy has no inbound role (it pulls + pushes), so no port and
  # no health check. Render workers have no free tier; `starter` is the floor.
  # Must be region:oregon to share the private network with the API services
  # (cross-region private networking isn't available).
  #
  # autoDeploy:no keeps promotion explicit (manual deploy / `render blueprint
  # apply`), consistent with the API services. A config.alloy change applies on
  # the next deploy of this service; it never rides the API CD pipeline.
  - type: worker
    runtime: docker
    name: wifihaven-alloy
    plan: starter
    region: oregon
    autoDeploy: no
    dockerfilePath: ./deploy/alloy/Dockerfile
    dockerContext: ./deploy/alloy
    envVars:
      # Scrape bearer tokens — pulled from each API service's generated
      # WIFIHAVEN_METRICS_SCRAPE_TOKEN (#1242) so the values stay in sync
      # without being committed or hand-copied. config.alloy reads these via
      # sys.env(...).
      - key: WIFIHAVEN_METRICS_SCRAPE_TOKEN_PROD
        fromService:
          name: wifihaven-api-prod
          type: web
          envVarKey: WIFIHAVEN_METRICS_SCRAPE_TOKEN
      - key: WIFIHAVEN_METRICS_SCRAPE_TOKEN_STAGING
        fromService:
          name: wifihaven-api-staging
          type: web
          envVarKey: WIFIHAVEN_METRICS_SCRAPE_TOKEN
      # Grafana Cloud Prometheus remote_write target + credentials. Values are
      # Render-managed secrets set in the dashboard (out of band) — same
      # sync:false pattern as other secrets. URL is the Grafana Cloud
      # remote_write endpoint; USER is the numeric instance id; PASSWORD is a
      # Grafana Cloud API token with metrics-push scope.
      - key: GRAFANA_CLOUD_PROM_URL
        sync: false
      - key: GRAFANA_CLOUD_PROM_USER
        sync: false
      - key: GRAFANA_CLOUD_PROM_PASSWORD
        sync: false

  # ── Deploy-event annotations moved to GitHub Actions (#1390) ─────────────────
  # The standalone `wifihaven-deploy-webhook` Render service was retired here.
  # GitHub Actions already drives every Render deploy (via the staging/prod
  # deploy hooks, see master-api-ui.yml) and knows the git sha + deploy
  # outcome, so it POSTs Grafana annotations directly — the Render-side
  # webhook receiver was a redundant hop. Annotation wiring lives at
  # `.github/workflows/master-api-ui.yml` via
  # `.github/actions/grafana-annotation`. Saves ~$7/mo (the previous service
  # was pinned to Render's `starter` worker floor). Operator follow-up:
  # delete the Render webhook + dashboard secrets on the API services after
  # apply.

databases:
  # ── Staging Postgres ───────────────────────────────────────────────────────
  # Free plan — staging data is expendable; recreation is a feature (#585).
  - name: wifihaven-pg-staging
    plan: free
    postgresMajorVersion: 16
    region: oregon

  # ── Production Postgres ────────────────────────────────────────────────────
  # Paid plan — free PG expires after ~30 days, which would nuke household
  # data. Paid tiers include daily backups; verify in the Render dashboard
  # after first apply: Databases → wifihaven-pg-prod → Backups tab.
  #
  # #1251: bumped basic-256mb (0.1 vCPU / 256 MB) → basic-1gb (0.5 vCPU /
  # 1 GB). On basic-256mb the CPU rode the 0.1-vCPU ceiling *continuously*
  # (measured 0.07–0.10 over 2026-05-31 21:25–21:33 UTC, single instance, no
  # deploy overlap) from steady router-ingest + dashboard + autovacuum, and
  # RAM sat at ~85% (183–220 MB / 256 MB) — also the connection-overlap
  # pressure behind the deploy startup stalls (#1228/#1248). The 0.1-vCPU peg
  # is a tier limit, not a workload spike, so rollup-cadence work (#1230/#1231)
  # cannot create headroom the tier physically lacks. basic-1gb gives 5× CPU
  # and 4× RAM, clearing both. Pool raised to 12 in tandem — see web_service.
  - name: wifihaven-pg-prod
    plan: basic-1gb
    postgresMajorVersion: 16
    region: oregon
