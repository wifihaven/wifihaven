# Render Blueprint — wifihaven staging + production environments
#
# This file defines the API stack (web services + Postgres) on Render. The
# SPA moved to Cloudflare Pages in #613; see `.github/workflows/deploy-spa.yml`
# and `docs/deploy-cloud.md`. Do NOT add Static Site blocks back here — the
# SPA hosting boundary is intentionally split.
#
# Region: `oregon` (us-west). Operator is on the US West Coast — Oregon is
# the lowest-RTT US Render region. The OpenWRT agent polls every 5 s, so
# region choice affects steady-state load on both ends. Revisit if the
# operator relocates.
#
# Image tags (post-#588):
#   - staging tracks `:staging` — moved by Master CD's build-image job on
#     every successful build, before staging smoke runs.
#   - prod    tracks `:latest`  — moved ONLY by Master CD's retag-latest job,
#     after staging smoke passes (and, post-#498, manual approval).
# `autoDeploy: no` on both API services disables Render's poll-the-registry
# auto-deploy: only the explicit deploy hooks fired by Master CD promote.
#
# WIFIHAVEN_JWT_SECRET: `generateValue: true` runs ONCE at first apply. Do
# NOT rotate this value — rotating invalidates every admin session AND every
# router agent token, requiring a full re-pair of every deployed gateway.
#
# Tracked under #251 (umbrella render.com deploy effort).
# Staging closes #585; production + CDN closes #587. SPA migrated in #613.

services:
  # ── Staging API ────────────────────────────────────────────────────────────
  - type: web
    runtime: image
    name: wifihaven-api-staging
    plan: free
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    # Promoted only by Master CD's deploy-staging job firing the staging
    # deploy hook. Render does NOT poll the registry — see header.
    autoDeploy: no
    image:
      url: ghcr.io/wifihaven/wifihaven-api:staging
    domains:
      - api-staging.wifihaven.net
    envVars:
      - key: WIFIHAVEN_DB_HOST
        fromDatabase:
          name: wifihaven-pg-staging
          property: host
      - key: WIFIHAVEN_DB_PORT
        fromDatabase:
          name: wifihaven-pg-staging
          property: port
      - key: WIFIHAVEN_DB_NAME
        fromDatabase:
          name: wifihaven-pg-staging
          property: database
      - key: WIFIHAVEN_DB_USER
        fromDatabase:
          name: wifihaven-pg-staging
          property: user
      - key: WIFIHAVEN_DB_PASSWORD
        fromDatabase:
          name: wifihaven-pg-staging
          property: password
      - key: WIFIHAVEN_HTTP_PORT
        value: 8080
      # #590: Render Hobby caps at ~512 MB. Leave headroom for OS + JIT +
      # native heap; bump or move to `plan: pro` if OOM appears in logs.
      - key: JVM_HEAP_OPTS
        value: "-Xms256m -Xmx384m"
      # Staging runs DEBUG so issues are visible in the Render log stream.
      - key: WIFIHAVEN_LOG_LEVEL
        value: DEBUG
      # Entrypoint warns if WIFIHAVEN_DEBUG is non-empty (mounts debug
      # endpoints on loopback). Keep explicitly empty in staging.
      - key: WIFIHAVEN_DEBUG
        value: ""
      # #612: SPA on https://staging.wifihaven.net calls this API cross-origin.
      - key: WIFIHAVEN_ALLOWED_ORIGINS
        value: "https://staging.wifihaven.net"
      # #944: union into every profile's snapshot extraAllowed so a paused
      # operator can still reach the admin UI on staging. Staging-only —
      # MUST NOT include prod hosts (router would let them through too).
      - key: WIFIHAVEN_UI_ALLOWED_HOSTS
        value: "staging.wifihaven.net,api-staging.wifihaven.net"
      # #1174: public SPA base URL. The router agent ships this to every
      # gateway, and the block-page handler uses it as the redirect dest so
      # blocked kids land on the SPA (which serves /blocked) instead of the
      # API origin (which 404s non-/api paths). Staging-only.
      - key: WIFIHAVEN_SPA_BASE_URL
        value: "https://staging.wifihaven.net"
      # #614: SPA is served by the wifihaven-spa-staging Static Site (CDN).
      # The JVM still bundles a copy as a self-hosted fallback, but the API
      # origin must not serve it here — non-/api/* paths return 404.
      - key: WIFIHAVEN_SERVE_SPA
        value: "false"
      # Generated ONCE on first apply. Never rotate — see header.
      - key: WIFIHAVEN_JWT_SECRET
        generateValue: true

  # ── Production API ─────────────────────────────────────────────────────────
  - type: web
    runtime: image
    name: wifihaven-api-prod
    plan: standard
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    # Promoted only by Master CD's deploy-prod-render job firing the prod
    # deploy hook, after staging smoke passes. Render does NOT poll the
    # registry — see header.
    autoDeploy: no
    image:
      url: ghcr.io/wifihaven/wifihaven-api:latest
    domains:
      - api.wifihaven.net
    envVars:
      - key: WIFIHAVEN_DB_HOST
        fromDatabase:
          name: wifihaven-pg-prod
          property: host
      - key: WIFIHAVEN_DB_PORT
        fromDatabase:
          name: wifihaven-pg-prod
          property: port
      - key: WIFIHAVEN_DB_NAME
        fromDatabase:
          name: wifihaven-pg-prod
          property: database
      - key: WIFIHAVEN_DB_USER
        fromDatabase:
          name: wifihaven-pg-prod
          property: user
      - key: WIFIHAVEN_DB_PASSWORD
        fromDatabase:
          name: wifihaven-pg-prod
          property: password
      - key: WIFIHAVEN_HTTP_PORT
        value: 8080
      # #786 / #785: bumped to `plan: standard` (2 GB / 1 CPU, $25/mo) after
      # prod started flapping under household load on free's 512 MB cap.
      # Heap sized to leave ~600 MB for OS + JIT + native; revisit if OOM
      # appears in logs or if growing dataset pushes `traffic_reports`
      # working set past the new ceiling.
      - key: JVM_HEAP_OPTS
        value: "-Xms512m -Xmx1400m"
      # Production uses INFO to avoid PII leakage in logs.
      # Resolves the TODO from #586 / PR #599.
      - key: WIFIHAVEN_LOG_LEVEL
        value: INFO
      # Keep explicitly empty — debug endpoints must never run in prod.
      - key: WIFIHAVEN_DEBUG
        value: ""
      # #612: SPA on https://wifihaven.net (apex + www) calls this API cross-origin.
      - key: WIFIHAVEN_ALLOWED_ORIGINS
        value: "https://wifihaven.net,https://www.wifihaven.net"
      # #944: union into every profile's snapshot extraAllowed so a paused
      # operator can still reach the admin UI on prod. Prod-only — MUST NOT
      # include staging hosts (router would let them through too).
      - key: WIFIHAVEN_UI_ALLOWED_HOSTS
        value: "wifihaven.net,www.wifihaven.net,api.wifihaven.net"
      # #1174: public SPA base URL. The router agent ships this to every
      # gateway, and the block-page handler uses it as the redirect dest so
      # blocked kids land on the SPA (which serves /blocked) instead of the
      # API origin (which 404s non-/api paths). Prod-only — when this gets
      # cut to https://app.wifihaven.net per #1171, update here.
      - key: WIFIHAVEN_SPA_BASE_URL
        value: "https://wifihaven.net"
      # #614: SPA is served by the wifihaven-spa-prod Static Site (CDN).
      # The JVM still bundles a copy as a self-hosted fallback, but the API
      # origin must not serve it here — non-/api/* paths return 404.
      - key: WIFIHAVEN_SERVE_SPA
        value: "false"
      # Generated ONCE on first apply. Never rotate — see header.
      - key: WIFIHAVEN_JWT_SECRET
        generateValue: true

databases:
  # ── Staging Postgres ───────────────────────────────────────────────────────
  # Free plan — staging data is expendable; recreation is a feature (#585).
  - name: wifihaven-pg-staging
    plan: free
    postgresMajorVersion: 16
    region: oregon

  # ── Production Postgres ────────────────────────────────────────────────────
  # Paid plan (basic-256mb) — free PG expires after ~30 days, which would
  # nuke household data. The basic-256mb tier is the cheapest paid Render
  # Managed Postgres plan and includes daily backups. Verify in the Render
  # dashboard after first apply: Databases → wifihaven-pg-prod → Backups tab.
  - name: wifihaven-pg-prod
    plan: basic-256mb
    postgresMajorVersion: 16
    region: oregon
