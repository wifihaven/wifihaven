# Cloudflare Pages config — marketing site project (#1842 / epic #1832).
#
# Fronts the apex (wifihaven.net) + www. Distinct from the SPA, which lives on
# the `wifihaven` project at app.wifihaven.net. CI deploys this via
# `wrangler pages deploy` from .github/workflows/master-marketing.yml.
#
# The project (`wifihaven-www`) and its custom domains / DNS are declared in
# infra/cloudflare/main.tf and created by the master-cloudflare apply. The
# query-preserving `/blocked` router-compat shim and the www/staging → app
# redirects live in that same Terraform (a zone-level dynamic-redirect ruleset),
# NOT in a Pages `_redirects` file — the edge ruleset fires before Pages serves
# content, so the static catch-all here can never shadow the /blocked shim.

name = "wifihaven-www"
pages_build_output_dir = "./site"
compatibility_date = "2026-06-23"
